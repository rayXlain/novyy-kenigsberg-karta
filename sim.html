function md(text){
  const forkIdx = {}; DATA.forks.forEach((f,i) => forkIdx[f.name] = i);
  const inline = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,alias) => {
      const txt = alias||t, pr = byName[t];
      if(pr) return '<span class="wl" data-go="p:'+pr.id+'">'+txt+'</span>';
      if(t in forkIdx) return '<span class="wl" data-fork="'+forkIdx[t]+'">'+txt+'</span>';
      return '<span class="wl dead">'+txt+'</span>';
    });
  const blocks = [], last = () => blocks[blocks.length-1];
  (text||'').split(/\r?\n/).forEach(raw => {
    const l = raw.trim();
    if(!l){ blocks.push({t:'gap'}); return; }
    if(/^#{1,6}\s/.test(l)){ blocks.push({t:'h',lines:[l.replace(/^#{1,6}\s/,'')]}); return; }
    if(/^[-*]\s/.test(l)){ blocks.push({t:'li',lines:[l.slice(2).replace(/[;.]$/,'')]}); return; }
    if(/^\d+[.)]\s/.test(l)){ blocks.push({t:'oli',lines:[l.replace(/^\d+[.)]\s/,'')]}); return; }
    if(/^>/.test(l)){ blocks.push({t:'note',lines:[l.replace(/^>\s*/,'').replace(/^\[!\w+\]\s*/,'')]}); return; }
    if(/^---+$/.test(l)){ blocks.push({t:'hr'}); return; }
    const L = last();
    if(L && ['p','li','oli','note'].includes(L.t)) L.lines.push(l);
    else blocks.push({t:'p',lines:[l]});
  });
  const html = []; let ul = false, ol = false;
  blocks.forEach(b => {
    const txt = b.lines ? inline(b.lines.join(' ')) : '';
    if(b.t !== 'li' && ul){ html.push('</ul>'); ul = false; }
    if(b.t !== 'oli' && ol){ html.push('</ol>'); ol = false; }
    if(b.t === 'li'){ if(!ul){ html.push('<ul>'); ul = true; } html.push('<li>'+txt+'</li>'); }
    else if(b.t === 'oli'){ if(!ol){ html.push('<ol>'); ol = true; } html.push('<li>'+txt+'</li>'); }
    else if(b.t === 'h') html.push('<h4>'+txt+'</h4>');
    else if(b.t === 'note') html.push('<p class="note">'+txt+'</p>');
    else if(b.t === 'p') html.push('<p>'+txt+'</p>');
    else if(b.t === 'hr') html.push('<hr>');
  });
  if(ul) html.push('</ul>'); if(ol) html.push('</ol>');
  return html.join('\n');
}

/* ==================================================================== горячее место
   Четверо за одним компьютером ходят по очереди. Прятать чужое нельзя —
   тогда нечего обсуждать, — поэтому «передача хода» это не ширма, а явная
   отметка, чьи кнопки сейчас живые. */
function nextSeat(){
  const list = seats(), me = mySeat();
  if(me === null) return list.length ? list[0] : null;
  const from = list.indexOf(me);
  for(let k = 1; k <= list.length; k++){
    const cand = list[(from + k) % list.length];
    if(!isReady(cand)) return cand;
  }
  return null;                          // готовы все — передавать некому
}
function passTo(seat, quiet){
  if(seat === null || seat === undefined) return;
  S.active = seat; save(); render();
  if(!quiet) curtain(seat);
}
function passTurn(){
  const nx = nextSeat();
  if(nx === null) flash('Готовы все — остаётся закрыть год');
  else passTo(nx);
}
function curtain(seat){
  if(soloGame() || netOn()) return;     // по сети место своё, передавать нечего
  modal('Ход переходит', playerName(seat),
    '<p>За клавиатуру садится <strong>' + esc(playerName(seat)) + '</strong> — '
    + rolesOfSeat(seat).map(r => r.name.toLowerCase()).join(' и ') + '.</p>'
    + '<p class="hint">Чужие вкладки видно целиком, нажимаются свои. Остальные '
    + 'смотрят и советуют вслух — ради этого всё и затевалось.</p>',
    [{label: 'Я — ' + playerName(seat), go:()=>{}}]);
}

    || (WIRE.roster || []).some(p => p.seat === i && p.here);
  el.innerHTML = seats().map(i => '<span class="s' + (i === mySeat() ? ' on' : '')
      + (isReady(i) ? ' rdy' : '') + (here(i) ? '' : ' off') + '" data-seat="' + i + '">'
      + (isReady(i) ? '✓ ' : '') + esc(playerName(i)) + ' · ' + esc(seatTitle(i))
      + (here(i) ? '' : ' · нет связи') + '</span>').join('')
    + (netOn()
        ? '<span class="netcode">' + (WIRE.role === 'host' ? 'ведущий' : 'гость')

function applyLocks(){

    const el = $(PANES[k]), lock = tabLocked(k);

function effChips(eff){
  return Object.entries(eff).map(([k,v]) => {
    const name = SIM.effNames[k] || k;
    /* у части эффектов «меньше» значит «лучше» — знак подписи разворачиваем */
    const lower = ['netCost','lookCost','allCost','utilCost','housingCost','portCost',
                   'tourCost','headway','stall','lifeDecay','protest','workYears','trust'].includes(k);
    const good = lower ? v < 0 : v > 0;
    const val = Math.abs(v) < 1 && k !== 'workYears' && !['look','support','entDrift',
      'regionRel','fedRel','devRel','herRel','carrRel',
      'gridRel','waterRel','railRel'].includes(k) ? pct(v) : sgn(v);
    return '<span class="' + (good?'':'neg') + '">' + name + ' ' + val + '</span>';
  }).join('');
}

function candCard(postId, i, replacing){
  const c = SIM.candidates[postId][i];
  const cost = c.pk + (replacing ? 2 : 0);
  const mine = seatOwns(postRole(postId));
  const can = !S.over && S.pk >= cost && mine;
  return '<div class="cand"><b>' + c.name + '</b><div class="tr8">' + c.trait + '</div>'
    + '<div class="fx">' + (effChips(c.eff) || '<span>без эффектов</span>') + '</div>'
    + '<button data-app="' + postId + '|' + i + '"' + (can?'':' disabled') + '>'
    + (can ? (replacing ? 'Заменить' : 'Назначить') + ' · ' + cost + ' ПК'
       : !mine ? 'Зам направления «' + roleName(postRole(postId)) + '» — '
                 + playerName(seatOf(postRole(postId)))
       : 'Нужно ' + cost + ' ПК') + '</button></div>';
}
/* Журнал решений — это и есть партия: номер плюс список действий. Отсюда
   и разбор в финале, и возможность вернуться к любому решению и решить иначе. */
function actsByYear(){
  const m = {}, order = [];
  S.acts.forEach(a => { if(!m[a.y]){ m[a.y] = []; order.push(a.y); } m[a.y].push(a); });
  return order.sort((x,y) => y-x).map(y => [y, m[y]]);
}
/* Запретов на траты нет — есть видимость. Разница по казне и капиталу
   записана в самом действии, здесь её только показываем. */
function costText(a){
  const out = [];
  if(a.c) out.push((a.c > 0 ? '−' : '+') + f1(Math.abs(a.c)) + ' млрд ₽');
  if(a.p) out.push((a.p > 0 ? '−' : '+') + Math.abs(a.p) + ' ПК');
  return out.join(' · ');
}
function roleSpend(id){
  const sp = (S.spend || {})[id];
  return sp ? {cash: sp.cash, pk: sp.pk} : {cash: 0, pk: 0};
}
function journalHtml(){
  if(!S.replayable) return '<div class="card"><h5>Журнал решений</h5>'
    + '<p>Эта партия начата прежней версией симулятора, которая журнала не вела. '
    + 'Ход продолжается как обычно, но вернуться к прошлому решению в ней нельзя: '
    + 'восстанавливать по неполному списку — значит потерять всё, что было до него. '
    + 'В новой партии журнал будет с первого года.</p></div>';
  if(!S.acts.length) return '<div class="card"><h5>Журнал решений</h5>'
    + '<p>Пока ничего не решено.</p></div>';
  const rows = actsByYear().map(([y, list]) => '<div class="yr"><h6>' + y + '</h6>'
    + list.map(a => a.t === 'turn'
        ? '<div class="m">— год закрыт —</div>'
        : '<div class="j"><span><b class="who">' + roleName(a.who) + '</b>'
          + actLabel(a) + '</span>'
          + (costText(a) ? '<em>' + costText(a) + '</em>' : '')
          + '<button class="rw" data-rw="' + (a.n-1) + '" title="Вернуться сюда и решить иначе">⟲</button>'
          + '</div>').join('') + '</div>').join('');
  const nd = S.acts.filter(a => a.t !== 'turn').length;
  return '<div class="card"><h5>Журнал решений</h5>'
    + '<p>Всего ' + nd + ' ' + plur(nd, 'решение', 'решения', 'решений') + ' за '
    + (S.turn) + ' ' + plur(S.turn, 'ход', 'хода', 'ходов') + '. Партия целиком выводится '
    + 'из номера и этого списка, поэтому к любому решению можно вернуться: события и сметы '
    + 'повторятся в точности, изменится только ваш выбор.</p></div>' + rows;
}
const plur = (n, a, b, c) => { const d = n % 10, e = n % 100;
  return (d === 1 && e !== 11) ? a : (d >= 2 && d <= 4 && (e < 10 || e >= 20)) ? b : c; };
function askRewind(n){
  const a = S.acts[n], lost = S.acts.length - n;
  modal('Переиграть', a.y + ' год', '<p>Партия вернётся к моменту прямо перед действием '
    + '«' + actLabel(a) + '». Отменится ' + lost + ' '
    + plur(lost, 'действие', 'действия', 'действий') + '.</p>'
    + '<p class="hint">Номер партии тот же — события, сметы и требования повторятся в точности. '
    + 'Изменится только то, что вы решите иначе.</p>',
    [{label:'Вернуться сюда', go: () => rewind(n)},
     {label:'Отмена', sec:true, go:()=>{}}]);
}

      + '<p>Считается прибавка к стартовому уровню: порт, заводы и побережье '

  $('#paneLog').querySelectorAll('[data-table]').forEach(b => b.onclick = lobbyModal);
  $('#paneLog').querySelectorAll('[data-new]').forEach(b => b.onclick = () => restart());

/* ==================================================================== сеть

   Одна партия на нескольких машинах. Устройство простое и держится на том,
   что уже сделано: состояние меняется только через действия, действие —
   это несколько байт, а партия целиком выводится из номера и журнала.

   Ведущий — один из игроков, не сервер. Он применяет действия в порядке
   получения и рассылает применённое. Этим снимаются гонки вроде «двое
   потратили последний капитал»: порядок один, и решает его один.

   Внутри года по проводу идут только действия. В конце года ведущий шлёт
   состояние целиком — контрольную точку. Поэтому рассинхрон не копится:
   даже если он случится, следующий новый год его затрёт.

   Два пути соединения: брокер (комната с кодом) и ручной обмен приглашением,
   когда брокер недоступен. Приглашение — сжатая строка, помещается
   в сообщение в чате. */

const WIRE = {
  role: null,          /* null — играем одни; 'host' — ведущий; 'guest' — гость */
  code: '',            /* код комнаты */
  seat: null,          /* моё место за столом */
  link: null,          /* у гостя: соединение с ведущим */
  links: [],           /* у ведущего: по соединению на гостя */
  cid: '',             /* свой опознавательный номер, переживает обрыв */
  status: 'нет связи',
  onRoster: null,      /* лобби подписывается, чтобы перерисоваться */
};

function netOn(){ return WIRE.role === 'host' || WIRE.role === 'guest'; }
function netCid(){
  if(WIRE.cid) return WIRE.cid;
  try { WIRE.cid = localStorage.getItem('kng-cid') || ''; } catch(e){}
  if(!WIRE.cid){
    WIRE.cid = Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem('kng-cid', WIRE.cid); } catch(e){}
  }
  return WIRE.cid;
}
/* Код комнаты: шесть знаков без похожих друг на друга. */
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){
  let s = '';
  for(let i = 0; i < 6; i++) s += CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)];
  return s;
}

/* ---- состояние целиком ------------------------------------------------
   Кто за клавиатурой и что выбрано в карточке — дело местное и по проводу
   не ходит: у каждого своё место, и чужое ему навязывать незачем. */
const LOCAL_KEYS = ['effCache', 'pick', 'active'];
function snapshot(){
  return JSON.stringify(S, (k, v) => LOCAL_KEYS.indexOf(k) >= 0 ? undefined : v);
}
/* Отпечаток состояния: несколько чисел, из которых складывается партия.
   Ведущий вешает его на каждое применённое действие, гость сверяет у себя.
   Разошлось — просим состояние целиком, а не выясняем, где именно. */
function stamp(){
  const s = S.rc + '|' + S.acts.length + '|' + Math.round(S.cash * 100) + '|' + S.pk
    + '|' + S.year + '|' + S.turn + '|' + S.border
    + '|' + IND_KEYS.map(k => Math.round(S.ind[k] * 100)).join(',')
    + '|' + Math.round((S.fedTotal || 0) * 100)
    + '|' + ACTORS.map(a => Math.round(S.rel[a.id] * 100)).join(',')
    + '|' + allWorks().map(k => W(k).st[0] + Math.round(W(k).spent * 10)).join(',');
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function adopt(json){
  let s = null;
  try { s = migrate(JSON.parse(json)); } catch(e){ s = null; }
  if(!s) return false;
  const keepActive = S ? S.active : null, keepPick = S ? S.pick : null;
  S = s;
  S.active = (WIRE.seat === null || WIRE.seat === undefined) ? keepActive : WIRE.seat;
  S.pick = keepPick || {};
  rnd = mulberry(S.seed);
  for(let i = 0; i < S.rc; i++) rnd();   // отматываем поток к присланному месту
  clearEff(); save(); render();
  if(S.demand) askDemand();
  return true;
}

/* ---- разговор ---------------------------------------------------------- */
function netSend(link, msg){
  try { link.send(JSON.stringify(msg)); } catch(e){ netNote('не отправилось: ' + e.message); }
}
function netAll(msg, except){
  WIRE.links.forEach(l => { if(l !== except && l.open) netSend(l, msg); });
}
function netNote(text){ WIRE.status = text; renderSeats(); }

/* Гость предлагает действие и ждёт ответа ведущего. Своё состояние он
   не трогает: иначе у двоих разъедется порядок, а порядок тут — всё. */
function netPropose(a){
  if(!WIRE.link || !WIRE.link.open) return flash('Связь с ведущим потеряна');
  netSend(WIRE.link, {k: 'act', a: a});
}
/* Ведущий применил действие — рассылаем всем. В конце года следом идёт
   состояние целиком: контрольная точка, после которой разойтись невозможно. */
function netApplied(a){
  netAll({k: 'do', a: a, h: stamp()});
  if(a.t === 'turn' || a.t === 'table') netAll({k: 'sync', s: snapshot()});
}

function netOnHost(link, msg){
  if(msg.k === 'hi'){
    link.name = String(msg.name || '').slice(0, 24) || 'Гость';
    link.cid = String(msg.cid || '');
    /* Вернувшийся садится на своё место: место опознаётся по номеру гостя. */
    const old = WIRE.links.filter(l => l !== link && l.cid === link.cid && l.seat !== null)[0];
    link.seat = old ? old.seat : nextFreeSeat();
    if(old) old.seat = null;
    netSend(link, {k: 'you', seat: link.seat, code: WIRE.code});
    netSend(link, {k: 'sync', s: snapshot()});
    netRoster();
    netNote(link.name + ' на связи');
    return;
  }
  if(msg.k === 'act'){
    const a = msg.a || {};
    a.by = link.seat;                    /* от кого — решаем мы, а не клиент */
    const why = canDo(a);
    if(why){ netSend(link, {k: 'nope', why: why}); return; }
    exec(a);
    netApplied(a);
    clearEff(); render(); save();
    return;
  }
  if(msg.k === 'resync') netSend(link, {k: 'sync', s: snapshot()});
}

function netOnGuest(msg){
  if(msg.k === 'you'){
    WIRE.seat = msg.seat; WIRE.code = msg.code || WIRE.code;
    if(S) S.active = WIRE.seat;
    netNote('за столом, место ' + (WIRE.seat + 1));
    return;
  }
  if(msg.k === 'sync'){ adopt(msg.s); netRoster(); netStarted(); return; }
  if(msg.k === 'do'){
    const a = msg.a;
    /* Сверяем место в очереди и счётчик бросков. Разошлось — просим
       состояние целиком, а не гадаем, где именно разъехалось. */
    if(a.n !== S.acts.length + 1 || a.rc !== S.rc){
      netSend(WIRE.link, {k: 'resync'});
      netNote('расхождение в очереди — запросили состояние');
      return;
    }
    applyFromHost(a);
    /* Очередь сошлась, а числа могли и не сойтись: сверяем отпечаток. */
    if(typeof msg.h === 'number' && msg.h !== stamp()){
      netSend(WIRE.link, {k: 'resync'});
      netNote('расхождение в числах — запросили состояние');
      return;
    }
    if(a.t === 'table') netStarted();
    return;
  }
  if(msg.k === 'nope'){ flash(msg.why || 'Ведущий отклонил действие'); return; }
  if(msg.k === 'roster'){ WIRE.roster = msg.list; if(WIRE.onRoster) WIRE.onRoster(); return; }
}

/* Ведущий раздал стол — у гостя закрывается лобби и начинается партия. */
function netStarted(){
  if(WIRE.inLobby && !soloGame()){
    WIRE.inLobby = false;
    $('#veil').hidden = true;
    render();
  }
}
function nextFreeSeat(){
  const taken = WIRE.links.map(l => l.seat).filter(v => typeof v === 'number');
  for(let i = 1; i < 8; i++) if(taken.indexOf(i) < 0) return i;
  return 1;
}
function netRoster(){
  /* Список ведёт ведущий: у гостя своих соединений нет, и пересобирать его
     у себя значит затереть присланное. */
  if(WIRE.role !== 'host'){
    if(WIRE.onRoster) WIRE.onRoster();
    renderSeats();
    return;
  }
  WIRE.roster = [{seat: 0, name: WIRE.myName || playerName(0), here: true}].concat(
    WIRE.links.filter(l => l.seat !== null)
      .map(l => ({seat: l.seat, name: l.name, here: !!l.open})));
  netAll({k: 'roster', list: WIRE.roster});
  if(WIRE.onRoster) WIRE.onRoster();
  renderSeats();
}
const netPeople = () => (WIRE.roster || []).length || 1;

/* ---- обрывы ------------------------------------------------------------ */
function netLost(link){
  link.open = false;
  if(WIRE.role === 'host'){ netRoster(); netNote((link.name || 'гость') + ' отвалился'); }
  else hostGone();
}
/* Ведущий ушёл — партия остаётся у нас целиком, играть можно дальше.
   Честнее всего сказать это прямо и предложить свести стол к одному месту. */
function hostGone(){
  if(WIRE.role !== 'guest') return;
  WIRE.role = null; WIRE.link = null;
  netNote('ведущий ушёл');
  render();
  modal('Связь с ведущим потеряна', S.year + ' год',
    '<p>Партия целиком осталась у вас: год ' + S.year + ', ход ' + S.turn + ' из '
    + SIM.horizon.years + '. Ничего не потеряно — состояние приходило контрольной '
    + 'точкой в конце каждого года.</p>'
    + '<p class="hint">Можно дождаться, пока ведущий вернётся и позовёт снова, '
    + 'или продолжить одному: тогда все четыре направления станут вашими, '
    + 'и это будет записано в журнал.</p>',
    [{label:'Продолжить одному', go: () => {
        const one = {}; ROLES.forEach(r => one[r.id] = 0);
        setTable(one, [{name: playerName(mySeat() || 0)}], S.deal);
        S.active = null; save(); render();
      }},
     {label:'Подождать', sec:true, go:()=>{}}]);
}

/* ---- соединение: брокер ------------------------------------------------
   Брокер нужен ровно на одно рукопожатие: дальше машины говорят напрямую.
   Если он недоступен, есть ручной обмен приглашением ниже. */
const PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
/* Брокер — чужая служба, и она может быть недоступна: у кого-то закрыт
   websocket, где-то не пускает сеть. Поэтому адрес меняется без пересборки:
   поднять свой одной командой (npx peerjs --port 9000) и вписать сюда.
   Пустое поле значит облако PeerJS по умолчанию. */
function brokerAddr(){
  try { return localStorage.getItem('kng-broker') || ''; } catch(e){ return ''; }
}
function setBroker(v){
  try { localStorage.setItem('kng-broker', String(v || '').trim()); } catch(e){}
}
function peerOpts(){
  const v = brokerAddr();
  if(!v) return {debug: 0};
  const m = v.match(/^(?:wss?:\/\/|https?:\/\/)?([^\/:]+)(?::(\d+))?(\/.*)?$/);
  if(!m) return {debug: 0};
  const secure = !/^(ws|http):\/\//.test(v);
  return {debug: 0, host: m[1], port: m[2] ? +m[2] : (secure ? 443 : 80),
          path: m[3] || '/', secure: secure};
}
let peerLib = null;
function loadPeer(){
  if(peerLib) return Promise.resolve(peerLib);
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = PEERJS;
    s.onload = () => { peerLib = window.Peer; peerLib ? ok(peerLib) : no(new Error('брокер не загрузился')); };
    s.onerror = () => no(new Error('брокер недоступен'));
    document.head.appendChild(s);
  });
}
const peerId = code => 'kenig-sim-' + code;
function wrapConn(conn, onMsg, onLost){
  const link = {
    open: false, seat: null, name: '', cid: '',
    send: s => conn.send(s),
    close: () => { try { conn.close(); } catch(e){} },
  };
  conn.on('open', () => { link.open = true; if(link.onOpen) link.onOpen(); netRoster(); });
  conn.on('data', d => { let m = null; try { m = JSON.parse(d); } catch(e){ return; } onMsg(link, m); });
  conn.on('close', () => onLost(link));
  conn.on('error', () => onLost(link));
  return link;
}
function hostRoom(){
  return loadPeer().then(Peer => new Promise((ok, no) => {
    const code = newCode();
    const p = new Peer(peerId(code), peerOpts());
    WIRE.peer = p;
    p.on('open', () => {
      WIRE.role = 'host'; WIRE.code = code; WIRE.seat = 0; WIRE.myName = netMyName();
      if(S) S.active = 0;
      netNote('комната открыта');
      netRoster(); render();
      ok(code);
    });
    p.on('connection', conn => {
      const link = wrapConn(conn, netOnHost, netLost);
      WIRE.links.push(link);
    });
    p.on('error', e => no(e));
  }));
}
function joinRoom(code, name){
  return loadPeer().then(Peer => new Promise((ok, no) => {
    const p = new Peer(peerOpts());
    WIRE.peer = p;
    p.on('open', () => {
      const conn = p.connect(peerId(code.toUpperCase()), {reliable: true});
      const link = wrapConn(conn, (l, m) => netOnGuest(m), netLost);
      link.onOpen = () => {
        WIRE.role = 'guest'; WIRE.code = code.toUpperCase(); WIRE.link = link;
        netSend(link, {k: 'hi', name: name, cid: netCid()});
        netNote('подключились');
        render(); ok(true);
      };
      WIRE.link = link;
      setTimeout(() => { if(!link.open) no(new Error('комната не отвечает')); }, 12000);
    });
    p.on('error', e => no(e));
  }));
}

/* ---- соединение: ручной обмен приглашением -----------------------------
   Когда брокер недоступен, рукопожатие делается руками: ведущий отдаёт
   приглашение, гость возвращает ответ. Обе строки сжаты и помещаются
   в обычное сообщение в чате. */
const b64u = buf => btoa(String.fromCharCode.apply(null, buf))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => {
  const t = s.replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(t + '==='.slice((t.length + 3) % 4));
  const out = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
};
function squeeze(text){
  if(typeof CompressionStream === 'undefined')
    return Promise.resolve('0' + b64u(new TextEncoder().encode(text)));
  const cs = new CompressionStream('deflate-raw');
  return new Response(new Blob([text]).stream().pipeThrough(cs)).arrayBuffer()
    .then(buf => '1' + b64u(new Uint8Array(buf)));
}
function unsqueeze(code){
  const body = code.slice(1), bytes = unb64u(body);
  if(code[0] === '0') return Promise.resolve(new TextDecoder().decode(bytes));
  const ds = new DecompressionStream('deflate-raw');
  return new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
}
/* Ждём, пока браузер соберёт все кандидаты: половина приглашения — они. */
function iceDone(pc){
  return new Promise(ok => {
    if(pc.iceGatheringState === 'complete') return ok();
    const t = setTimeout(ok, 3500);      // за сетями без stun можно не ждать
    pc.onicegatheringstatechange = () => {
      if(pc.iceGatheringState === 'complete'){ clearTimeout(t); ok(); }
    };
  });
}
const ICE = {iceServers: [{urls: 'stun:stun.l.google.com:19302'}]};
function rawLink(ch, onMsg, onLost){
  const link = {open: false, seat: null, name: '', cid: '',
    send: s => ch.send(s), close: () => { try { ch.close(); } catch(e){} }};
  ch.onopen = () => { link.open = true; if(link.onOpen) link.onOpen(); netRoster(); };
  ch.onmessage = e => { let m = null; try { m = JSON.parse(e.data); } catch(err){ return; } onMsg(link, m); };
  ch.onclose = () => onLost(link);
  return link;
}
/* Ведущий: делает приглашение для одного гостя. */
function makeInvite(){
  WIRE.myName = netMyName();
  const pc = new RTCPeerConnection(ICE);
  const ch = pc.createDataChannel('kenig', {ordered: true});
  const link = rawLink(ch, netOnHost, netLost);
  WIRE.links.push(link);
  link.pc = pc;
  return pc.createOffer()
    .then(o => pc.setLocalDescription(o))
    .then(() => iceDone(pc))
    .then(() => squeeze(pc.localDescription.sdp))
    .then(code => { WIRE.manual = link; return code; });
}
function takeAnswer(code){
  const link = WIRE.manual; if(!link) return Promise.reject(new Error('нет приглашения'));
  return unsqueeze(code.trim())
    .then(sdp => link.pc.setRemoteDescription({type: 'answer', sdp: sdp}))
    .then(() => {
      WIRE.role = 'host'; WIRE.seat = 0; WIRE.myName = netMyName();
      if(S) S.active = 0;
      netNote('гость подключается'); render();
    });
}
/* Гость: принимает приглашение и отдаёт ответ. */
function takeInvite(code, name){
  const pc = new RTCPeerConnection(ICE);
  let link = null;
  pc.ondatachannel = e => {
    link = rawLink(e.channel, (l, m) => netOnGuest(m), netLost);
    link.onOpen = () => {
      WIRE.role = 'guest'; WIRE.link = link;
      netSend(link, {k: 'hi', name: name, cid: netCid()});
      netNote('подключились'); render();
    };
    WIRE.link = link;
  };
  return unsqueeze(code.trim())
    .then(sdp => pc.setRemoteDescription({type: 'offer', sdp: sdp}))
    .then(() => pc.createAnswer())
    .then(a => pc.setLocalDescription(a))
    .then(() => iceDone(pc))
    .then(() => squeeze(pc.localDescription.sdp));
}

function netLeave(){
  WIRE.links.forEach(l => l.close());
  if(WIRE.link) WIRE.link.close();
  try { if(WIRE.peer) WIRE.peer.destroy(); } catch(e){}
  WIRE.role = null; WIRE.link = null; WIRE.links = []; WIRE.peer = null;
  WIRE.seat = null; WIRE.roster = null; WIRE.status = 'нет связи';
  render();
}

function drawNetLobby(){
  if(!netOn()) return drawNetStart();
  WIRE.inLobby = true;
  const people = (WIRE.roster && WIRE.roster.length) ? WIRE.roster
    : [{seat: 0, name: netMyName(), here: true}];
  const count = people.length;
  const host = WIRE.role === 'host';
  if(!lobbyDraft || lobbyDraft.count !== count)
    lobbyDraft = {count: count, seats: defaultSeats(count), names: [], deal: 0};
  const d = lobbyDraft;
  d.count = count;
  d.names = people.map(p => p.name);
  const nameOf = i => d.names[i] || ('Игрок ' + (i + 1));

  const body = '<div class="netbig"><b>' + esc(WIRE.code || '—') + '</b>'
      + '<span>' + (host ? 'код комнаты — передайте остальным' : 'вы в комнате') + '</span></div>'
    + '<h4>Кто подключился</h4><div class="netwho">'
      + people.map(p => '<div class="' + (p.here ? 'here' : '') + '">'
          + esc(p.name) + (p.seat === WIRE.seat ? ' — это вы' : '')
          + '<i>' + (p.here ? 'на связи' : 'нет связи') + '</i></div>').join('')
      + '</div>'

        + (host && count > 1
            ? '<select data-role="' + r.id + '">' + seatList(count).map(i =>
                '<option value="' + i + '"' + (d.seats[r.id] === i ? ' selected' : '') + '>'
                + esc(nameOf(i)) + '</option>').join('') + '</select>'
            : '<span style="flex:0 0 auto;color:var(--tx2)">'
              + esc(nameOf(d.seats[r.id])) + '</span>')
        + '</div>').join('')
    + (host
        ? '<p class="hint">Раздача случайна отдельным генератором, не игровым: иначе она '
          + 'сдвинула бы события и сметы, и одинаковый номер партии перестал бы давать '
          + 'одинаковую игру.</p>'

  const buttons = [];

    buttons.push({label:'Начать партию', go: () => { netClosed(); applyLobby(); }});

const esc = s => String(s == null ? '' : s)

let lobbyDraft = null;

const seatList = count => Array.apply(null, {length: count}).map((_, i) => i);
function wireLobby(){
  const d = lobbyDraft, body = $('#mBody');
  body.querySelectorAll('[data-cnt]').forEach(b => b.onclick = () => {
    d.count = +b.dataset.cnt;
    d.seats = defaultSeats(d.count);
    d.deal = 0;
    drawLobby();
  });
  body.querySelectorAll('[data-nm]').forEach(inp => inp.onchange = () => {
    d.names[+inp.dataset.nm] = inp.value.trim(); drawLobby();
  });
  body.querySelectorAll('[data-role]').forEach(sel => sel.onchange = () => {
    d.seats[sel.dataset.role] = +sel.value; drawLobby();
  });
}
function applyLobby(){
  const d = lobbyDraft;
  /* Место, которому не досталось ни одной роли, — это человек без кнопок.
     Схлопываем нумерацию, чтобы такого места просто не было. */
  const used = [];
  ROLES.forEach(r => { if(used.indexOf(d.seats[r.id]) < 0) used.push(d.seats[r.id]); });
  used.sort((a, b) => a - b);
  const seatMap = {};
  ROLES.forEach(r => seatMap[r.id] = used.indexOf(d.seats[r.id]));
  const players = used.map(v => ({name: (d.names[v] || ('Игрок ' + (v + 1))).trim()}));
  if(!setTable(seatMap, players, d.deal)) return;
  S.active = soloGame() ? null : seats()[0];
  save(); render();
  if(!soloGame()) curtain(S.active);
}

function detail(key, fly){
  const d = workDef(key);
  if(key === 'p:'+TRAM.id) return tramCard(fly);
  const w = W(key);
  $('#dTitle').textContent = d.name;
  const bl = blocked(key), est = estimate(key), m = mods(key).filter(x => x.pct);

  let ops = '';
  if(w.st === 'idle'){
    const range = d.kind === 'proj' ? d.p.min + '–' + d.p.max
      : f1(est*0.8) + '–' + f1(est*1.3);
    ops = '<div class="money"><div>' + (d.kind === 'proj' ? 'Оценка концепции' : 'Доля в программе')
      + '<b>' + range + '</b></div>'
      + '<div>Смета к старту<b>' + f1(est) + ' млрд ₽</b></div>'
      + '<div>Срок<b>' + yrs + ' лет</b></div></div>'
      + (m.length ? '<p class="note rule" style="margin:0 0 9px"><b>Сцепка:</b> '
          + m.map(x => x.name + ' ' + (x.pct>0?'+':'') + x.pct + '%').join('; ') + '</p>' : '');
    if(bl) ops += '<p class="note" style="margin:0">' + bl + '</p>';
    else {
      const pick = S.pick || (S.pick = {});
      const cur = conById[pick[key]] && conOk(conById[pick[key]], key)
        ? conById[pick[key]] : SIM.contractors.find(c => conOk(c, key)) || SIM.contractors[0];
      pick[key] = cur.id;
      ops += '<div class="pick"><b>Кто строит</b>'
        + SIM.contractors.map(c => {
            const ok = conOk(c, key), busy = conLoad(c.id) >= c.cap;
            const why = !ok ? (c.only ? ' Не его профиль.' : c.need
                ? ' Нужно отношение «' + ACTORS.find(a=>a.id===c.need.rel).name + '» от '
                  + c.need.min + '.' : ' Только при особом режиме.')
              : busy ? ' Занят: ' + c.cap + ' из ' + c.cap + '.' : '';
            return '<button class="opt' + (cur.id===c.id?' on':'') + '" data-con="' + c.id + '"'
              + (ok && !busy && !S.over ? '' : ' disabled') + '><b>' + c.name + ' — '
              + pct(c.cost) + ' к смете, ' + (c.speed>0?'+':'') + c.speed + ' год, срыв '
              + Math.round(c.risk*100) + '%</b><i>' + c.trait + why + '</i></button>';
          }).join('') + '</div>'
        + '<div class="pick"><b>На каких условиях</b>'
        + SIM.contracts.map(ct => {
            const ok = contractOk(ct);
            const cost = est * (1 + ct.cost) * (1 + cur.cost);
            const y = Math.max(1, yrs + ct.years + cur.speed);
            return '<button class="opt" data-start="' + ct.id + '"'
              + (ok && !S.over ? '' : ' disabled') + '><b>' + ct.name + ' — ' + f1(cost)
              + ' млрд ₽, ' + y + ' лет</b><i>' + ct.effect
              + (ok ? '' : ' Сейчас недоступно.') + '</i></button>';
          }).join('') + '</div>';
    }
  } else if(w.st === 'active'){
    const pg = clamp(w.spent/w.act,0,1)*100;
    const ct = SIM.contracts.find(c => c.id === w.contract);
    const con = conById[w.con] || SIM.contractors[0];
    const rate = need(key);
    const left = rate > 0.01 ? Math.ceil((w.act - w.spent)/rate) : '—';
    ops = '<div class="money"><div>Освоено<b>' + f1(w.spent) + ' млрд ₽</b></div>'
      + '<div>' + (w.revealed ? 'Смета уточнённая' : 'Смета плановая') + '<b>'
      + f1(w.revealed ? w.act : w.est) + '</b></div>'
      + '<div>Осталось<b>' + (w.frozen ? '—' : left + ' лет') + '</b></div></div>'
      + '<div class="prog"><i style="width:' + pg + '%"></i></div>'
      + '<p class="note" style="margin:0 0 9px">' + con.name + ' · ' + ct.name.toLowerCase()
      + ' · в год уходит ' + f1(rate) + ' млрд ₽'
      + (ct.relief ? ' (остальное платит концессионер)' : '')
      + ' · риск срыва ' + Math.round(con.risk*100) + '% в год</p>'
      + '<div class="btns"><button class="sec' + (w.forced?' on':'') + '" data-op="force">'
      + (w.forced ? 'Форсаж включён' : 'Форсировать +60%') + '</button>'
      + '<button class="sec' + (w.frozen?' on':'') + '" data-op="freeze">'
      + (w.frozen ? 'Разморозить' : 'Заморозить') + '</button></div>'
      + (w.revealed ? '' : '<p class="note" style="margin:9px 0 0">Реальная смета выяснится '
          + 'после первого года работ.</p>');
  } else {
    ops = '<div class="money"><div>Построено<b>' + w.y0 + '–' + w.y1 + '</b></div>'
      + '<div>Обошлось<b>' + f1(w.act) + ' млрд ₽</b></div>'
      + '<div>К смете<b class="' + (w.act>w.est?'dn':'up') + '">'
      + sgn((w.act/w.est-1)*100) + '%</b></div></div>'
      + '<div class="prog"><i style="width:100%;background:var(--ok)"></i></div>';

  $('#ops').innerHTML = ops;
  $('#ops').querySelectorAll('[data-con]').forEach(b =>
    b.onclick = () => { S.pick[key] = b.dataset.con; detail(key, false); });
  $('#ops').querySelectorAll('[data-start]').forEach(b =>
    b.onclick = () => startWork(key, b.dataset.start, S.pick[key]));

      + '<dt>Уверенность</dt><dd><span style="color:' + confC + '">' + p.conf + '</span> · разброс '
      + Math.round(band(key)[0]*100) + '–' + Math.round(band(key)[1]*100) + '%</dd>'
      + '<dt>Сценарий</dt><dd>' + p.scen + '</dd>'
      + '<dt>Район</dt><dd>' + (p.district || '—') + '</dd>';

      .map(([k,v]) => '<span' + (v<0?' class="neg"':'') + '>' + k + ' ' + sgn(v) + '</span>').join('');
    const rules = p.rules.map(r => SIM.rules[r]).filter(Boolean)

    $('#dBody').innerHTML = obsLink(p.note)

      + (p.geomNote ? '<p class="note">' + p.geomNote + '</p>' : '')

  } else if(d.o){
    const o = d.o;
    const rows = [];
    if(o.depth) rows.push(['Глубина канала', f1(o.depth) + ' м']);
    if(typeof o.cap === 'number') rows.push(['Перевалка', '+' + f1(o.cap) + ' млн т/год']);

    if(o.gives) rows.push(['Даёт', termName(o.gives)]);
    if(o.port) rows.push(['Гавань', portById[o.port].name]);

    if(o.fish) rows.push(['Рыбопереработка', '+' + o.fish]);

    if(o.sell) rows.push(['Продажа серии', f1(o.sell) + ' млрд за ' + o.sellYears + ' лет']);
    $('#dMeta').innerHTML = rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('');
    const unlocks = ROUTES.filter(r => r.need && r.need === o.gives)
      .concat(o.depth ? ROUTES.filter(r => r.depth <= o.depth && r.depth > S.port.depth) : []);
    $('#dBody').innerHTML = '<p class="note rule"><b>Этого в концепции нет.</b> '
      + 'Порт и транзит — развилка «Логистика анклава», названная дырой размером '
      + 'в отдельный раздел. Сметы здесь наши, а не из хранилища.</p>'
      + '<p>' + o.why + '</p>'
      + (unlocks.length ? '<h4>Открывает линии</h4><p class="hint">'
          + [...new Set(unlocks.map(r => r.name))].join(' · ') + '</p>' : '')
      + (bl ? '<p class="note">' + bl + '</p>' : '');
  } else if(d.kind === 'tour'){
    const t = d.t;
    $('#dMeta').innerHTML = '<dt>Часть</dt><dd>туристической программы</dd>'
      + (t.pull ? '<dt>Притяжение</dt><dd>+' + t.pull + ' тыс гостей в год</dd>' : '')
      + (t.beds ? '<dt>Размещение</dt><dd>+' + t.beds + ' тыс мест</dd>' : '')
      + (t.season ? '<dt>Круглогодичность</dt><dd>+' + Math.round(t.season*100)
          + ' пунктов</dd>' : '')
      + '<dt>Сезон</dt><dd>' + (t.allSeason ? 'работает весь год' : 'только в сезон') + '</dd>';
    $('#dBody').innerHTML = '<p class="note rule"><b>Этого в концепции нет.</b> '

      + 'Смета и эффект здесь наши, а не из хранилища.</p>'
      + '<p>' + t.why + '</p>'

  } else {
    const c = d.kind === 'corr' ? d.c : null;
    $('#dMeta').innerHTML = '<dt>Часть</dt><dd>трамвайной программы</dd>'
      + (c ? '<dt>Длина</dt><dd>' + f1(c.km) + ' км</dd>'
           + '<dt>Обслуживает</dt><dd>' + Object.entries(c.serves)
              .map(([k,v]) => k + ' · ' + Math.round(v*100) + '%').join('<br>') + '</dd>'
           + '<dt>Очередь</dt><dd>' + c.order + ' из ' + CORR.length + '</dd>'
         : '<dt>Вместимость</dt><dd>' + NET.depot.cap*2 + ' вагонов</dd>');
    const rule = c && c.rule ? SIM.rules[c.rule] : null;
    $('#dBody').innerHTML = '<p>' + (c ? c.why : NET.depot.why) + '</p>'
      + (rule ? '<p class="note rule"><b>' + rule.name + '.</b> ' + rule.text + '</p>' : '')
      + (c && !c.coords.length ? '<p class="note">Трассы у этого куска нет: в концепции поимённо '
          + 'разобрана только треть сети, остальное — длинный хвост.</p>' : '')
      + '<h4>Откуда цифры</h4><p class="hint">Длина — из OSRM, трасса положена на реальные улицы. '
      + 'Смета — доля программы «' + TRAM.name + '» (' + TRAM.min + '–' + TRAM.max
      + ' млрд ₽) пропорционально километражу.</p>';
  }
  $('#dBody').scrollTop = 0;
  wireLinks();
  $('#det').classList.add('open');
  const pid = key.startsWith('p:') ? key.split(':')[1] : null;
  Object.entries(pins).forEach(([k,mk]) => mk.getElement().classList.toggle('sel', k === pid));
  if(fly){
    const b = boundsOf(key);
    if(b) map.fitBounds(b,{padding:{top:80,bottom:80,left:60,right:460},maxZoom:14,duration:800});
    else if(d.kind === 'proj') map.easeTo({center:d.p.at,zoom:Math.max(map.getZoom(),13),

  if(narrow()) sidePanel(false);
}

function boundsOf(key){
  const d = workDef(key);
  const pts = [];
  if(d.kind === 'proj') (d.p.geom||[]).forEach(g => pts.push(...g.coords));
  else if(d.kind === 'corr') pts.push(...d.c.coords);
  if(!pts.length) return null;
  const b = new maplibregl.LngLatBounds(pts[0],pts[0]); pts.forEach(c => b.extend(c)); return b;
}

/* Требование адресное, а за клавиатурой может сидеть не тот. Сначала отдаём
   клавиатуру тому, кто отвечает, и только потом спрашиваем: иначе человек
   упирается в кнопки, которые ему не нажимаются, и не понимает почему. */
function askDemand(){
  if(!S.demand) return;
  const own = soloGame() ? null : seatOf(demandRole());
  if(own !== null && own !== mySeat()){
    S.active = own; save(); render();
    return modal('Отвечает другой', playerName(own),
      '<p>Требование адресовано направлению «' + roleName(demandRole()) + '». '
      + 'За клавиатуру садится <strong>' + esc(playerName(own)) + '</strong>: '
      + 'решает он, остальные советуют вслух.</p>',
      [{label: 'Я — ' + playerName(own), go: demandModal}]);
  }
  demandModal();
}
/* То же требование, но само по себе: после возврата к прошлому году итоги
   года уже показаны, а ответить всё равно надо. */
function demandModal(){
  const dm = SIM.demands.find(x => x.id === S.demand); if(!dm) return;
  const ac = SIM.actors.find(a => a.id === dm.actor);
  modal('Требуют ответа', dm.name, '<div class="evt n"><b>' + ac.name + ' · сейчас '
    + f0(S.rel[dm.actor]) + ' · отвечает «' + roleName(actorRole(dm.actor)) + '»</b>'
    + dm.text + '</div>',
    [{label: dm.yes, go: () => answerDemand(true)},
     {label: dm.no, sec:true, go: () => answerDemand(false)}]);
}
function yearModal(year, events, finished, deltas, inc, pkGained){
  const evh = events.map(e => '<div class="evt ' + (e.kind==='хорошо'?'g':e.kind==='плохо'?'b':'n') + '">'
    + '<b>' + e.name + '</b>' + e.text + '</div>').join('');
  const dh = IND.map(i => { const d = deltas[i.key];
    return Math.abs(d) < 0.4 ? '' : '<span>' + i.name + ' <b class="' + (d>0?'up':'dn') + '">'
      + sgn(d) + '</b></span>'; }).join('');
  const A = activeKeys(), t = transport();
  const body = '<p class="hint">Поступило ' + f1(inc.all) + ' млрд ₽ (город и область ' + f1(inc.base)
    + (inc.fed?', федеральные ' + f1(inc.fed):'') + (inc.priv?', частные ' + f1(inc.priv):'')
    + ')' + (inc.debt > 0.05 ? ', по концессиям ушло ' + f1(inc.debt) : '')
    + '. В казне ' + f1(S.cash) + ' млрд ₽, капитала прибавилось ' + pkGained + '.</p>'
    + (evh || '<p class="hint">Событий не было.</p>')
    + (dh ? '<h4>Показатели города</h4><div class="deltas">' + dh + '</div>' : '')
    + (t.pax > 0 ? '<h4>Сеть</h4><p class="hint">' + f0(t.pax) + ' тыс поездок в сутки · интервал '
        + f1(t.headway) + ' мин · ' + f1(t.km) + ' км · ' + t.cars + ' вагонов</p>' : '')
    + (A.length ? '<h4>В работе</h4><p class="hint">' + A.map(k => workDef(k).name + ' — '
        + f0(clamp(W(k).spent/W(k).act,0,1)*100) + '%').join(' · ') + '</p>'
      : '<p class="hint">Ни одна стройка не идёт. Деньги копятся, город изнашивается.</p>');
  const owner = S.demand && !soloGame() ? seatOf(demandRole()) : null;
  if(S.demand && owner !== null && owner !== mySeat()){
    /* Отвечает не тот, кто смотрит итоги: сперва итоги, потом передача. */
    modal('Итоги года', year + ' → ' + S.year, body
      + '<h4>Требуют ответа</h4><p class="hint">Отвечает «'
      + roleName(demandRole()) + '» — ' + esc(playerName(owner)) + '.</p>',
      [{label:'Дальше', go: askDemand}]);
  } else if(S.demand){
    const dm = SIM.demands.find(x => x.id === S.demand);
    const ac = SIM.actors.find(a => a.id === dm.actor);
    modal('Итоги года', year + ' → ' + S.year, body
      + '<h4>Требуют ответа</h4><div class="evt n"><b>' + dm.name + ' · ' + ac.name + ' · сейчас '
      + f0(S.rel[dm.actor]) + ' · отвечает «' + roleName(actorRole(dm.actor)) + '»</b>'
      + dm.text + '</div>',
      [{label: dm.yes, go: () => answerDemand(true)},
       {label: dm.no, sec:true, go: () => answerDemand(false)}]);
  } else {
    modal('Итоги года', year + ' → ' + S.year, body, [{label:'Дальше', go:()=>{}}]);
  }
}
function score(){
  return IND_KEYS.reduce((a,k) => a + S.ind[k] * (SIM.weights[k] || 0), 0);
}

/* ==================================================================== личные итоги
   Одна цифра в финале не говорит, что именно провалилось. Четыре направления
   говорят: мэру — общий вердикт, поддержка и доля доведённого до сдачи;
   транспортнику — поток, интервал, охват и километраж; хозяйству — перевалка,
   гости, рабочие места и доходы; политику — транши, отношения, закрытые
   развилки и занятые должности.

   В партии на четверых это то, из-за чего возникает спор: вагоны нужны одному,
   причал другому, а казна общая. Одиночке — разбор собственной игры по частям.
   Общий приговор при этом остаётся один на всех и ничего из этого не заменяет. */
/* Подсистемы считаются заново на каждый вызов — считаем их один раз на весь разбор. */
function scoreCtx(){ return {t: transport(), tr: tourism(), tp: trade(), inc: income()}; }
function metricValue(id, c){
  switch(id){
    case 'score':    return score();
    case 'support':  return S.ind['поддержка'];
    case 'finish': { const all = allWorks();
      const started = all.filter(k => W(k).st !== 'idle').length;
      return started ? all.filter(k => W(k).st === 'done').length / started * 100 : 0; }
    case 'pax':      return c.t.pax;
    case 'headway':  return c.t.headway;
    case 'reach':    return c.t.reach * 100;
    case 'km':       return c.t.km;
    case 'cargo':    return c.tp.flow;
    case 'tourflow': return c.tr.flow;
    case 'jobs':     return entJobs();
    case 'revenue':  return c.inc.tax + c.inc.port + c.inc.tour + c.inc.air + c.inc.sales;
    case 'fedtotal': return S.fedTotal || 0;
    case 'rels':     return SIM.actors.reduce((a,x) => a + S.rel[x.id], 0) / SIM.actors.length;
    case 'decided':  return DATA.forks.filter(f => S.forks[f.name]).length
                          + SIM.regs.filter(r => S.regs[r.id]).length;
    case 'team':     return SIM.posts.filter(p => S.staff[p.id]).length;
  }
  return 0;
}
/* Отсчёт идёт от стартового уровня, а не от нуля. Иначе хозяйство получает
   полсотни баллов за то, что побережье, порт и заводы существовали и до него,
   а транспорт начинает с нуля просто потому, что трамвая ещё нет. Тот же
   приём уже применён к показателям туризма и перевалки в ходе года. */
const BASE0 = {};
function measureBase(){
  const keepS = S, keepR = rnd;
  newGame(1, true);                       // тихая партия только ради отсчёта
  const c = scoreCtx();
  ROLES.forEach(r => r.metrics.forEach(m => BASE0[m.id] = metricValue(m.id, c)));
  S = keepS; rnd = keepR;
}
const metricBase = m => m.lower ? 0 : (BASE0[m.id] || 0);
function roleScore(role, c){
  c = c || scoreCtx();
  let total = 0;
  const parts = role.metrics.map(m => {
    const got = metricValue(m.id, c), base = metricBase(m), span = m.target - base;
    /* У интервала «меньше» значит «лучше», а ноль значит «сети нет вовсе». */
    const share = m.lower ? (got > 0 ? clamp(m.target/got, 0, 1) : 0)
                : span > 0 ? clamp((got - base)/span, 0, 1)
                : clamp(got/m.target, 0, 1);
    total += m.weight * share;
    return {m, got, base, share};
  });
  return {total, parts};
}
const roleVerdict = (role, total) =>
  role.verdicts.find(v => total >= v.min) || role.verdicts[role.verdicts.length-1];

function roleBlock(role, c, full){
  const r = roleScore(role, c), v = roleVerdict(role, r.total);
  const rows = r.parts.map(p => {
    const w = Math.round(p.share*100), got = p.m.dec ? f1(p.got) : f0(p.got);
    return '<div class="rmet"><div class="n"><span>' + p.m.name + '</span>'
      + '<em>' + got + ' / ' + p.m.target + '</em></div>'
      + '<i class="u">' + p.m.unit
        + (p.base > 0.05 ? ' · на старте было ' + (p.m.dec ? f1(p.base) : f0(p.base)) : '')
        + '</i>'
      + '<span class="tr"><i style="width:' + w + '%;background:hsl('
      + Math.round(w*1.35) + ' 62% 55%)"></i></span></div>';
  }).join('');
  const sp = roleSpend(role.id), bits = [];
  if(Math.abs(sp.cash) > 0.05) bits.push(f1(sp.cash) + ' млрд ₽');
  if(sp.pk) bits.push(sp.pk + ' '
    + plur(sp.pk, 'единица', 'единицы', 'единиц') + ' капитала');
  const spent = bits.length
    ? '<div class="rsp">Потрачено: ' + bits.join(' и ') + '</div>' : '';
  return '<div class="role"><h5>' + role.name + '<i class="rchip">' + role.holds + '</i>'
    + '<b>' + Math.round(r.total) + ' из 100</b></h5>'
    + '<div class="rv">' + v.name + '</div>'
    + (full ? '<p class="rwhy">' + v.text + '</p>' : '')
    + rows + spent + '</div>';
}
function rolesHtml(full){
  const c = scoreCtx();
  return ROLES.map(r => roleBlock(r, c, full)).join('');
}
/* Разбор партии: одной цифры мало, важно — когда что было решено.
   Всё это читается из журнала действий, ничего специально не копится. */
function debrief(){
  const A = S.acts, y0 = SIM.horizon.startYear, last = y0 + SIM.horizon.years - 1, out = [];
  const nth = y => (y - y0 + 1);
  const st = A.filter(a => a.t === 'start');
  if(st.length){
    const tail = st.filter(a => a.y > last - 5).length;
    out.push('Первая стройка начата на ' + nth(st[0].y) + '-й год (' + st[0].y + '), всего начато '
      + st.length + '. В последнюю пятилетку — ' + tail
      + (tail ? ': начатое под занавес досталось уже не вам.' : '.'));
  } else out.push('Не начато ни одной стройки за двадцать лет.');
  const lob = A.filter(a => a.t === 'lobby');
  if(!lob.length) out.push('Заявка в федеральную программу не подавалась ни разу. '
    + 'Это те деньги, без которых концепция не финансируется ни при каком сценарии.');
  else out.push('Заявка подана на ' + nth(lob[0].y) + '-й год (' + lob[0].y + '), попыток '
    + lob.length + (S.fed.tier ? ', программа получена' : ', программу так и не дали') + '.');
  const solved = DATA.forks.filter(f => S.forks[f.name] && S.forks[f.name] !== 'vault');
  const missed = DATA.forks.filter(f => !S.forks[f.name] && f.before);
  out.push('Развилок решено ' + solved.length + ' из ' + DATA.forks.length
    + (solved.length ? ': ' + solved.map(f => f.name + ' — ' + S.forks[f.name]).join('; ') : '')
    + (missed.length ? '. Окно упущено: ' + missed.map(f => f.name).join('; ') : '') + '.');
  const early = A.filter(a => a.t !== 'turn' && a.y < y0 + 5).length;
  const late = A.filter(a => a.t !== 'turn' && a.y >= y0 + 5).length;
  out.push('Решений принято ' + (early + late) + ': ' + early + ' в первую пятилетку и '
    + late + ' потом. Раннее решение успевает сработать, позднее остаётся намерением.');
  return out;
}
function finale(){
  const sc = score();
  const v = SIM.verdicts.find(x => sc >= x.min) || SIM.verdicts[SIM.verdicts.length-1];
  const done = doneP(), t = transport();
  const spent = allWorks().reduce((a,k) => a + W(k).spent, 0);
  const lines = IND.map(i => { const val = S.ind[i.key];
    return '<div class="scoreline"><span>' + i.name + '</span><span class="tr"><i style="width:'
      + val.toFixed(1) + '%;background:hsl(' + Math.round(val*1.35) + ' 62% 55%)"></i></span><em>'
      + f0(val) + '</em></div>'; }).join('');
  const undone = DATA.projects.filter(p => (p === TRAM ? netAgg().st : S.proj[p.id].st) !== 'done');
  const rels = SIM.actors.map(a => a.name + ' ' + f0(S.rel[a.id])).join(' · ');
  const team = SIM.posts.filter(p => S.staff[p.id])
    .map(p => SIM.candidates[p.id][S.staff[p.id].cand].name).join(' · ');
  const body = '<p><strong>' + v.text + '</strong></p>'
    + '<h4>Показатели на ' + (SIM.horizon.startYear + SIM.horizon.years - 1) + ' год</h4>' + lines
    + '<h4>Деньги</h4><p class="hint">Освоено ' + f0(spent) + ' млрд ₽ — это '
    + f0(spent / DATA.total.avg * 100) + '% от средней оценки концепции (' + DATA.total.avg
    + ' млрд ₽). Завершено проектов: ' + done.length + ' из ' + DATA.projects.length + '.</p>'
    + '<h4>Сеть</h4><p class="hint">' + (t.km > 0
        ? f1(t.km) + ' км пути, ' + t.cars + ' вагонов, интервал ' + f1(t.headway) + ' мин, '
          + f0(t.pax) + ' тыс поездок в сутки. Охват ' + f0(t.reach*100) + '% жителей.'
        : 'Ни одного километра пути не построено.') + '</p>'
    + '<h4>Порт</h4><p class="hint">' + (() => { const tp = trade();
        const open = ROUTES.filter(r => S.port.routes[r.id]);
        return tp.flow > PORT.startFlow + 0.5
          ? f1(tp.flow) + ' млн тонн в год, канал ' + f1(S.port.depth) + ' м, линий '
            + open.length + ': ' + open.map(r => r.name).join(' · ')
            + (tp.components ? '. Компоненты для сборки приходят морем.' : '')
          : 'Перевалка осталась на уровне ' + f1(tp.flow) + ' млн тонн. '
            + 'Дыра размером в раздел так и не закрыта.'; })() + '</p>'
    + '<h4>Отношения</h4><p class="hint">' + rels + '</p>'
    + (team ? '<h4>Команда</h4><p class="hint">' + team + '</p>' : '')
    + (undone.length ? '<h4>Осталось несделанным</h4><p class="hint">'
        + undone.map(p => p.name).join(' · ') + '</p>' : '')
    + '<h4>Личные итоги</h4><p class="hint">Общий приговор один на всех. '
    + 'Личная строка показывает, чем занималось каждое направление.</p>'
    + rolesHtml(true)
    + '<h4>Итог по режиму границы</h4><p class="hint">'
    + SIM.border.states.find(x => x.key === S.border).note + '</p>'
    + (S.replayable
        ? '<h4>Разбор</h4>' + debrief().map(t => '<p class="hint">' + t + '</p>').join('')
        : '')
    + '<p class="hint">Партия ' + S.seed + '. Тот же номер даст те же события и те же сметы. '
    + 'Журнал решений остался во вкладке «Хроника»: оттуда можно вернуться к любому году.</p>';
  modal('Горизонт закрыт · ' + Math.round(sc) + ' из 100', v.name, body,
    [{label:'Начать заново', go:() => { newGame(); render(); intro(); }},
     {label:'Остаться на карте', sec:true, go:()=>{}}]);
}
function intro(){
  const body =
    '<p>Вы ведёте концепцию «Новый Кёнигсберг» двадцать лет: с ' + SIM.horizon.startYear + ' по '

    + ' проектов из хранилища, вместе они стоят <strong>' + DATA.total.min + '–' + DATA.total.max
    + ' млрд ₽</strong>. Город и область дают на развитие около <strong>'
    + f1(SIM.money.city + SIM.money.region) + ' млрд ₽ в год</strong> — за двадцать лет чуть больше '

    + '<p>Стройки сами тянут деньги из казны по своему графику. Настоящая смета выясняется только '

    + '<p class="hint">Контейнерная линия в Азию — стратегический ответ на закрытую '

    + 'градозащитниками и перевозчиками — и на назначения. Семь должностей, у каждого кандидата '

    + 'стоит отношений.</p>'
    + '<p><strong>Очерёдность важнее списка.</strong> Путь в новой застройке кладётся до зданий, '
    + 'в районах обновления — вместе с трубами, очистка русла бессмысленна до перекрытия стоков. '

  modal('Новый Кёнигсберг', 'Двадцать лет и чужие деньги', body,

}

/* ==================================================================== запуск */
const PANES = {work:'#paneWork', net:'#paneNet', tour:'#paneTour', port:'#panePort', econ:'#paneEcon',
  dec:'#paneDec', team:'#paneTeam', log:'#paneLog'};
function tab(name){
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === name));
  Object.entries(PANES).forEach(([k,sel]) => $(sel).hidden = (k !== name));
  if(narrow()) sidePanel(true);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tab(b.dataset.t));
/* Панель и затемнение позади неё всегда включаются вместе: разойдись они —
   и экран останется прикрыт наглухо, потому что закрывать будет нечем. */
$('#sideClose').onclick = () => sidePanel(false);
$('#scrim').onclick = () => sidePanel(false);
/* Поворот телефона и прячущаяся полоса адреса меняют высоту окна, а карта
   сама этого не замечает и остаётся в прежнем размере — сдвинутая и обрезанная.
   Заодно: широкий экран показывает панель постоянно, затемнение там ни к чему,
   а оставшись после поворота — закрыло бы полработы. */
let fitT = 0;
function refit(){
  if(!narrow()) sidePanel(false);
  clearTimeout(fitT);
  fitT = setTimeout(() => { try { map.resize(); } catch(e){} }, 120);
}
window.addEventListener('resize', refit);
window.addEventListener('orientationchange', refit);
$('#dClose').onclick = () => { $('#det').classList.remove('open'); selKey = null; renderWork(); renderNet(); renderTour(); renderPort(); renderPort(); };
/* Пока роль одна на всех — кнопка закрывает год. Как только за столом
   несколько человек, та же кнопка означает «я готов», а год закрывается сам,
   когда готовы все четверо. */
function pressTurn(){
  if(soloGame()) return endTurn();
  /* Готовы все — та же кнопка закрывает год, а не снимает чью-то готовность. */
  if(!waitingFor().length) return closeYear();
  const me = mySeat();
  if(me === null) return flash('Никто не сел за клавиатуру');
  if(!setReady(me)) return;
  if(!waitingFor().length) closeYear();
  else passTurn();                      // отметился — передаём следующему
}
/* После закрытия года круг начинается сначала. Ширму не показываем: итоги года
   и так на экране, а кто ходит первым — видно в полосе мест. */
function closeYear(){
  endTurn();
  if(!soloGame() && !netOn() && !S.over) passTo(seats()[0], true);
}
$('#btnTurn').onclick = pressTurn;
$('#btnUndo').onclick = undo;
$('#burger').onclick = () => sidePanel(!$('#side').classList.contains('open'));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ sidePanel(false); $('#det').classList.remove('open'); selKey = null; renderWork(); renderNet(); renderTour(); renderPort(); renderPort(); }
  if(e.key === 'Enter' && $('#veil').hidden && !S.over) pressTurn();
  if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'я')){ e.preventDefault(); undo(); }
});

/* Запуск с двойной страховкой: что бы ни случилось с сохранением,
   игрок видит рабочий экран, а не пустоту. */
measureBase();
let had = false, broke = false;
try { had = load(); } catch(e){ had = false; }
if(!had) newGame();
try { render(); }
catch(e){
  broke = true; had = false;
  try { localStorage.removeItem(SAVE_KEY); } catch(_){}
  newGame(); render();
}
if(broke){
  modal('Сохранение не подошло', 'Начинаем заново',
    '<p>Прежняя партия была сохранена другой версией симулятора и не открылась. '
    + 'Она удалена, чтобы не мешать: перед вами чистый ' + SIM.horizon.startYear + ' год.</p>'
    + '<p class="hint">Если это повторится — обновите страницу с Ctrl+F5.</p>',
    [{label:'Понятно', go: intro}]);
} else if(had && S.turn > 1){
  modal('Партия продолжается', S.year + ' год',
    '<p>Сохранение восстановлено: ход ' + S.turn + ' из ' + SIM.horizon.years + ', в казне '
    + f1(S.cash) + ' млрд ₽, завершено проектов ' + doneP().length + '.</p>',
    [{label:'Продолжить', go:()=>{}},
     {label:'Начать заново', sec:true, go:() => { newGame(); render(); intro(); }}]);
} else intro();
</script>
