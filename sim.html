<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый Кёнигсберг — градостроительный симулятор</title>
<meta name="description" content="Симулятор развития Калининграда на 20 лет: бюджет, трамвайная сеть с пассажиропотоком, подряды, местная дипломатия, назначения и развилки. Собран из заметок концепции «Новый Кёнигсберг».">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#080b10; --panel:#0e141c; --panel2:#131b25; --panel3:#18222e; --line:#1d2835;
  --tx:#dfe7ef; --tx2:#8ea0b4; --tx3:#5d6e82;
  --acc:#4cc2ff; --ok:#4fd6bf; --warn:#ffb03a; --bad:#ff5470; --idle:#5d7085;
  --p1:#ff5470; --p2:#ff9f45; --p3:#ffd75e; --p4:#4fd6bf; --p5:#6f8dab;
  /* Слои и радиусы заданы один раз, чтобы панели, карточки и кнопки
     скруглялись одинаково, а не каждая на свой лад. */
  --r1:7px; --r2:10px; --r3:15px;
  --edge:inset 0 1px 0 rgba(255,255,255,.035);
  --lift:0 1px 2px rgba(0,0,0,.4);
  --ring:0 0 0 2px var(--bg),0 0 0 4px rgba(76,194,255,.55);
  --tap:44px;                     /* меньше этого палец не попадает */
  --safeL:env(safe-area-inset-left,0px);
  --safeR:env(safe-area-inset-right,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
/* Клавиатурный фокус был не виден совсем: обвод только для клавиатуры,
   чтобы мышь не получала рамку на каждый клик. */
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:4px;position:relative;z-index:2}
/* На телефоне высота в 100% меряется по развёрнутому браузеру, и нижняя
   полоса уезжает под панель адреса. dvh считает по видимой части. */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- верхняя полоса ---------- */
#top{flex:0 0 auto;display:flex;align-items:stretch;background:linear-gradient(#111927,var(--panel));
  border-bottom:1px solid var(--line);z-index:8;position:relative;box-shadow:var(--edge),0 1px 0 rgba(0,0,0,.5);
  padding-left:var(--safeL);padding-right:var(--safeR);padding-top:var(--safeT)}
#top .brand{padding:10px 16px;border-right:1px solid var(--line);min-width:206px;align-self:center}
#top .brand b{display:block;font-size:13px;font-weight:650;letter-spacing:.02em}
#top .brand span{font-size:10.5px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.stat{padding:9px 15px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  justify-content:center;min-width:92px}
/* Подпись показателя держится в одну строку: перенос «Полит. капитала»
   раздувал полосу вдвое и съедал карту на телефоне. */
.stat i{font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.25}
.stat small{font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.wide{flex:1;min-width:0}
.stat.wide b{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .go{margin:0;padding:0 22px;border:0;border-left:1px solid var(--line);
  background:linear-gradient(#153b4d,#112c3a);color:#cdefff;box-shadow:var(--edge);
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:filter .14s,background .14s}
#top .go:hover{filter:brightness(1.22);color:#fff}
#top .go:active{filter:brightness(.92)}
#top .go:disabled{background:var(--panel2);color:var(--tx3);cursor:default;filter:none;box-shadow:none}
#top .undo{margin:0;padding:0 15px;border:0;border-left:1px solid var(--line);
  background:var(--panel2);color:var(--tx2);font:inherit;font-size:15px;line-height:1;cursor:pointer;
  transition:background .14s,color .14s}
#top .undo:hover{background:var(--panel3);color:var(--tx)}
#top .undo:active{background:#1e2937}
#top .undo:disabled{color:var(--tx3);cursor:default;background:var(--panel2)}
.up{color:var(--ok)} .dn{color:var(--bad)}

#main{flex:1;display:flex;min-height:0}

/* ---------- боковая панель ---------- */
#side{width:376px;flex:0 0 376px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:5;min-height:0}
#ind{padding:10px 14px 11px;border-bottom:1px solid var(--line)}
.ibar{display:grid;grid-template-columns:74px 1fr 44px;align-items:center;gap:9px;padding:2px 0}
.ibar span{font-size:11.5px;color:var(--tx2)}
.ibar .tr{height:6px;border-radius:3px;background:#0d151e;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.55)}
.ibar .tr i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.3,0,.2,1);
  box-shadow:0 0 8px -2px currentColor}
.ibar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;color:var(--tx2);text-align:right}
.ibar em u{text-decoration:none;font-size:10px;margin-left:3px}

/* Семь вкладок в 376 px не влезают в строку — пусть переносятся на вторую. */
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:0 0 auto;background:#0b1119}
.tabs button{flex:1 1 25%;padding:9px 2px;background:transparent;border:0;
  border-bottom:2px solid transparent;min-height:36px;
  color:var(--tx3);font-size:11px;cursor:pointer;letter-spacing:.01em;white-space:nowrap;
  transition:color .14s,background .14s}
.tabs button:hover{color:var(--tx2);background:rgba(255,255,255,.025)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc);background:rgba(76,194,255,.06)}
.tabs button b{font-weight:600;color:var(--warn);margin-left:3px}
.pane{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  flex:1;scrollbar-width:thin;scrollbar-color:#263244 transparent;min-height:0;
  padding-bottom:var(--safeB)}
.pane::-webkit-scrollbar{width:8px}
.pane::-webkit-scrollbar-thumb{background:#263244;border-radius:4px}
.pane::-webkit-scrollbar-thumb:hover{background:#31415a}
.pane[hidden]{display:none}

.grp{padding:9px 14px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:600;background:#0b1119;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.sub{padding:10px 14px;font-size:11.5px;color:var(--tx3);line-height:1.5;border-bottom:1px solid var(--line)}

/* ---------- строка проекта ---------- */
/* Полоска слева помечает выбранное, не перекрашивая всю строку: так видно,
   где ты стоишь, даже когда рядом подсвечена наведённая. */
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:9px 14px 9px 14px;cursor:pointer;color:inherit;transition:background .12s,box-shadow .12s;
  position:relative;min-height:var(--tap)}
.item:hover,.item.hot{background:var(--panel2)}
.item:active{background:var(--panel3)}
.item.sel{background:#16222f;box-shadow:inset 3px 0 0 var(--acc)}
.item .nm{display:flex;gap:8px;align-items:baseline}
.item .nm b{font-weight:500;font-size:12.5px;flex:1;line-height:1.35}
.item .nm span{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{margin-top:5px;display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx3)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.idle{color:var(--tx3)} .st.active{color:var(--warn)} .st.done{color:var(--ok)}
.st.locked{color:#3d4b5c}
.bar{height:4px;border-radius:2px;flex:1;background:#0d151e;overflow:hidden;min-width:28px;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:2px;transition:width .5s}

/* ---------- карточки решений ---------- */
.card{margin:10px 14px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r2);box-shadow:var(--edge),var(--lift)}
.card h5{margin:0 0 5px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.card h5 i{font-style:normal;margin-left:auto;font-size:11px;color:var(--warn);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.card p{margin:0 0 7px;font-size:11.5px;color:var(--tx2);line-height:1.5}
.card p.eff{color:var(--tx3)}
.card .do{width:100%;padding:9px 6px;border:1px solid #2a4763;background:#11222f;color:#bfe9ff;
  border-radius:var(--r1);font-size:12px;cursor:pointer;min-height:38px;
  box-shadow:var(--edge);transition:background .14s,border-color .14s}
.card .do:hover:not(:disabled){background:#16334a;border-color:#39618a}
.card .do:active:not(:disabled){background:#0f1d29}
.card .do:disabled{background:transparent;border-color:var(--line);color:var(--tx3);cursor:default;box-shadow:none}
.card.taken{border-color:#204a41;background:#0d1a18}
.card.taken h5 i{color:var(--ok)}
.chance{font-size:11px;color:var(--tx3);margin-top:6px;text-align:center}

/* ---------- отношения ---------- */
.rel{margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.rel .rh{display:flex;align-items:baseline;gap:8px;cursor:pointer;min-height:26px}
.rel .rh b{font-size:12.5px;font-weight:500;flex:1}
.rel .rh em{font-style:normal;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tx2)}
.rel .tr{height:6px;border-radius:3px;background:#0d151e;overflow:hidden;margin:6px 0 0;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.rel .tr i{display:block;height:100%;border-radius:3px;transition:width .5s}
.rel .why{font-size:11.5px;color:var(--tx3);line-height:1.5;margin:7px 0 0}
.rel .acts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rel .acts button{padding:9px 11px;border:1px solid var(--line);background:#0f1720;color:var(--tx2);
  border-radius:var(--r1);font-size:11.5px;cursor:pointer;text-align:left;line-height:1.45;
  min-height:38px;transition:border-color .14s,color .14s,background .14s}
.rel .acts button:hover:not(:disabled){border-color:#2a4763;color:var(--tx);background:#111c27}
.rel .acts button:active:not(:disabled){background:#0b1119}
.rel .acts button:disabled{opacity:.45;cursor:default}
.rel .acts button b{display:block;color:var(--tx);font-weight:500;font-size:12px}
.rel .acts button i{font-style:normal;color:var(--warn);font-size:11px}

/* ---------- кадры ---------- */
.post{border-bottom:1px solid var(--line);padding:11px 14px}
.post>h5{margin:0 0 3px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.post>p{margin:0 0 8px;font-size:11.5px;color:var(--tx3);line-height:1.45}
.cand{border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;margin-bottom:6px;background:#0f1720}
.cand.on{border-color:#2a5a4e;background:#0d1a18}
.cand b{display:block;font-size:12px;font-weight:500;margin-bottom:2px}
.cand .tr8{font-size:11.5px;color:var(--tx3);line-height:1.45;margin-bottom:6px}
.cand .fx{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.cand .fx span{font-size:10.5px;padding:1px 7px;border-radius:999px;background:#0f1b18;border:1px solid #1f4239;
  color:#79dcc9;font-variant-numeric:tabular-nums}
.cand .fx span.neg{background:#1c0f14;border-color:#4a2230;color:#ff8b9e}
.cand button{width:100%;padding:9px 5px;border:1px solid #2a4763;background:#11222f;color:#bfe9ff;
  border-radius:var(--r1);font-size:11.5px;cursor:pointer;min-height:36px;
  box-shadow:var(--edge);transition:background .14s}
.cand button:hover:not(:disabled){background:#16334a}
.cand button:active:not(:disabled){background:#0f1d29}
.cand button:disabled{background:transparent;border-color:var(--line);color:var(--tx3);cursor:default;box-shadow:none}

/* ---------- сеть ---------- */
.netstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.netstat div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px}
.netstat i{font-style:normal;display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:2px}
.netstat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.netstat small{display:block;font-size:10.5px;color:var(--tx3)}
.netstat .warnbox{grid-column:1/-1;background:#160f06;border-color:#4a3616}
.netstat .warnbox b{font-size:12.5px;color:var(--warn);font-weight:500;line-height:1.45;display:block}
.corr .nm b::before{content:"";display:inline-block;width:16px;height:0;border-top:2.5px solid currentColor;
  vertical-align:middle;margin-right:7px}
.corr.done .nm b::before{border-color:var(--ok)}
.corr.active .nm b::before{border-color:var(--warn);border-top-style:dashed}
.corr.idle .nm b::before{border-color:var(--idle);border-top-style:dashed}

/* ---------- хроника ---------- */
.yr{border-bottom:1px solid var(--line);padding:10px 14px}
.yr h6{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.yr div{font-size:11.5px;color:var(--tx2);line-height:1.5;padding:1.5px 0 1.5px 13px;position:relative}
.yr div::before{content:"·";position:absolute;left:2px;color:var(--tx3)}
.yr div.g{color:#79dcc9} .yr div.b{color:#ff8b9e} .yr div.m{color:var(--tx3)}
.yr .rw{flex:0 0 auto;background:none;border:0;color:var(--tx3);cursor:pointer;
  font-size:12.5px;line-height:1;padding:0 1px}
.yr .rw:hover{color:var(--acc)}

/* ---------- карта ---------- */
#map{flex:1;position:relative;background:#080b10;min-width:0}
.maplibregl-ctrl-attrib{background:rgba(8,11,16,.8)!important;color:var(--tx3)!important;font-size:10px!important}
.maplibregl-ctrl-attrib a{color:var(--tx2)!important}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button span{filter:invert(1) opacity(.75)}

.pin{cursor:pointer;white-space:nowrap;user-select:none;line-height:0}
/* Метки на карте нарисованы в 20 px, а палец попадает примерно в 40.
   Невидимая площадка вокруг каждой метки ловит промах, не меняя рисунка.
   position здесь не трогаем: маркеру его ставит сама MapLibre (absolute,
   и двигает потом transform'ом). Стоит перебить на relative — маркер
   уходит в обычный поток, основание у каждого следующего съезжает на
   высоту предыдущих, и метки встают мимо своих мест. Absolute сам по себе
   держит площадку, никакой relative для неё не нужен. */
@media (pointer:coarse){
  .pin::after,.fork::after,.port::after,.dest::after{content:"";position:absolute;
    left:50%;top:50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
}
.pin .ring{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--pg)*1%), rgba(255,255,255,.07) 0);transition:background .6s}
.pin .d{width:calc(var(--s) - 5px);height:calc(var(--s) - 5px);border-radius:50%;background:var(--c);opacity:.42;
  border:1.5px solid var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 14px -3px var(--c);transition:opacity .2s}
.pin.done .d{opacity:.62}
.pin.act .d{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.78}}
.pin .lb{position:absolute;left:calc(50% + var(--s)/2 + 9px);top:50%;transform:translateY(-50%);
  font-size:11.5px;line-height:1.3;color:#cfdae6;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;
  opacity:0;transition:opacity .18s}
.pin.show .lb,.pin:hover .lb{opacity:1}
.pin:hover .d,.pin.sel .d{opacity:.85}
.pin.city .d{background:transparent;border-style:dashed}
.pin .lb b{font-weight:500;color:#fff}
.pin .lb i{font-style:normal;color:var(--tx3);margin-left:6px;font-variant-numeric:tabular-nums}
.fork{cursor:pointer;width:21px;height:21px;border-radius:50%;box-sizing:border-box;display:grid;place-items:center;
  font-size:11.5px;font-weight:600;background:#1b1408;border:1px solid #7a5a1c;color:#ffc44d;
  box-shadow:0 0 12px -3px #ffb03a}
.fork.done{background:#0e1a16;border-color:#215044;color:#4fd6bf;box-shadow:none}
.fork:hover{filter:brightness(1.35)}
.plc{font-size:9.5px;letter-spacing:.1em;opacity:.85;text-transform:uppercase;color:#7287a0;
  text-shadow:0 1px 4px #000,0 0 6px #000;pointer-events:none;white-space:nowrap}
.port{cursor:pointer;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  font-size:11px;background:#0d1620;border:1px solid #2b4257;color:#6f8ba6;
  box-sizing:border-box;transition:.15s}
.port.on{background:#0b1f26;border-color:#2d7a8c;color:#4cc2ff;box-shadow:0 0 12px -3px #4cc2ff}
.port.air.on{border-color:#2d8c5e;color:#67e8a0;box-shadow:0 0 12px -3px #67e8a0}
.dest.air.on{border-color:#2d8c5e;color:#a8f0c8}
.port:hover{filter:brightness(1.4)}
.dest{cursor:pointer;font-size:10px;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  white-space:nowrap;background:rgba(11,17,25,.9);border:1px solid #223247;color:#6f8ba6;
  text-shadow:0 1px 3px #000;transition:.15s}
.dest.on{border-color:#2d7a8c;color:#bfe9ff;background:rgba(9,28,38,.92)}
.dest.dark{border-color:#5a2634;color:#ff8b9e}
.dest:hover{filter:brightness(1.4)}

#views{position:absolute;left:14px;top:14px;z-index:4;display:flex;gap:6px}
#views button{padding:7px 12px;background:rgba(14,20,28,.92);border:1px solid var(--line);color:var(--tx2);
  border-radius:var(--r1);cursor:pointer;font-size:12px;backdrop-filter:blur(8px);white-space:nowrap;
  box-shadow:var(--edge),0 2px 8px -4px #000;transition:color .14s,border-color .14s,background .14s}
#views button:hover{color:var(--tx);border-color:#31445c}
#views button:active{background:rgba(24,34,46,.95)}
/* Текущий охват карты виден и без подписи — иначе на телефоне четыре
   одинаковые кнопки ничего не говорят. */
#views button.on{color:var(--tx);border-color:#2d5f80;background:rgba(14,38,52,.94)}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(14,20,28,.92);border:1px solid var(--line);
  border-radius:var(--r2);padding:10px 12px;font-size:11.5px;color:var(--tx2);backdrop-filter:blur(8px);z-index:4;
  box-shadow:var(--edge),0 6px 20px -10px #000}
#legend b{display:block;color:var(--tx3);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:6px;font-weight:600}
#legend .lg{display:flex;align-items:center;gap:8px;padding:1.5px 0}
#legend .sw{width:9px;height:9px;border-radius:50%;background:currentColor;flex:0 0 9px}

/* ---------- карточка ---------- */
#det{position:absolute;top:0;right:0;bottom:0;width:424px;max-width:100%;background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;z-index:10;box-shadow:-20px 0 50px -20px #000;
  padding-right:var(--safeR)}
#det.open{transform:none}
#det .top{padding:14px 52px 12px 18px;border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(var(--panel2),var(--panel))}
#det h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
#det .x{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:transparent;
  color:var(--tx3);font-size:22px;cursor:pointer;border-radius:var(--r1);line-height:1}
#det .x:hover{background:var(--panel2);color:var(--tx)}
#det .x:active{background:var(--panel3)}
#ops{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
#ops .money{display:flex;gap:14px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
#ops .money div{font-size:11px;color:var(--tx3)}
#ops .money b{display:block;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums;font-weight:600}
#ops .prog{height:7px;border-radius:4px;background:#0a1017;overflow:hidden;margin-bottom:9px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
#ops .prog i{display:block;height:100%;background:var(--warn);border-radius:4px;transition:width .5s;
  box-shadow:0 0 10px -2px var(--warn)}
#ops .btns{display:flex;gap:7px;flex-wrap:wrap}
#ops button{flex:1 1 120px;padding:10px 6px;border-radius:var(--r1);font-size:12px;cursor:pointer;
  border:1px solid #2a4763;background:#11222f;color:#bfe9ff;min-height:var(--tap);
  box-shadow:var(--edge);transition:background .14s,border-color .14s}
#ops button:hover:not(:disabled){background:#16334a;border-color:#39618a}
#ops button:active:not(:disabled){background:#0f1d29}
#ops button:disabled{background:transparent;border-color:var(--line);color:var(--tx3);cursor:default;box-shadow:none}
#ops button.sec{border-color:var(--line);background:transparent;color:var(--tx2)}
#ops button.sec.on{border-color:var(--warn);color:var(--warn);background:#1c1609}
.pick{margin:0 0 9px}
.pick>b{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  margin-bottom:6px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:5px;border-radius:var(--r1);
  border:1px solid var(--line);background:#0f1720;color:var(--tx2);font-size:11.5px;cursor:pointer;line-height:1.45;
  min-height:38px;transition:border-color .14s,color .14s,background .14s}
.opt:hover:not(:disabled){border-color:#2a4763;color:var(--tx);background:#111c27}
.opt:active:not(:disabled){background:#0b1119}
.opt:disabled{opacity:.45;cursor:default}
.opt.on{border-color:var(--acc);background:#10212e;color:var(--tx);box-shadow:0 0 0 1px rgba(76,194,255,.2)}
.opt b{display:block;font-size:12px;color:var(--tx);font-weight:500}
.opt i{font-style:normal;color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;padding:11px 18px;border-bottom:1px solid var(--line);
  font-size:12.5px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;color:var(--tx);font-variant-numeric:tabular-nums}
#det .body{padding:14px 18px calc(40px + var(--safeB));overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;flex:1;font-size:13px;line-height:1.6;color:#c9d5e2}
#det .body h4{margin:20px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:600}
#det .body p{margin:0 0 9px}
#det .body ul,#det .body ol{margin:0 0 9px;padding-left:19px}
#det .body li{margin:0 0 3px}
#det .body hr{border:0;border-top:1px solid var(--line);margin:15px 0}
#det .body strong{color:#fff;font-weight:600}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid currentColor}
.wl{color:var(--acc);cursor:pointer;border-bottom:1px dashed rgba(76,194,255,.4)}
.wl:hover{border-bottom-style:solid}
.wl.dead{color:var(--tx2);border-bottom-color:rgba(142,160,180,.35);cursor:default}
.note{margin:0 0 12px;padding:9px 11px;border-left:2px solid #2b3a4d;background:#0c1219;color:var(--tx3);font-size:12px}
.note.rule{border-left-color:var(--warn);background:#140f06;color:#d8be8e}
.note.rule b{color:var(--warn)}
.gains{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.gains span{padding:2px 8px;border-radius:999px;font-size:11.5px;background:#0f1b18;border:1px solid #1f4239;
  color:#79dcc9;font-variant-numeric:tabular-nums}
.gains span.neg{background:#1c0f14;border-color:#4a2230;color:#ff8b9e}
.obs{display:inline-block;margin:0 0 12px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r1);
  color:var(--tx2);text-decoration:none;font-size:12px;background:var(--panel2)}
.obs:hover{color:var(--acc);border-color:#2a4763}

/* ---------- модальное окно ---------- */
#veil{position:fixed;inset:0;background:rgba(4,7,11,.82);backdrop-filter:blur(5px);z-index:30;
  display:grid;place-items:center;padding:22px;
  padding-left:max(22px,var(--safeL));padding-right:max(22px,var(--safeR));
  padding-bottom:max(22px,var(--safeB));padding-top:max(22px,var(--safeT))}
#veil[hidden]{display:none}
#modal{width:min(700px,100%);max-height:88vh;max-height:88dvh;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r3);box-shadow:0 30px 80px -20px #000,var(--edge);
  display:flex;flex-direction:column;overflow:hidden}
#modal .mh{padding:18px 24px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--panel2),var(--panel))}
#modal .mh i{font-style:normal;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}
#modal .mh h2{margin:3px 0 0;font-size:21px;font-weight:600;letter-spacing:-.01em}
#modal .mb{padding:18px 24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  font-size:13.5px;line-height:1.62;color:#c9d5e2}
#modal .mb p{margin:0 0 11px}
#modal .mb h4{margin:18px 0 7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:600}
#modal .mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;
  flex-wrap:wrap;background:var(--panel)}
#modal .mf button{padding:11px 20px;border-radius:var(--r1);border:1px solid #2a4763;
  background:linear-gradient(#153b4d,#112c3a);color:#cdefff;box-shadow:var(--edge);
  font-size:13.5px;font-weight:600;cursor:pointer;min-height:var(--tap);transition:filter .14s}
#modal .mf button:hover{filter:brightness(1.22);color:#fff}
#modal .mf button:active{filter:brightness(.92)}
#modal .mf button.sec{border-color:var(--line);background:transparent;color:var(--tx2);font-weight:400;
  box-shadow:none}
.evt{margin:0 0 11px;padding:10px 13px;border-radius:var(--r2);border-left:3px solid var(--line);background:var(--panel2)}
.evt b{display:block;font-size:13px;margin-bottom:3px}
.evt.g{border-left-color:var(--ok)} .evt.g b{color:#79dcc9}
.evt.b{border-left-color:var(--bad)} .evt.b b{color:#ff8b9e}
.evt.n{border-left-color:var(--acc)} .evt.n b{color:#9cd8f5}
.deltas{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 6px}
.deltas span{padding:3px 9px;border-radius:var(--r1);background:var(--panel2);border:1px solid var(--line);font-size:12px;
  font-variant-numeric:tabular-nums;color:var(--tx2)}
.scoreline{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:10px;padding:3px 0;font-size:12.5px}
.scoreline .tr{height:6px;border-radius:3px;background:#111a24;overflow:hidden}
.scoreline .tr i{display:block;height:100%;border-radius:3px}
.scoreline em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2)}
/* личные итоги по направлениям */
.role{margin:10px 14px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2)}
.role h5{margin:0;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.role h5 b{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--tx2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.role .rv{font-size:11.5px;color:var(--acc);margin:3px 0 0}
.role .rwhy{margin:5px 0 0;font-size:11.5px;color:var(--tx2);line-height:1.5}
.rmet{padding:6px 0 0;margin-top:7px;border-top:1px solid var(--line)}
.rmet .n{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12px}
.rmet .n em{font-style:normal;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rmet .u{display:block;font-style:normal;font-size:10.5px;color:var(--tx3);margin:1px 0 4px}
.rmet .tr{display:block;height:5px;border-radius:3px;background:#111a24;overflow:hidden}
.rmet .tr i{display:block;height:100%;border-radius:3px;transition:width .5s}
.role .rsp{margin-top:6px;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
/* чужое видно, но не нажимается */
.pane.locked > *:not(.lockbar){pointer-events:none;opacity:.5}
.lockbar{margin:10px 14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--panel2);color:var(--tx2);font-size:11.5px;line-height:1.45}
.tabs button.off{color:var(--tx3)}
/* полоса мест: кто за столом, кто готов, кому передавать */
#seats{flex:0 0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:6px 14px;padding-left:max(14px,var(--safeL));padding-right:max(14px,var(--safeR));
  background:var(--panel2);border-bottom:1px solid var(--line);font-size:11.5px}
#seats .s{padding:6px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--tx3);cursor:pointer;white-space:nowrap;
  transition:color .14s,border-color .14s,background .14s}
#seats .s:hover{color:var(--tx2)}
#seats .s.on{border-color:var(--acc);color:var(--tx);background:#10222e}
#seats .s.rdy{color:var(--ok);border-color:#1f4a45}
#seats .pass{margin-left:auto;padding:7px 14px;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--panel3);color:var(--tx);cursor:pointer;font:inherit;font-size:11.5px;white-space:nowrap}
#seats .pass:hover{background:#22303f}
#seats .pass:active{background:#1a2530}
#seats .s.off{opacity:.45}
#seats .netcode{margin-left:auto;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
#seats .netcode b{color:var(--acc);letter-spacing:.12em;font-weight:600}
.netbig{margin:2px 0 8px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--panel2);text-align:center}
.netbig b{display:block;font-size:26px;letter-spacing:.22em;color:var(--acc);font-weight:600}
.netbig span{display:block;margin-top:4px;font-size:11px;color:var(--tx3);
  letter-spacing:.06em;text-transform:uppercase}
.netwho{display:flex;flex-direction:column;gap:5px;margin:0 0 8px}
.netwho div{display:flex;gap:8px;align-items:baseline;font-size:12px;
  padding:5px 9px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel2)}
.netwho i{font-style:normal;margin-left:auto;font-size:10.5px;color:var(--tx3)}
.netwho div.here i{color:var(--ok)}
textarea.netbox{width:100%;height:78px;padding:8px 9px;border:1px solid var(--line);
  border-radius:var(--r1);background:var(--panel2);color:var(--tx2);font:inherit;font-size:11px;
  line-height:1.35;resize:vertical;word-break:break-all}
/* лобби */
.lobcnt{display:flex;gap:7px;margin:0 0 4px}
.lobcnt button{flex:1;padding:11px 0;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--panel2);color:var(--tx2);font:inherit;font-size:13px;cursor:pointer;min-height:var(--tap)}
.lobcnt button.on{border-color:var(--acc);color:var(--tx);background:#10222e}
.lobnames{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.lobnames input{flex:1 1 42%;min-width:0;padding:9px 10px;border:1px solid var(--line);
  border-radius:var(--r1);background:var(--panel2);color:var(--tx);font:inherit;font-size:12px}
.lobrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lobrow b{font-size:12.5px;font-weight:600;flex:0 0 92px}
.lobrow span{flex:1;font-size:11px;color:var(--tx3);line-height:1.35}
.lobrow select{flex:0 0 auto;max-width:44%;padding:8px 7px;border:1px solid var(--line);
  border-radius:var(--r1);background:var(--panel2);color:var(--tx);font:inherit;font-size:11.5px}
.rchip{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx3);margin-left:auto;font-weight:600;white-space:nowrap}
.yr div.j{display:flex;gap:8px;align-items:baseline;color:var(--tx);flex-wrap:wrap}
.yr div.j span{flex:1 1 60%}
.yr div.j b.who{font-weight:600;color:var(--tx3);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;margin-right:5px}
.yr div.j em{font-style:normal;color:var(--tx2);font-size:11px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{color:var(--tx3);font-size:12px}

/* ---------- узкий экран ---------- */
/* Панель перестаёт делить экран с картой и выезжает поверх неё. Затемнение
   позади нужно не для красоты: без него панель некуда закрыть — бургер
   остаётся под ней. */
#scrim{position:absolute;inset:0;z-index:7;background:rgba(4,7,11,.6);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,visibility .22s;border:0}
#scrim.on{opacity:1;visibility:visible;pointer-events:auto}
/* Затемнение имеет смысл только там, где панель выезжает поверх карты. */
@media (min-width:1061px){ #scrim{display:none} }
#sideClose{display:none}

@media (max-width:1060px){
  #side{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:9;
    box-shadow:24px 0 50px -24px #000}
  #side.open{transform:none}
  #main{position:relative}
  #views{left:66px}
  #det{width:100%}
  #legend{display:none}
  #top .brand{min-width:0;padding:10px 12px}
  #top .brand span{display:none}
  #burger{display:block!important}
  /* Возврат к карте — там же, где панель началась, и всегда на виду. */
  #sideClose{display:flex;align-items:center;gap:8px;flex:0 0 auto;width:100%;
    padding:10px 14px;min-height:var(--tap);border:0;border-bottom:1px solid var(--line);
    background:var(--panel2);color:var(--tx2);font:inherit;font-size:12px;cursor:pointer;text-align:left}
  #sideClose:hover{color:var(--tx);background:var(--panel3)}
  #sideClose b{margin-left:auto;font-weight:400;font-size:11px;color:var(--tx3)}
}

#burger{display:none;position:absolute;left:14px;top:14px;z-index:6;width:42px;height:42px;
  border-radius:var(--r2);background:rgba(14,20,28,.94);border:1px solid var(--line);color:var(--tx);
  font-size:17px;cursor:pointer;backdrop-filter:blur(8px);box-shadow:var(--edge),0 2px 8px -4px #000}
#burger:active{background:rgba(24,34,46,.96)}

/* Узкий экран: кнопка хода не должна уезжать за край — режем всё остальное.
   Сеть и туризм всё равно подробно показаны на своих вкладках. */
@media (max-width:1150px){ #top .stat.port{display:none} }
@media (max-width:1000px){ #top .stat.tour{display:none} }
@media (max-width:720px){ #top .stat.net{display:none} }
@media (max-width:820px){
  #top .brand,#top .stat.wide{display:none}
  .stat{padding:8px 11px;min-width:0}
  .stat b{font-size:14px}
  .stat small{display:none}
  #top .go{flex:1;padding:0 12px;font-size:12.5px}
  #top .undo{padding:0 11px}
  #seats{font-size:11px;padding:6px 10px}
  .lobrow b{flex:0 0 78px}
  #side{width:100%;flex-basis:100%}
  #ind .sidestat{display:block}
  .netstat{grid-template-columns:1fr}
}

/* ---------- телефон ---------- */
@media (max-width:640px){
  /* Показателей в полосе остаётся три; год и казна — самое нужное,
     остальное разложено по вкладкам и продублировано в «сводке». */
  .stat{padding:7px 10px;min-width:0;flex:0 0 auto}
  .stat i{font-size:9px;letter-spacing:.06em}
  /* «Полит. капитал» в 375 px обрывается многоточием и перестаёт читаться.
     Короткая подпись лежит рядом в data-s, чтобы на широком экране
     осталось полное название. */
  .stat i[data-s]{font-size:0}
  .stat i[data-s]::after{content:attr(data-s);font-size:9px;letter-spacing:.06em}
  .stat b{font-size:15px}
  #top .go{flex:1 1 auto;min-width:118px;padding:0 10px;font-size:13px}
  #top .undo{padding:0 13px;font-size:17px}
  /* Восемь вкладок в две строки по четыре: подписи целиком, палец попадает. */
  .tabs button{flex:1 1 25%;font-size:10.5px;padding:10px 1px;min-height:var(--tap)}
  #ind{padding:9px 12px 10px}
  .ibar{grid-template-columns:70px 1fr 40px;gap:8px;padding:3px 0}
  .grp,.sub,.item,.rel,.post,.yr{padding-left:14px;padding-right:14px}
  .card,.role{margin-left:12px;margin-right:12px}
  /* Полоса охватов может не влезть — пусть прокручивается, а не рвётся. */
  #views{left:0;right:0;top:66px;gap:6px;padding:0 14px;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #views::-webkit-scrollbar{display:none}
  #views button{flex:0 0 auto}
  #burger{top:12px;left:12px}
  /* Карточка проекта и окна разворачиваются на весь экран: на 375 px
     колонка в 424 px всё равно во весь экран, а отступы съедают текст. */
  #det .top{padding:12px 50px 11px 14px}
  #det h3{font-size:15px}
  #ops{padding:11px 14px}
  .kv{padding:11px 14px}
  #det .body{padding:13px 14px calc(36px + var(--safeB))}
  #veil{padding:0}
  #modal{width:100%;max-width:100%;height:100%;height:100dvh;max-height:none;border-radius:0;border:0}
  #modal .mh{padding:calc(14px + var(--safeT)) 18px 12px}
  #modal .mh h2{font-size:19px}
  /* Окно растянуто на весь экран, а текст в нём короткий — без этого
     подвал вставал там, где кончился текст, и «Дальше» оказывалось
     посреди экрана, вдали от большого пальца. */
  #modal .mb{padding:16px 18px;font-size:14px;flex:1 1 auto}
  #modal .mf{padding:12px 18px calc(12px + var(--safeB));flex-direction:column-reverse}
  #modal .mf button{width:100%}
  /* iOS увеличивает страницу, если в поле шрифт мельче 16 px, и обратно
     уже не отдаёт. Поэтому ввод на телефоне крупнее прочего текста. */
  input,select,textarea,textarea.netbox,.lobnames input,.lobrow select{font-size:16px!important}
  .lobrow{flex-wrap:wrap}
  .lobrow b{flex:1 1 100%}
  .lobrow select{max-width:none;flex:1 1 100%}
  .netbig b{font-size:23px;letter-spacing:.16em}
  .scoreline{grid-template-columns:92px 1fr 46px;gap:8px}
  .deltas span,.gains span{font-size:12px}
}
/* Лежачий телефон: высоты почти нет, отдаём её карте и тексту. */
@media (max-height:460px) and (orientation:landscape){
  .stat small,#top .brand span{display:none}
  .stat{padding:5px 10px}
  #ind{padding:6px 12px}
  .ibar{padding:1px 0}
  #modal{max-height:100dvh;border-radius:0}
  /* Лежачий телефон попадает под правило «уже 820 px» шириной экрана,
     и панель разворачивалась во все 812 px, закрывая карту целиком.
     Ширины тут вдоволь — панель возвращается к своим 376 px. */
  #side{width:min(376px,72vw);flex-basis:auto}
}

/* ---------- палец ---------- */
/* --tap объявлен наверху и роздан строкам, вкладкам и подвалу окна, но до
   кнопок действия не дошёл: они остались с прежними 29–38 px. Здесь
   раздача доведена до конца. Блок висит на грубом указателе, а не на
   ширине: палец не становится точнее оттого, что телефон повернули или
   игру открыли на планшете. Мышь при этом ничего не теряет. */
@media (pointer:coarse){
  .card .do,.cand button,.rel .acts button,.opt{min-height:var(--tap)}
  #views button{min-height:var(--tap);padding:0 14px}
  #burger{width:var(--tap);height:var(--tap)}
  /* Крестик карточки растёт вправо, поэтому заголовку добавлено место:
     иначе длинное название проекта подлезало бы под кнопку. */
  #det .x{width:var(--tap);height:var(--tap);right:6px;top:6px;font-size:24px}
  #det .top{padding-right:58px}
  /* «Передать» жмут каждый ход, а место за столом — чтобы посмотреть чужое. */
  #seats .s{padding:11px 13px}
  #seats .pass{padding:12px 15px}
  /* Возврат к решению — тот же приём, что и у меток на карте: площадка
     вокруг знака ловит промах, сам знак остаётся мелким и не ломает строку. */
  .yr .rw{position:relative}
  .yr .rw::after{content:"";position:absolute;left:50%;top:50%;
    width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
  /* Приближение приходит из библиотеки в 29 px — там своей меры нет. */
  .maplibregl-ctrl-group button{width:var(--tap)!important;height:var(--tap)!important}
}

.sidestat{display:none;margin:0 0 9px;padding:7px 9px;border-radius:var(--r1);background:var(--panel2);
  border:1px solid var(--line);font-size:11.5px;color:var(--tx2);line-height:1.45}
.sidestat b{color:var(--tx);font-weight:500}
</style>
</head>

      </div>
      <div id="det">

        <div id="ops"></div>

<script>
const DATA = {"vault":"Новый Кёнигсберг","projects":[{"id":"p0","name":"Воссоздание Королевского замка","min":15,"max":40,"avg":27.5,"prio":3,"scen":"всегда","eff":"символический","conf":"низкая","band":[0.85,1.5],"district":"Центр","districtNote":"Символическое ядро. Ключевой объект — [[Воссоздание Королевского замка]]. Развилки: [[Замок или парк]], [[Археология площадки замка]].","body":"Флагманский проект концепции по смыслу, но не по бюджетному приоритету.\n\n## Статус площадки\nДом Советов разобран выше нулевой отметки в сентябре 2024. Демонтаж фундамента\nпланируют завершить не ранее декабря 2026. Собственник территории — правительство\nобласти, действующий проект — парк с рабочим названием «Россия».\n\n## Нерешённое\nСм. [[Замок или парк]] и [[Археология площадки замка]]. До ответа на вопрос\n«воссоздание или новодел» цифра стоимости условна.\n\n## Откуда цифра\nАналог — Гумбольдтфорум в Берлине, примерно 680 млн евро. Калининградский объект\nменьше по объёму, российский уровень строительных цен ниже. Поправка на оба фактора\nдаёт порядок 15-40 млрд руб. **Это самая ненадёжная оценка во всём документе**,\nпотому что археология может сдвинуть её в любую сторону.","note":"04 Проекты/Воссоздание Королевского замка","years":8,"gain":{"облик":16,"экономика":4,"поддержка":4},"during":{},"private":0,"rules":["castle_window"],"why":"Флагман по смыслу, не по бюджетному приоритету. Площадка освобождается сейчас, потом на ней будет парк.","at":[20.5086,54.7103],"labelZoom":12.4,"geom":[{"type":"polygon","kind":"district","coords":[[20.506,54.708999999999996],[20.511200000000002,54.708999999999996],[20.511200000000002,54.7116],[20.506,54.7116]]}],"cityWide":false,"geomNote":"Прямоугольник — площадка Дома Советов, где стоял замок."},{"id":"p1","name":"Дизайн-код вывесок и фасадной рекламы","min":1,"max":3,"avg":2,"prio":1,"scen":"всегда","eff":"символический","conf":"высокая","band":[0.95,1.1],"district":"Торговля","districtNote":"Сквозная тема, не привязанная к району.", дах, который потом не лечится ничем:\nмаксимальная плотность поездок на территории с ограниченным числом мостовых связей.","note":"04 Проекты/Инфраструктура Октябрьского острова","years":4,"gain":{"экономика":6,"быт":3,"облик":2},"during":{},"private":2.0,"rules":[],"why":"Единственный блок, который частично сам себя финансирует. Рельс надо класть до зданий — окно закрывается.","at":[20.554,54.6965],"labelZoom":12.0,"geom":[{"type":"polygon","coords":[[20.515,54.7012],[20.534,54.7056],[20.56,54.7062],[20.582,54.7006],[20.5948,54.693],[20.58,54.6872],[20.552,54.6858],[20.529,54.689],[20.5152,54.6948]],"kind":"district"}],"cityWide":false,"geomNote":"Контур по габаритам острова из OSM, береговая линия упрощена."},{"id":"p4","name":"Ливнёвка и очистные сооружения","min":20,"max":40,"avg":30,"prio":1,"scen":"всегда","eff":"инфраструктурный","conf":"низкая","band":[0.85,1.5],"district":"Преголя","districtNote":"Река как неиспользованный ресурс. Три отдельных проекта: [[Ливнёвка и очистные сооружения]], [[Очистка Преголи]], [[Набережные и вывод промзон]]. Порядок жёсткий, см. [[Порядок работ по Преголе]].","body":"Условие, без которого [[Очистка Преголи]] бессмысленна.\n\nЛивневая канализация во многом сбрасывает в реку без очистки, остаются прямые выпуски.\nЕсли сначала не перекрыть приток, через несколько лет получаются те же отложения\nза те же деньги.\n\nЖёсткий порядок: **сначала стоки, потом дно, только потом набережные.**","note":"04 Проекты/Ливнёвка и очистные сооружения","years":6,"gain":{"экология":20,"быт":3},"during":{},"private":0,"rules":[],"why":"Условие, без которого очистка реки бессмысленна.","at":[20.3176,54.691],"labelZoom":12.0,"geom":[{"type":"line","coords":[[20.4318,54.69424],[20.43216,54.69262]],"kind":"river-work"},{"type":"line","coords":[[20.49253,54.70693],[20.49353,54.70541]],"kind":"river-work"},{"type":"line","coords":[[20.58898,54.69339],[20.58808,54.69185]],"kind":"river-work"},{"type":"line","coords":[[20.52386,54.7066],[20.52444,54.7082 нчиво маленькой.\n\nПока районы не разобраны поимённо, цифра не значит ничего, кроме порядка величины.","note":"04 Проекты/Прочие районы города","years":12,"gain":{"быт":18,"поддержка":8},"during":{"поддержка":-0.3},"private":0,"rules":[],"why":"Заглушка на сопоставимую по размеру часть задачи. Пока районы не разобраны поимённо, цифра значит только порядок величины.","at":[20.575,54.738],"labelZoom":11.4,"geom":[{"type":"polygon","coords":[[20.345,54.68],[20.42,54.66],[20.56,54.656],[20.63,54.69],[20.625,54.745],[20.54,54.78],[20.43,54.77],[20.36,54.73]],"kind":"city"}],"cityWide":true,"geomNote":"Контур — грубая рамка города, а не его граница."},{"id":"p11","name":"Режим для малого иностранного бизнеса","min":1,"max":2,"avg":1.5,"prio":2,"scen":"открытая-граница","eff":"бытовой","conf":"низкая","band":[0.85,1.5],"district":"Торговля","districtNote":"Сквозная тема, не привязанная к району.","body":"Главная содержательная рекомендация торгового раздела: **сто маленьких вместо четырёх больших.**\n\nЕвропейский вид города создают пекарни, кофейни, лавки и мастерские, а не ИКЕА.\nПорог входа на порядок ниже, решение принимает один человек, а не правление\nв другой стране.\n\n## Инструмент — совсем другой\nНе таможенный режим, а условия регистрации бизнеса, ВНЖ и рабочие визы\nдля иностранных предпринимателей плюс доступные помещения первых этажей.\n\nСам по себе почти ничего не стоит. Цифра — на администрирование.","note":"04 Проекты/Режим для малого иностранного бизнеса","years":1,"gain":{"экономика":6,"облик":6},"during":{},"private":1.0,"rules":["small_biz_scenario"],"why":"Сто маленьких вместо четырёх больших. Пекарни и мастерские создают европейский вид, а не ИКЕА.","at":[20.4975,54.7192],"labelZoom":12.8,"geom":[],"cityWide":true,"geomNote":""},{"id":"p12","name":"Ремонт и замена фонда Сельмы","min":50,"max":70,"avg":60,"prio":4,"scen":"всегда","eff":"бытовой","conf":"низкая","band":[0.85,1.5],"district":"Сельма","districtNote":"Спальный район, типовая застройка, гибридная стратегия. См. [[Ремонт и замена фонда Сельмы]].","body":"Гибридная стратегия: часть фонда — косметика, часть — постепенная замена по мере износа.\n\n## Правовой инструмент\nКомплексное развитие территорий (КРТ) — то, через что это вообще возможно.\nОтдельного закона о реновации вне Москвы нет. Писать раздел надо в терминах КРТ.\n\n## Состав цифры\nКосметика фонда 2-3 млн м² по 5-15 тыс/м², плюс замена примерно 15% фонда\nпо 80-100 тыс/м². Растянуто на десятилетия, поэтому годовая нагрузка низкая.","note":"04 Проекты/Ремонт и замена фонда Сельмы","years":10,"gain":{"быт":13,"поддержка":3},"during":{},"private":0,"rules":[],"why":"Гибрид косметики и замены по мере износа, через КРТ.","at":[20.488,54.7415],"labelZoom":12.0,"geom":[{"type":"polygon","coords":[[20.47,54.733],[20.5012,54.7344],[20.503,54.7492],[20.4742,54.7498],[20.4668,54.7412]],"kind":"district"}],"cityWide":false,"geomNote":"Контур условный, нарисован вокруг застройки Сельмы."},{"id":"p13","name":"Реставрация Амалиенау","min":25,"max":40,"avg":32.5,"prio":2,"scen":"всегда","eff":"символический","conf":"низкая","band":[0.85,1.5],"district":"Амалиенау","districtNote":"Сохранившаяся немецкая застройка (хайматстиль, югендстиль). Модельный район стиля. См. [[Реставрация Амалиенау]].","body":"Модельный район неоевропейского стиля.\n\n## Чего не хватает в исходной концепции — механизма\nБольшинство вилл в долевой собственности жильцов, капремонт идёт через региональный фонд.\nБез отдельного инструмента «требуется капитальный ремонт» останется пожеланием. Нужны:\n- субсидии на фасады;\n- охранные обязательства;\n- запрет на замену столярки и остекление балконов;\n- регламент по кровле и цвету.\n\n## Состав цифры\nПорядка 300-500 зданий по 15-50 млн на здание, плюс улицы и сети.","note":"04 Проекты/Реставрация Амалиенау","years":7,"gain":{"облик":14,"поддержка":3},"during":{},"private":0,"rules":[],"why":"Модельный район неоевропейского стиля. Без механизма субсидий на фасады остаётся пожеланием.","a 4.73697],[20.48778,54.73781],[20.48675,54.7382],[20.48665,54.73855],[20.48752,54.73908],[20.48894,54.73975],[20.49051,54.74019],[20.49017,54.74055],[20.4889,54.74021],[20.48778,54.74065],[20.48773,54.7415]],"kind":"tram"},{"type":"line","coords":[[20.49887,54.69233],[20.50015,54.69206],[20.50157,54.69145],[20.49512,54.6889],[20.49234,54.6876],[20.49173,54.68709],[20.48998,54.68422],[20.48734,54.68261],[20.48505,54.68258],[20.48253,54.68183],[20.47858,54.68122],[20.46902,54.68148],[20.46857,54.68401],[20.47001,54.68415]],"kind":"tram"},{"type":"line","coords":[[20.50589,54.71598],[20.5054,54.71946],[20.50786,54.71993],[20.50166,54.71887],[20.50024,54.71989],[20.49905,54.72024],[20.49434,54.72001],[20.49262,54.71922],[20.49123,54.71936],[20.48809,54.72017],[20.48579,54.72004],[20.48512,54.72041],[20.48337,54.72087],[20.47574,54.72042],[20.47127,54.72134],[20.47087,54.72093]],"kind":"tram"}],"cityWide":false,"geomNote":"Пять приоритетных коридоров, положенных на реальные улицы. Это не вся сеть: в оценке 60–80 км пути."},{"id":"p16","name":"Трамвайный подвижной состав","min":15,"max":35,"avg":25,"prio":1,"scen":"всегда","eff":"бытовой","conf":"средняя","band":[0.9,1.28],"district":"Город целиком","districtNote":"Общегородские проекты и регламенты.","body":"Порядка 80-120 вагонов на сеть 60-80 км.\n\n## Принцип закупки\nОсновной парк — каталожный серийный, без доработок. В этом и состоит смысл ухода\nс метровой колеи. Спецзаказ оправдан в двух местах:\n- узкий габарит под конкретные участки старого центра, если обследование радиусов\n  покажет необходимость;\n- версия под трамвай-поезд, если он появится.\n\nЕсли спецзаказом становится весь парк — проблема метровой колеи воспроизведена заново.\n\n## Поставщики на 1435\nSiemens, Stadler, Škoda, PESA, Alstom, плюс CRRC и Durmazlar. Российские заводы тоже\nдоступны через смену тележки: разница с 1524 всего 89 мм, кузов не трогается.\nВилка цены отсюда и берётся.","note":"04 Проекты/Трамвайный подвижной состав","years":4,"gain":{"быт":2},"during":{},"private":0,"rules":["stock_needs_track"],"why":"80–120 вагонов. Купленные раньше пути они стоят в депо: деньги потрачены, эффекта нет.","at":[20.4946,54.7082],"labelZoom":12.9,"geom":[],"cityWide":true,"geomNote":""}],"forks":[{"name":"Археология площадки замка","status":"открыта","settled":"","pk":3,"money":2,"before":2030,"effect":"Обследование подвального яруса, пока идёт демонтаж фундамента. Разброс сметы замка сужается вдвое, при завершении +5 к облику: воссоздание с опорой на подлинные конструкции признают наследием.","body":"Под площадкой лежит подвальный ярус замка, частично раскопанный в нулевых\nи частично побитый сваями Дома Советов.\n\n## Вопрос\nЧто уцелело? От ответа зависит главное: **воссоздание с опорой на подлинные\nконструкции или чистый новодел по чертежам.** От этого — и стоимость,\nи то, признают ли объект наследием вообще.\n\n## Окно закрывается\nОценку надо делать сейчас, пока идёт демонтаж фундамента (до декабря 2026).\nПотом площадка будет засыпана и благоустроена.","note":"01 Развилки/Археология площадки замка","at":[20.5062,54.7092]},{"name":"Замок или парк","status":"открыта","settled":"","pk":4,"money":0,"before":2031,"effect":"Публичная позиция по площадке. Снимает надбавку за снос парка: окно остаётся открытым до конца горизонта.","body":"Площадка освобождается, но на неё уже есть чужой проект — парк «Россия».\n\n## Почему это вопрос срока, а не содержания\nПока площадка пустая, вы строите на пустыре. Как только парк открыт и им начали\nпользоваться, вы сносите работающее общественное пространство в центре города.\nЭто совсем другой разговор с горожанами — независимо от того, как парк появился.\n\n**Вывод:** по замку нужна публичная позиция «сейчас», а не «после»,\nхотя бы в виде альтернативы проекту парка.","note":"01 Развилки/Замок или парк","at":[20.5108,54.7118]},{"name":"Колея трамвая","status":"решена","settled":"1435 мм","pk":0,"money":0,"before":0,"effect":"Серийные вагоны доступны, но трамвай-поезд на областные ветки (1520 мм) невозможен: электрички и трамвай остаются разными сетями.","body":"## Решение: 1435 мм\n\n## Почему не 1000 мм\nШирина кузова упирается примерно в 2,3 м, а честная посадка 2+2 требует от 2,5 м.\nЖалоба на вместимость новых вагонов — не халтура производителя, а прямое следствие колеи.\nНикакой совместной разработкой это не чинится.\n\n## Почему не 1524 мм\nОтрезает от европейской инженерной школы, заявленной как ориентир концепции.\n**Цена решения:** теряется возможность трамвай-поезда на областные ветки,\nкоторые тоже 1520. Это осознанная жертва, её надо помнить.\n\n## Почему 1435 надёжнее, чем кажется\n1. Это не «европейская», а мировая колея. Кроме Siemens, Stadler, Škoda, PESA и Alstom\n   под неё серийно строят CRRC и Durmazlar, оба реально экспортируют.\n   Сценарий «купить негде» почти не реализуется.\n2. Переделка вагона с 1524 на 1435 — смена тележки: разница 89 мм, кузов не трогается.\n   Российские заводы остаются доступны через модификацию.\n\nИтого 1435 — вариант с наименьшим риском привязки к единственному поставщику,\nа не с наибольшим.\n\n## Следствие\nСовмещённый путь 1000+1435 возможен (разница 435 мм) и годится как переходный\nинструмент на двух-трёх коридорах. А вот 1435+1524 трёхниточным путём не разводится.\n**Выбор делается один раз, промежуточного варианта нет.**","note":"01 Развилки/Колея трамвая","at":[20.5058,54.7042]},{"name":"Логистика анклава","status":"открыта","settled":"","pk":5,"money":1,"before":0,"effect":"Порт, транзит, смена колеи на грузовом ходу. Закрывает дыру размером в раздел: +1,5 млрд ₽ в год частных вложений и +4 к экономике.","body":"**Дыра размером в отдельный раздел.** Порт, транзит, смена колеи на грузовом направлении.\n\nСейчас в концепции не покрыто ничем, а определяет и торговлю, и промышленность,\nи экономическую базу города целиком. См. [[Чего в концепции нет]].","note":"01 Развилки/Логистика анклава","at":[20.443,54.702]},{"name":"Порядок работ по Преголе","status":"решена","settled":"стоки → дно → набережные","pk":0,"money":0,"before":0,"effect":"Правило действует: очистка раньше ливнёвки теряет эффект.","body":"## Решение: стоки → дно → набережные\n\nДноуглубление и очистка бессмысленны, пока не перекрыт приток. Если сначала\nне закрыть источники, через несколько лет получаются те же отложения за те же деньги.\n\n## Отдельно\nВывод прибрежных промзон и красные линии начинать **раньше всего остального**,\nвключая стоки. Это самая долгая часть и почти бесплатная на старте.","note":"01 Развилки/Порядок работ по Преголе","at":[20.533,54.699]},{"name":"Судьба существующих ТЦ","status":"открыта","settled":"","pk":4,"money":0,"before":0,"effect":"Договорённость с крупными собственниками. Снимает удар по поддержке при развороте к уличной торговле.","body":"Концепция разворачивается к уличной торговле и мелкому формату.\nЧто при этом происходит с уже построенными торговыми центрами в городе — не продумано.\n\nИгнорировать нельзя: это крупные собственники с политическим весом.","note":"01 Развилки/Судьба существующих ТЦ","at":[20.5497,54.7722]},{"name":"Таможенный режим на польской границе","status":"открыта","settled":"","pk":6,"money":0,"before":0,"effect":"Работа на федеральном уровне в терминах изменения ОЭЗ. Заметно повышает шанс, что особый режим вообще появится. Решение принимаете не вы — вы только повышаете вероятность.","body":"**Переменная, к которой сводится весь торговый раздел.**\n\nЦенность европейских сетей — в цепочке поставок, а не в формате магазина.\nLidl дешёвый из-за общеевропейской вертикали собственных марок и сети РЦ.\nЛоготип импортируется, логистика нет.\n\n## Механика\nМагазин формата дискаунтера обслуживает 15-25 тыс человек. Город плюс область\nтеоретически держат 20-30 точек. Но такая сеть работает от РЦ на 50-80 магазинов.\nСвой РЦ на 25 точек не окупается → снабжение из польского РЦ в паре сотен км →\nвозможно только без полноценной таможенной процедуры.\n\n**Нет режима — нет сети. Есть режим — сеть приходит сама.**\n\n## Ограничение\nЭто не решение города и не решение области. Федеральный и межгосударственный уровень.\nЗацепка: в области уже существует режим ОЭЗ. Раздел писать в терминах его изменения,\nа не создания нового.","note":"01 Развилки/Таможенный режим на польской границе","at":[19.956,54.438]}],"context":{"has":{"rail":true,"tram":true},"places":[{"name":"Зеленоградск","at":[20.475,54.9597],"z":[6.2,13]},{"name":"Светлогорск","at":[20.152,54.9432],"z":[6.2,13]},{"name":"Пионерский","at":[20.2266,54.9522],"z":[9.6,13]},{"name":"Калининград","at":[20.51,54.718],"z":[6,10.6]},{"name":"Черняховск","at":[21.81,54.63],"z":[6,10.6]},{"name":"Советск","at":[21.88,55.08],"z":[6,10.6]},{"name":"Багратионовск","at":[20.64,54.39],"z":[6,10.6]},{"name":"Балтийск","at":[19.91,54.65],"z":[6,10.6]},{"name":"Мамоново · погранпереход","at":[19.956,54.438],"z":[7.4,13]}],"lines":[{"kind":"river","coords":[[20.37357,54.68912],[20.40369,54.69182],[20.42175,54.69274],[20.42466,54.69247],[20.43198,54.69343],[20.43603,54.69499],[20.44515,54.6996],[20.45248,54.70261],[20.45626,54.70444],[20.46021,54.70564],[20.4636,54.70601],[20.46752,54.70595],[20.47429,54.70458],[20.483,54.70397],[20.4861,54.70447],[20.48953,54.70566],[20.49303,54.70617],[20.50555,54.70574],[20.50597,54.70718],[20.5065,54.70801],[20.5074,54.70846],[20.50932,54.70813],[20.51184,54.70731],[20.58853,54.69262],[20.58304,54.69272],[20.57808,54.6935],[20.57278,54.69322],[20.5653,54.69392],[20.56077,54.69368],[20.55721,54.6932],[20.55526,54.69331],[20.55434,54.69393],[20.55429,54.69622],[20.55394,54.6979],[20.55223,54.69978],[20.54909,54.70194],[20.54105,54.70536],[20.53323,54.70661],[20.52415,54.7074],[20.51625,54.70743],[20.51248,54.70721]]},{"kind":"river","coords":[[20.71975,54.66472],[20.7169,54.66485],[20.71302,54.66715],[20.71053,54.66788],[20.70402,54.66912],[20.69742,54.67265],[20.69306,54.6742],[20.69089,54.67536],[20.68743,54.67855],[20.68362,54.68266],[20.6758,54.68766],[20.66967,54.68984],[20.66385,54.69238],[20.65708,54 ыта, таможня обычная":"Доминирует трансграничный шопинг: Браниево, Эльблонг, Гданьск в пределах поездки выходного дня.\n\n## Контринтуитивный эффект\nОткрытие границы работает **против** прихода сетей. Часть спроса снимается\nбез инвестиций с их стороны, порог входа на местный рынок становится выше.\n\nЕсли цель — цены для жителей, задача решена и без магазинов.\nЕсли цель — магазины в городе, этот сценарий ей мешает.","Сценарий 3 — особый режим для товаров из ЕС":"Единственный сценарий, в котором список брендов из исходного черновика реализуется.\nРЦ в Польше начинает работать на калининградскую сеть, дальше сети приходят сами.\n\n## Не в вашей власти\nФедеральный и межгосударственный уровень. Максимум городского уровня —\nзаранее иметь готовую площадку, подведённые сети и понятную процедуру,\nчтобы в случае чего не потерять два года.\n\n## Про ИКЕА отдельно\nКлассический формат рассчитан на охват от миллиона человек в пределах 1,5-2 часов.\nОбласть даёт примерно миллион — самый край. При открытой границе часть охвата\nзабирает Гданьск. Реалистичнее малый городской формат или пункт выдачи."},"refs":{"Бюджетная реальность":"# Бюджетная реальность\n\n## Порядок сумм\n- Итог концепции: **460-930 млрд руб** (примерно 5-10 млрд долларов).\n- Доходы бюджета области: порядка 140 млрд руб в год.\n- Бюджет города: порядка 25 млрд руб в год.\n\n## Что это значит\nПри горизонте 20 лет нагрузка составляет **35-45 млрд руб в год**, то есть\nпримерно четверть годового бюджета области — ежегодно, два десятилетия подряд,\nдополнительно ко всем текущим обязательствам.\n\n**Вывод: концепция не финансируется из региональных источников ни при каком\nсценарии.** Это масштаб национального проекта либо крупного внешнего инвестора.\nЭто не аргумент против концепции, это требование к разделу о финансировании:\nон должен отвечать не «где взять деньги», а «почему кто-то извне даст такие деньги».\n\n## Что почти бесплатно\n- [[Дизайн-код вывесок и фасадной рекламы]] — 1-3 млрд, эффект за сезон\n- Красные линии и вывод промзон вдоль реки — регламент, не стройка\n- Обязательный коммерческий первый этаж — правило, не деньги\n- [[Режим для малого иностранного бизнеса]] — администрирование\n\n## Что частично само себя окупает\n- [[Инфраструктура Октябрьского острова]] — застройку ведёт частный капитал\n- [[Доступ к торговому кластеру]] — сам кластер строит бизнес","Методика оценки стоимости":"# Методика оценки стоимости\n\n## Чем это является\nОценка порядка величины по аналогам. Точность примерно **плюс-минус двукратная**.\n\n## Чем это не является\nНе смета. Не обоснование инвестиций. Не основание для решения о финансировании.\n\n## Использованные ориентиры\n- Трамвай: 0,7-1,5 млрд руб за км двухпутного пути с реконструкцией улицы\n  и перекладкой сетей (российские концессии последних лет)\n- Депо: 3-5 млрд за площадку\n- Вагон: 150-400 млн в зависимости от поставщика\n- Замок: пересчёт от Гумбольдтфорума (≈680 млн евро) с поправкой\n  на объём и уровень цен\n- Историческая вилла под реставрацию: 15-50 млн за здание\n- Косметика панельного фонда: 5-15 тыс руб/м²\n- Замена фонда: 80-100 тыс руб/м²\n\n## Где цифра особенно ненадёжна\nСвойство `уверенность` у каждого проекта. Значения `очень низкая` означают,\nчто число является заглушкой и не должно использоваться ни для чего,\nкроме понимания порядка:\n- [[Очистка Преголи]] — не задан объём отложений и класс утилизации грунта\n- [[Прочие районы города]] — районы не разобраны поимённо\n- [[Воссоздание Королевского замка]] — не проведена археология","Правило очерёдности":"# Правило очерёдности: сцепка со стройкой\n\nСтоимость километра пути определяется не рельсами, а реконструкцией улицы,\nперекладкой сетей, подстанциями и депо. Перекладка сетей часто съедает половину бюджета.\n\nОтсюда правило, которое важнее любого списка маршрутов, потому что продолжает\nработать при любом изменении планов:\n\n1. **В зонах новой застройки путь кладётся до зданий.**\n   [[Октябрьский остров]], любые новые кварталы. В чистом поле дешевле кратно.\n2. **В районах капитального обновления путь кладётся одновременно с трубами.**\n   [[Балтрайон]]. Улицу всё равно вскрывают под сети — трамвай достаётся со скидкой.\n   Разнести по времени = заплатить за одну улицу дважды.\n3. **В готовых районах путь — отдельный дорогой проект.**\n   [[Сельма]]. Скидок нет, очередь по чистому пассажиропотоку.\n\n## Приоритет линий\n1. Центральный диаметр через оба вокзала — максимальный поток, и именно он делает\n   осмысленным расширение сети электричек\n2. [[Октябрьский остров]] — на опережение, окно закрывается\n3. [[Сельма]] — лучшее соотношение эффекта к затратам среди нового строительства\n4. [[Балтрайон]] — в связке с редевелопментом\n5. Торговый кластер — только если ложится на существующий коридор","Разделение торгового кластера":"# Разделение торгового кластера по типу товара\n\nПротиворечие: кластер крупноформатной торговли в городе строить нельзя,\nза городом он работает против трамвайной логики.\n\nВыход не в том, **где** разместить кластер, а в том, чтобы разделить его\n**по типу товара**.\n\n## За черту города\nМебель, стройматериалы, садовый инвентарь, всё крупногабаритное.\nСюда в любом случае приезжают на машине или за доставкой.\nБалтия Молл и окружение логично закрепить именно за этим.\n\n## В городе, в кварталах, мелким форматом\nПродукты и повседневный спрос. Здесь нужен **прямой запрет**: продовольственная\nторговля в загородный кластер не допускается.\n\nИначе он вытянет из районов ежедневный поток, и город получит американскую модель,\nгде за молоком едут на машине. Это убивает трамвай, в который только что вложились.\n\n## Это и есть европейская модель\nOBI на кольцевой, булочная у дома. Единственная конфигурация,\nпри которой кластер не ломает [[Трамвайная сеть — путь и депо]].","Чего в концепции нет":"# Чего в концепции нет\n\nСписок пробелов. Ведётся по мере проработки.\n\n## Крупные\n- **Экономическая база.** На чём город зарабатывает и почему сюда едут люди.\n  Без ответа весь торговый раздел описывает следствие отсутствующей причины,\n  а вложения в реставрацию и трамвай не имеют источника.\n- **[[Логистика анклава]].** Порт, транзит, грузовая колея.\n- **Дизайн-код как регламент.** «Неоевропеизм» пока эстетическая декларация.\n  Чтобы заработал, нужен высотный регламент по зонам, процент застройки,\n  красные линии, требование квартальной застройки вместо микрорайонной.\n  **Стиль защищается не вкусом, а ПЗЗ.**\n- **Советский слой.** Если неоевропеизм читается как стирание послевоенной\n  застройки, концепция получает врага там, где могла его не иметь.\n- **Автобус.** В транспортном разделе его нет, а он неизбежно остаётся\n  подвозящим видом и требует принципа увязки с рельсом.\n\n## Среднее\n- Механизм для долевой собственности в [[Амалиенау]]\n- Инструмент против вытеснения в [[Балтрайон]]е\n- Тарифная и билетная интеграция трамвая с электричками\n- [[Судьба существующих ТЦ]]\n- Зелёный каркас города\n- Водоснабжение и канализация как система, а не только речные стоки\n\n## Рамочное\n- **Привязка всего к смене власти** делает документ неопровержимым и нерабочим.\n  Разделить на «делаем при любой погоде» и «делаем при хорошей». Свойство\n  `сценарий` у проектов это уже отражает: почти всё имеет значение `всегда`.\n- **Название.** «Новый Кёнигсберг» уводит разговор в плоскость возвращения Германии,\n  а не городского развития. Идея опоры на наследие от переименования не пострадает,\n  проходимость вырастет заметно."},"total":{"min":459,"max":930,"avg":694.5}};

":"плохо","name":"Недовольство стройкой","text":"Перекрытые улицы и вечные объезды. Поддержка −4.","cond":"many_active"},{"id":"cartel","w":6,"kind":"плохо","name":"Сговор на торгах","text":"По одному из открытых конкурсов заявился один и тот же круг лиц. Остаток сметы +12%, градозащитники −6.","cond":"open_contract"},{"id":"carsdelay","w":6,"kind":"плохо","name":"Завод сдвинул поставку","text":"Партия вагонов уходит вправо. Закупка теряет год.","cond":"cars_active"},{"id":"crowd","w":6,"kind":"плохо","name":"Линия не справляется","text":"На построенных участках вагонов не хватает, люди не влезают. Поддержка −4.","cond":"overload"},{"id":"opening","w":7,"kind":"хорошо","name":"Пуск участка","text":"Открытие линии собрало полгорода. Поддержка +5.","cond":"line_opened"},{"id":"audit","w":5,"kind":"плохо","name":"Проверка по концессии","text":"Условия соглашения признали невыгодными для города. Поддержка −4, федеральный центр −6.","cond":"ppp_active"},{"id":"poach","w":5,"kind":"плохо","name":"Человека переманили","text":"Один из назначенных уходит в другой регион: должность снова пуста.","cond":"staffed"},{"id":"modal","w":5,"kind":"хорошо","name":"Пересели на рельс","text":"Замеры показали переток с автобуса на трамвай выше расчётного. Перевозчики −4, поток на сети выше.","cond":"net_running"},{"id":"bust","w":8,"kind":"плохо","name":"Подрядчик обанкротился","text":"Одна из строек осталась без исполнителя: работы встали, остаток сметы +15%.","cond":"risky_contractor"},{"id":"techfee","w":6,"kind":"плохо","name":"Монополия подняла присоединение","text":"Тариф на техприсоединение пересмотрен. Все новые стройки в этом году дороже.","cond":"active"},{"id":"season_hit","w":7,"kind":"плохо","name":"Пустой сезон","text":"Холодное лето и слабый спрос. Поток туристов в этом году ниже, гостиницы стоят полупустые.","cond":"tourism_on"},{"id":"season_hot","w":6,"kind":"хорошо","name":"Ажиотажный сезон","text":"Поток выше расчётного. Если есть где разместить — это деньги, если негде — это очереди и раздражение.","cond":"tourism_on"},{"id":"overcrowd","w":7,"kind":"плохо","name":"Город переполнен","text":"Мест размещения не хватает, центр забит, жители недовольны. Поддержка −5.","cond":"overtourism"},{"id":"plant_cut","w":8,"kind":"плохо","name":"Сокращение на производстве","text":"Якорное предприятие объявило о сокращении смены. Занятость падает, поддержка −4.","cond":"weak_industry"},{"id":"plant_order","w":6,"kind":"хорошо","name":"Крупный заказ","text":"Одна из отраслей получила заказ, которого не ждала: +8 к её состоянию.","cond":"industry_on"},{"id":"washout","w":6,"kind":"плохо","name":"Вымывание местной розницы","text":"Жители закупаются за границей, местные магазины закрываются. Малый бизнес −6.","cond":"open_customs"},{"id":"silting","w":7,"kind":"плохо","name":"Канал занесло","text":"Зимние штормы нанесли песок на фарватер. Проходная осадка в этом году меньше, перевалка просела.","cond":"port_on"},{"id":"linecut","w":6,"kind":"плохо","name":"Оператор увёл линию","text":"Судоходная компания сняла суда с одного из направлений: линия закрыта, открывать придётся заново.","cond":"lines_open"},{"id":"record","w":6,"kind":"хорошо","name":"Рекорд перевалки","text":"Порт отработал год с полной загрузкой причалов. Логистика +3, экономика +2.","cond":"port_busy"},{"id":"shipyard_order","w":6,"kind":"хорошо","name":"Заказ на верфь со стороны","text":"Чужой заказчик пришёл на свободный стапель: +8 млрд ₽ и судостроение +6.","cond":"yard_ok"},{"id":"gauge","w":5,"kind":"плохо","name":"Спор о колее на грузовом ходу","text":"Смена колеи снова стала предметом торга. Железная дорога −8, сухопутное плечо работает хуже.","cond":"port_on"},{"id":"amber_find","w":5,"kind":"хорошо","name":"Богатый пласт на карьере","text":"Янтарный комбинат нарастил добычу: +10 к состоянию отрасли.","cond":"amber_on"}],"verdicts":[{"min":76,"name":"Концепция состоялась","text":"Двадцать лет отработаны так, как задумано: деньги нашлись, очерёдность соблюдена, город изменился физически, а не на бумаге."},{"min":63,"name":"Сделано главное","text":"Ядро концепции стоит. Часть разделов осталась заглушками — но заявленная цель «европейский вид города» достигнута без чьего-либо разрешения."},{"min":49,"name":"Половина пути","text":"Заметная часть построена, но горизонт кончился раньше, чем стройки. Следующему сроку достаётся город с вскрытыми улицами."},{"min":35,"name":"Разрозненные объекты","text":"Отдельные проекты закончены, связной картины нет. Ровно тот исход, от которого предостерегало правило очерёдности."},{"min":0,"name":"Концепция осталась текстом","text":"За двадцать лет не набралось ни денег, ни решений. Документ остался тем, чем был на первой странице: гипотезой с оценкой стоимости."}],"roles":[{"id":"mayor","name":"Мэр","tabs":["work"],"holds":"Казна, очерёдность, подрядчики","why":"Отвечает за то, что стройки начаты вовремя, идут в правильном порядке и доведены до сдачи, а не брошены со вскрытой улицей.","metrics":[{"id":"score","name":"Общий балл города","unit":"из 100","target":70,"dec":0,"weight":40,"why":"Тот же балл, что получает партия целиком: мэр отвечает за всё сразу."},{"id":"support","name":"Поддержка жителей","unit":"из 100","target":65,"dec":0,"weight":30,"why":"Единственный показатель, который мэр теряет лично и быстро."},{"id":"finish","name":"Доведено до сдачи","unit":"% начатого","target":80,"dec":0,"weight":30,"why":"Начать может кто угодно. Правило очерёдности — про то, что сдано."}],"verdicts":[{"min":78,"name":"Город собран","text":"Стройки шли в порядке, начатое доведено до сдачи, и жители это увидели. Ровно то, чего требует правило очерёдности."},{"min":60,"name":"Работа видна","text":"Сделано много, но часть улиц осталась вскрытой, и поддержка чаще держалась на обещаниях, чем на сданных объектах."},{"min":40,"name":"Стройка вместо города","text":"Начато заметно больше, чем закончено. Горожанин двадцать лет прожил на строительной площадке и результата почти не получил."},{"min":0,"name":"Кабинет без города","text":"Ни очерёдности, ни сдач, ни поддержки. Казна расходовалась, город не менялся."}]},{"id":"transport","name":"Транспорт","tabs":["net"],"holds":"Коридоры, депо, вагоны","why":"Отвечает за то, что рельс возит людей: депо, диаметр, парк и интервал — это одна машина, и она не работает по частям.","metrics":[{"id":"pax","name":"Пассажиропоток","unit":"тыс поездок в сутки","target":200,"dec":0,"weight":35,"why":"Единственная честная мера сети: сколько человек ею поехало."},{"id":"headway","name":"Интервал","unit":"мин","target":6.5,"dec":1,"weight":25,"lower":true,"why":"Полный парк на построенный километраж. Два депо держат 130 вагонов, и на всех 71 км этого уже мало: длинная сеть сама ухудшает интервал."},{"id":"reach","name":"Охват жителей","unit":"%","target":55,"dec":0,"weight":20,"why":"Доля горожан, до которых сеть дотянулась. Предел механики — 67%."},{"id":"km","name":"Путь","unit":"км","target":55,"dec":1,"weight":20,"why":"Из 71 километра программы."}],"verdicts":[{"min":78,"name":"Сеть работает","text":"Депо, диаметр, вагоны и интервал сошлись: рельс возит людей, а не стоит в расписании."},{"min":60,"name":"Линии есть, сети нет","text":"Путь проложен, но парк или интервал не дотянули — пассажир выбирает рельс не всегда, и поток вдвое ниже возможного."},{"min":40,"name":"Рельсы без пассажиров","text":"Построенное не сложилось в систему: где-то не хватило депо, где-то вагонов, где-то центрального диаметра, и остальные линии остались отростками."},{"min":0,"name":"Трамвай остался в заметке","text":"За двадцать лет сеть не поехала. Транспортный раздел концепции не выполнен."}]},{"id":"economy","name":"Хозяйство","tabs":["port","tour","econ"],"holds":"Порт, аэропорт, линии, отрасли, туризм","why":"Отвечает за то, на чём город зарабатывает и почему сюда едут люди — за первый и второй пробелы из «Чего в концепции нет».","metrics":[{"id":"cargo","name":"Перевалка","unit":"млн тонн в год","target":24,"dec":1,"weight":28,"why":"Сумма линий, упёртая в причалы и глубину канала."},{"id":"tourflow","name":"Поток гостей","unit":"тыс в год","target":1800,"dec":0,"weight":25,"why":"Выше ёмкости размещения поток не идёт: пока нет мест, любой прирост притяжения упирается в переполненный сезон."},{"id":"jobs","name":"Рабочие места","unit":"тыс","target":75,"dec":1,"weight":22,"why":"Из ста восьми возможных, если все пять отраслей здоровы."},{"id":"revenue","name":"Доходы отраслей","unit":"млрд ₽ в год","target":22,"dec":1,"weight":25,"why":"Отрасли, порт, туризм и авиация — всё сверх базовых 5,5 млрд ₽ города и области."}],"verdicts":[{"min":78,"name":"База под городом есть","text":"Перевалка, отрасли и гости кормят бюджет развития. Пробел «на чём город зарабатывает и почему сюда едут люди» закрыт делом, а не разделом."},{"min":60,"name":"Половина базы","text":"Что-то из порта, отраслей и туризма поднято, остальное осталось на уровне первого года."},{"min":40,"name":"Следствие без причины","text":"Торговый и туристический разделы по-прежнему описывают то, чего нет: экономическая база города не выросла."},{"min":0,"name":"Анклав как был","text":"Ни глубины канала, ни линий, ни мест размещения, ни рабочих мест. Хозяйство двадцать лет не трогали."}]},{"id":"politics","name":"Политика","tabs":["dec","team"],"holds":"Федеральные деньги, развилки, регламенты, дипломатия, найм","why":"Отвечает за чужие деньги и за то, что «почти бесплатно», но действует только вовремя: развилки с окном, регламенты, отношения.","metrics":[{"id":"fedtotal","name":"Федеральных денег","unit":"млрд ₽ за партию","target":200,"dec":0,"weight":35,"why":"Накопленным итогом. Из региональных источников концепция не финансируется ни при каком сценарии."},{"id":"rels","name":"Отношения","unit":"в среднем из 100","target":65,"dec":0,"weight":30,"why":"Пять акторов, старт в среднем 49. Отношения сползают обратно."},{"id":"decided","name":"Развилки и регламенты","unit":"из 13","target":9,"dec":0,"weight":20,"why":"Семь развилок и шесть регламентов. У части есть окно."},{"id":"team","name":"Команда собрана","unit":"должностей из 7","target":5,"dec":0,"weight":15,"why":"Зама нанимает себе каждый, но за укомплектованный кабинет отвечает политика: их эффекты работают все двадцать лет."}],"verdicts":[{"min":78,"name":"Чужие деньги пришли","text":"Программа получена и продлена, отношения удержаны, развилки закрыты в срок. Всё, что стоит политического капитала, а не бетона, сработало."},{"min":60,"name":"Договорились наполовину","text":"Часть траншей и часть развилок. Где-то опоздали к закрытию окна, где-то не хватило отношений."},{"min":40,"name":"Разговоров больше, чем денег","text":"Федеральных денег почти не пришло, развилки решались задним числом или не решались вовсе."},{"min":0,"name":"Без Москвы и без области","text":"Ни программы, ни отношений, ни закрытых развилок. Город остался с собственными 5,5 млрд ₽ в год — то есть без концепции."}]}],"net":{"depot":{"share":0.14,"years":4,"cap":65,"name":"Два депо и подстанции","why":"Два депо на время миграции с метровой колеи. Пока их нет, выпускать на линию нечего: сеть стоит."},"kmTotal":71.0,"carsPerKm":2.0,"baseHeadway":6.0,"tripsPerDay":2.2,"railShare":[0.2,0.16],"trunkBonus":1.25,"paxTarget":260,"paxWeight":40,"regionWeight":12,"ringWeight":7},"districts":[{"key":"Центр","pop":55,"note":"оба вокзала, вся пересадка"},{"key":"Балтрайон","pop":75,"note":"самый населённый из разобранных"},{"key":"Сельма","pop":60,"note":"готовый район, путь без скидок"},{"key":"Амалиенау","pop":22,"note":"малоэтажный, поток небольшой"},{"key":"Октябрьский остров","pop":6,"popAfter":35,"note":"пока пустой; застройка добавляет жителей"},{"key":"Прочие районы","pop":272,"note":"больше половины города"}],"corridors":[{"id":"diametr","name":"Центральный диаметр","km":5.8,"serves":{"Центр":0.85,"Прочие районы":0.1},"order":1,"why":"Через оба вокзала. Максимальный поток, и именно он делает осмысленным расширение сети электричек. Пока его нет, остальные линии — отростки.","trunk":true,"rule":"","coords":
