<script>
/* ==================================================================== утилиты */
const $ = s => document.querySelector(s);
/* Тот же порог, что и в разметке: до 1060 px панель и карта делят один экран
   по очереди, а не стоят рядом. Число живёт в двух местах — и в @media,
   и здесь, — потому что медиазапрос из кода не спросишь. */
const narrow = () => window.innerWidth <= 1060;
function sidePanel(open){
  $('#side').classList.toggle('open', open);
  $('#scrim').classList.toggle('on', open);
}
const byId = {}, byName = {};
DATA.projects.forEach(p => { byId[p.id] = p; byName[p.name] = p; });
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const f1 = v => (Math.round(v*10)/10).toFixed(1).replace('.', ',');
const f0 = v => Math.round(v).toString();
const sgn = v => (v>0?'+':'') + f1(v);
const pct = v => (v>0?'+':'') + Math.round(v*100) + '%';
const IND = SIM.indicators, IND_KEYS = IND.map(i => i.key);
const ST_C = {idle:'#5d7085', active:'#ffb03a', done:'#4fd6bf'};
const NET = SIM.net, CORR = SIM.corridors;
const TRAM = byName[SIM.netProject], CARS = byName[SIM.carsProject];
const corrById = {}; CORR.forEach(c => corrById[c.id] = c);
const TOUR = SIM.tourism, TW = SIM.tourWorks, ENT = SIM.enterprises, ECON = SIM.econ;
const twById = {}; TW.forEach(t => twById[t.id] = t);
const entById = {}; ENT.forEach(e => entById[e.id] = e);
/* Монополии живут в той же вкладке отношений, что и остальные, — переиспользуем механику. */
const MONO = SIM.monopolies.map(m => Object.assign({mono: true}, m));
const ACTORS = SIM.actors.concat(MONO);
const conById = {}; SIM.contractors.forEach(c => conById[c.id] = c);
const PORT = SIM.port, PORTS = SIM.ports, PW = SIM.portWorks, DREDGE = SIM.dredge;
const ROUTES = SIM.routes, SHIPS = SIM.ships;
/* Терминалы, дноуглубление и судовые серии считаются одной машинерией: это работы. */
const AIR = SIM.air, AW = SIM.airWorks, FLIGHTS = SIM.flights;
const flightById = {}; FLIGHTS.forEach(f => flightById[f.id] = f);
const OW = PW.concat(DREDGE, SHIPS, AW);
const owById = {}; OW.forEach(w => owById[w.id] = w);
const portById = {}; PORTS.forEach(p => portById[p.id] = p);
const routeById = {}; ROUTES.forEach(r => routeById[r.id] = r);

function mulberry(a){ return function(){
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a>>>15, 1 | a);
  t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
  return ((t ^ t>>>14) >>> 0) / 4294967296;
};}
let rnd = mulberry(1);

/* ==================================================================== состояние */
const SAVE_KEY = 'kenigsberg-sim-v4';
let S = null;
const blankWork = () => ({st:'idle', est:0, act:0, spent:0, rate:0, years:0, forced:false,
  frozen:false, revealed:false, y0:0, y1:0, contract:'', con:''});

function newGame(seed, quiet){
  const s = seed || Math.floor(Math.random()*1e9);
  S = {
    seed: s, rc: 0,
    year: SIM.horizon.startYear, turn: 1,
    cash: SIM.money.start, pk: 3,
    ind: {}, prev: {},
    border: 'закрыта',
    fed: {tier:0, left:0, amount:0},
    priv: 0, debts: [], fedTotal: 0,
    proj: {}, forks: {}, regs: {},
    net: {works: {}, cars: 0, supplier: '', opened: 0},
    tour: {works: {}, beds: TOUR.beds, season: TOUR.season, prev: 0},
    port: {works: {}, depth: PORT.startDepth, routes: {}, prev: 0, sales: []},
    air: {routes: {}},
    ent: {}, fee: 0,
    rel: {}, staff: {}, pool: {},
    riverDebt: false, pendingStock: false, netPrev: 0, demand: null,
    log: [], acts: [], replayable: true, over: false,
    seats: {}, players: [], deal: 0, ready: {}, active: null, spend: {},
  };
  ROLES.forEach(r => { S.seats[r.id] = 0; S.spend[r.id] = {cash: 0, pk: 0}; });
  IND.forEach(i => { S.ind[i.key] = i.start; S.prev[i.key] = i.start; });
  DATA.projects.forEach(p => S.proj[p.id] = blankWork());
  S.net.works.depot = blankWork();
  CORR.forEach(c => S.net.works[c.id] = blankWork());
  TW.forEach(t => S.tour.works[t.id] = blankWork());
  OW.forEach(w => S.port.works[w.id] = blankWork());
  ROUTES.forEach(r => { if(r.existing) S.port.routes[r.id] = {since: SIM.horizon.startYear, dark: false}; });
  FLIGHTS.forEach(f => { if(f.existing) S.air.routes[f.id] = {since: SIM.horizon.startYear}; });
  ENT.forEach(e => S.ent[e.id] = {health: e.health, acts: {}});
  ACTORS.forEach(a => S.rel[a.id] = a.start);
  DATA.forks.forEach(f => { if(f.status === 'решена') S.forks[f.name] = 'vault'; });
  rnd = mulberry(s);
  SIM.posts.forEach(p => S.pool[p.id] = draftPool(p.id));
  /* Текущий поток уже учтён в стартовом значении показателя — иначе он прыгнет
     на первом же ходу просто потому, что побережье существовало и до вас. */
  S.tour.prev = tourism().bonus;
  S.port.prev = trade().bonus;
  logYear();
  if(!quiet) save();
}
function draftPool(postId){
  const all = SIM.candidates[postId].map((c,i) => i);
  const out = [];
  while(out.length < 3 && all.length) out.push(all.splice(Math.floor(R()*all.length), 1)[0]);
  return out;
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* Сохранение может быть из прежней версии: подсистемы добавлялись со временем,
   и в старом файле их блоков просто нет. Дополняем недостающее значениями
   чистой партии — иначе первый же render() падает и экран остаётся пустым. */
function migrate(s){
  if(!s || typeof s !== 'object') return null;
  const num = (v, d) => typeof v === 'number' && isFinite(v) ? v : d;
  s.seed = num(s.seed, 1); s.rc = num(s.rc, 0);
  s.year = num(s.year, SIM.horizon.startYear); s.turn = num(s.turn, 1);
  s.cash = num(s.cash, SIM.money.start); s.pk = num(s.pk, 3);
  s.priv = num(s.priv, 0); s.netPrev = num(s.netPrev, 0); s.fee = num(s.fee, 0);
  s.fedTotal = num(s.fedTotal, 0);
  s.border = s.border || 'закрыта';
  s.fed = s.fed || {tier:0, left:0, amount:0};
  s.over = !!s.over;

  s.ind = s.ind || {}; s.prev = s.prev || {};
  IND.forEach(i => {
    s.ind[i.key] = clamp(num(s.ind[i.key], i.start), 0, 100);
    s.prev[i.key] = num(s.prev[i.key], s.ind[i.key]);
  });

  s.proj = s.proj || {};
  DATA.projects.forEach(p => { if(!s.proj[p.id]) s.proj[p.id] = blankWork(); });

  s.net = s.net || {}; s.net.works = s.net.works || {};
  s.net.cars = num(s.net.cars, 0); s.net.supplier = s.net.supplier || '';
  s.net.opened = num(s.net.opened, 0);
  if(!s.net.works.depot) s.net.works.depot = blankWork();
  CORR.forEach(c => { if(!s.net.works[c.id]) s.net.works[c.id] = blankWork(); });

  s.tour = s.tour || {}; s.tour.works = s.tour.works || {};
  s.tour.beds = num(s.tour.beds, TOUR.beds);
  s.tour.season = num(s.tour.season, TOUR.season);
  s.tour.prev = num(s.tour.prev, 0);
  TW.forEach(t => { if(!s.tour.works[t.id]) s.tour.works[t.id] = blankWork(); });

  s.port = s.port || {}; s.port.works = s.port.works || {}; s.port.routes = s.port.routes || {};
  s.port.depth = num(s.port.depth, PORT.startDepth); s.port.prev = num(s.port.prev, 0);
  if(!Array.isArray(s.port.sales)) s.port.sales = [];
  OW.forEach(w => { if(!s.port.works[w.id]) s.port.works[w.id] = blankWork(); });
  ROUTES.forEach(r => { if(r.existing && !s.port.routes[r.id])
    s.port.routes[r.id] = {since: s.year, dark: false}; });

  s.air = s.air || {}; s.air.routes = s.air.routes || {};
  FLIGHTS.forEach(f => { if(f.existing && !s.air.routes[f.id])
    s.air.routes[f.id] = {since: s.year}; });

  s.ent = s.ent || {};
  ENT.forEach(e => {
    s.ent[e.id] = s.ent[e.id] || {};
    s.ent[e.id].health = clamp(num(s.ent[e.id].health, e.health), 0, 100);
    s.ent[e.id].acts = s.ent[e.id].acts || {};
  });

  s.rel = s.rel || {};
  ACTORS.forEach(a => { s.rel[a.id] = clamp(num(s.rel[a.id], a.start), 0, 100); });

  s.staff = s.staff || {}; s.pool = s.pool || {};
  SIM.posts.forEach(p => {
    if(!Array.isArray(s.pool[p.id]) || !s.pool[p.id].length)
      s.pool[p.id] = SIM.candidates[p.id].map((c,i) => i).slice(0, 3);
    const st = s.staff[p.id];
    if(st && !SIM.candidates[p.id][st.cand]) delete s.staff[p.id];
  });

  s.regs = s.regs || {}; s.forks = s.forks || {};
  DATA.forks.forEach(f => { if(f.status === 'решена' && !s.forks[f.name]) s.forks[f.name] = 'vault'; });
  if(!Array.isArray(s.log) || !s.log.length) s.log = [{year: s.year, items: []}];
  if(!Array.isArray(s.debts)) s.debts = [];
  /* Партия из прежней версии журнала не вела: её нельзя ни отматывать, ни разбирать —
     переигрывание по неполному журналу вернуло бы игрока в первый год. */
  if(!Array.isArray(s.acts)) s.acts = [];
  s.replayable = s.replayable === true;
  s.seats = s.seats || {}; s.ready = s.ready || {}; s.spend = s.spend || {};
  if(!Array.isArray(s.players)) s.players = [];
  s.deal = num(s.deal, 0);
  ROLES.forEach(r => {
    if(typeof s.seats[r.id] !== 'number') s.seats[r.id] = 0;
    const sp = s.spend[r.id] || {};
    s.spend[r.id] = {cash: num(sp.cash, 0), pk: num(sp.pk, 0)};
  });
  s.debts.forEach(d => { if(!d.role) d.role = 'mayor'; });
  if(typeof s.active !== 'number') s.active = null;
  s.effCache = null;
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const s = migrate(JSON.parse(raw));
    if(!s) return false;
    S = s;
    rnd = mulberry(S.seed);
    for(let i=0;i<S.rc;i++) rnd();      // отматываем поток к сохранённому месту
    return true;
  }catch(e){ return false; }
}
/* Все броски идут через R(), чтобы загрузка восстанавливала ту же последовательность. */
function R(){ S.rc++; return rnd(); }

/* ==================================================================== реестр строек
   Проекты из заметок и участки сети считаются одинаково: смета, подряд, простой.
   Ключ: 'p:<id>' для проекта, 'n:<id>' для депо или участка сети. */
function W(key){
  const [t, id] = key.split(':');
  return t === 'p' ? S.proj[id] : t === 't' ? S.tour.works[id]
    : t === 'o' ? S.port.works[id] : S.net.works[id];
}
function workDef(key){
  const [t, id] = key.split(':');
  if(t === 'p') return {kind:'proj', name: byId[id].name, p: byId[id]};
  if(t === 't') return {kind:'tour', name: twById[id].name, t: twById[id]};
  if(t === 'o'){ const o = owById[id];
    return {kind: o.ship ? 'ship' : o.depth ? 'dredge' : AW.includes(o) ? 'air' : 'port',
            name: o.name, o};
  }
  if(id === 'depot') return {kind:'depot', name: NET.depot.name};
  return {kind:'corr', name: corrById[id].name, c: corrById[id]};
}
function allWorks(){
  return DATA.projects.filter(p => p !== TRAM).map(p => 'p:'+p.id)
    .concat(['n:depot'], CORR.map(c => 'n:'+c.id), TW.map(t => 't:'+t.id),
            OW.map(w => 'o:'+w.id));
}
/* Профиль работы — под него подбирается подрядчик. */
function profile(key){
  const d = workDef(key);
  if(d.kind === 'corr') return 'corr';
  if(d.kind === 'depot') return 'depot';
  if(d.kind === 'tour') return 'tour';
  if(d.kind === 'ship') return 'ship';
  if(d.kind === 'dredge' || d.kind === 'port' || d.kind === 'air') return 'port';
  const n = d.p.name;
  if(['Воссоздание Королевского замка','Реставрация Амалиенау',
      'Рыночный зал (Markthalle)','Дизайн-код вывесок и фасадной рекламы'].includes(n)) return 'look';
  if(['Ливнёвка и очистные сооружения','Очистка Преголи','Набережные и вывод промзон']
     .includes(n)) return 'util';
  return 'other';
}
const conOk = (c, key) => (!c.only || c.only.includes(profile(key)))
  && (!c.need || S.rel[c.need.rel] >= c.need.min)
  && (!c.needBorder || S.border === c.needBorder);
const conLoad = id => activeKeys().filter(k => W(k).con === id).length;
const activeKeys = () => allWorks().filter(k => W(k).st === 'active');
const doneP = () => DATA.projects.filter(p => p !== TRAM && S.proj[p.id].st === 'done')
  .concat(netAgg().st === 'done' ? [TRAM] : []);
function stOf(name){ const p = byName[name]; return p ? S.proj[p.id].st : 'idle'; }

/* Трамвайная программа — это сумма своих участков, отдельной сметы у неё нет. */
function netAgg(){
  const keys = ['n:depot'].concat(CORR.map(c => 'n:'+c.id));
  let est = 0, spent = 0, act = 0, done = 0, started = 0;
  keys.forEach(k => {
    const w = W(k);
    est += w.st === 'idle' ? phaseEst(k) : w.est;
    spent += w.spent;
    if(w.st !== 'idle'){ act += w.act; started++; }
    if(w.st === 'done') done++;
  });
  return {st: done === keys.length ? 'done' : started ? 'active' : 'idle',
          est, spent, act, done, n: keys.length, revealed: true};
}
/* Смета участка — доля общей сметы трамвая из заметки, разнесённая по километражу. */
function phaseShare(key){
  const id = key.split(':')[1];
  if(id === 'depot') return NET.depot.share;
  const km = CORR.reduce((a,c) => a + c.km, 0);
  return (1 - NET.depot.share) * corrById[id].km / km;
}
/* Скидки перемножаются, но стройка не может стать дешевле трети базовой сметы
   и никогда не уходит в минус, сколько бы сцепок ни сошлось. */
function applyMods(base, key){
  let k = 1;
  mods(key).forEach(m => k *= 1 + m.pct/100);
  return base * clamp(k, 0.33, 3);
}
function phaseEst(key){ return applyMods(TRAM.avg * phaseShare(key), key); }

/* ==================================================================== деньги */
function income(){
  const g = Math.pow(1+SIM.money.growth, S.turn-1);
  let region = SIM.money.region * g;
  if(S.rel.region < 35) region *= 0.67;
  else if(S.rel.region >= 70) region *= 1.15;
  const base = SIM.money.city * g + region;
  const fed = S.fed.left > 0 ? S.fed.amount : 0;
  const debt = S.debts.reduce((a,d) => a + d.perYear, 0);
  const tax = entTax() * g;
  const tour = tourism().revenue;
  const port = trade().revenue;
  const air = aviation().revenue;
  const sales = S.port.sales.reduce((a,s) => a + s.perYear, 0);
  return {base, fed, priv: S.priv, tax, tour, port, air, sales, debt,
          all: base + fed + S.priv + tax + tour + port + air + sales};
}
function need(key){
  const w = W(key);
  if(w.st !== 'active' || w.frozen) return 0;
  const ct = SIM.contracts.find(c => c.id === w.contract);
  const relief = ct && ct.relief ? 1 - ct.relief : 1;
  /* Никогда не отрицательная: удешевление сметы ниже освоенного просто закрывает стройку. */
  return Math.max(0, Math.min(w.act - w.spent, w.rate * (w.forced ? 1.6 : 1) * relief));
}
/* Смета не может опуститься ниже уже потраченного — иначе деньги «возвращаются». */
function cut(key, share){
  const w = W(key);
  w.act = Math.max(w.spent, w.act - (w.act - w.spent) * share);
}
const burn = () => activeKeys().reduce((a,k) => a + need(k), 0);

/* ==================================================================== кадры */
function staffEff(){
  const out = {};
  SIM.posts.forEach(p => {
    const st = S.staff[p.id]; if(!st) return;
    const c = SIM.candidates[p.id][st.cand];
    Object.entries(c.eff).forEach(([k,v]) => out[k] = (out[k]||0) + v);
  });
  /* Пиарщику со временем перестают верить. */
  if(out.trust){
    const st = S.staff.press;
    const years = st ? S.year - st.since : 0;
    out.support = (out.support||0) + out.trust * years;
  }
  return out;
}
const EFF = () => S.effCache || (S.effCache = staffEff());
function clearEff(){ S.effCache = null; }

/* ==================================================================== сцепки и сметы */
function mods(key){
  const d = workDef(key), out = [];
  /* p — уже проценты: и литералы правил, и эффекты кадров приводятся к ним на месте */
  const add = (name, p) => { if(p) out.push({name, pct: Math.round(p*10)/10}); };
  const e = EFF();
  if(d.kind === 'corr'){
    const c = d.c;
    if(c.rule === 'island_first'){
      const s = stOf('Инфраструктура Октябрьского острова');
      if(s === 'done') add('остров ещё не застроен — путь в чистом поле', -25);
      else if(s === 'active') add('кладём одновременно со стройкой острова', -10);
    }
    if(c.rule === 'baltrn_sync'){
      const s = stOf('Обновление Балтрайона');
      if(s === 'active') add('улицу вскрывают под сети — рельс со скидкой', -20);
      else if(s === 'done') add('за улицу Балтрайона платим второй раз', 15);
    }
    add('заместитель по транспорту', (e.netCost||0)*100);
  }
  if(d.kind === 'depot') add('заместитель по транспорту', (e.netCost||0)*100);
  if(d.kind === 'tour'){
    if(S.rel.grid < 35) add('сетевая компания тянет присоединение', 8);
    add('заместитель по экономике и порту', (e.tourCost||0)*100);
  }
  if(['port','ship','dredge','air'].indexOf(d.kind) >= 0)
    add('заместитель по экономике и порту', (e.portCost||0)*100);
  if(d.kind === 'proj'){
    const p = d.p;
    const LOOK = ['Воссоздание Королевского замка','Реставрация Амалиенау',
      'Дизайн-код вывесок и фасадной рекламы','Рыночный зал (Markthalle)'];
    const UTIL = ['Ливнёвка и очистные сооружения','Очистка Преголи'];
    const HOUSE = ['Обновление Балтрайона','Ремонт и замена фонда Сельмы','Прочие районы города'];
    if(p.rules.includes('castle_window') && !S.forks['Замок или парк'] && S.year >= SIM.rules.castle_window.year)
      add('на площадке работает парк «Россия»', 25);
    if(S.regs.redlines && p.name === 'Набережные и вывод промзон')
      add('красные линии приняты заранее', -20);
    if(S.regs.krt && HOUSE.includes(p.name)) add('работа идёт через механизм КРТ', -8);
    if(LOOK.includes(p.name)){
      add('главный архитектор', (e.lookCost||0)*100);
      if(S.rel.her < 35) add('градозащитники против каждого решения', 15);
      else if(S.rel.her >= 70) add('совет по наследию согласует быстро', -6);
    }
    if(UTIL.includes(p.name)){
      add('руководитель по сетям', (e.utilCost||0)*100);
      if(S.rel.water < 35) add('водоканал не идёт навстречу', 12);
    }
    if(HOUSE.includes(p.name)) add('специалист по КРТ', (e.housingCost||0)*100);
    if(['Областные электрички — направления','Доступ к торговому кластеру'].includes(p.name)
       && S.rel.rail < 35) add('железная дорога держит стык', 15);
  }
  add('руководитель стройкомплекса', (e.allCost||0)*100);
  add('технологическое присоединение', techFee(key)*100);
  return out;
}
/* Монополии берут своё с каждой стройки — мимо них не пройти. */
function techFee(key){
  const util = ['util','corr','depot'].includes(profile(key));
  let f = 0;
  MONO.forEach(m => {
    if(m.util && !util) return;
    let v = m.fee + (S.mono && S.mono[m.id] || 0);
    if(S.rel[m.id] < 35) v *= 2;
    else if(S.rel[m.id] >= 70) v *= 0.6;
    f += Math.max(0, v);
  });
  return f + (S.fee || 0);
}
function estimate(key){
  const d = workDef(key);
  return d.kind === 'proj' ? applyMods(d.p.avg, key)
    : d.kind === 'tour' ? applyMods(d.t.cost, key)
    : d.o ? applyMods(d.o.cost, key) : phaseEst(key);
}
function plannedYears(key){
  const d = workDef(key), e = EFF();
  let y;
  if(d.kind === 'tour') y = d.t.years;
  else if(d.o) y = d.o.years;
  else if(d.kind === 'depot') y = NET.depot.years;
  /* Длинный хвост сети строится не одной кишкой, а параллельными участками —
     иначе 40 км растянулись бы на девятнадцать лет и не влезли в горизонт. */
  else if(d.kind === 'corr') y = clamp(Math.round(d.c.km / 2.2) + 1, 2, 10);
  else {
    y = d.p.years;
    if(S.regs.krt && ['Обновление Балтрайона','Ремонт и замена фонда Сельмы','Прочие районы города']
      .includes(d.p.name)) y -= 1;
  }
  return Math.max(1, y + (e.workYears||0));
}
function band(key){
  const d = workDef(key);
  /* У туризма и порта своей заметки нет, значит и уверенность низкая.
     Дноуглубление — отдельный разговор: объём грунта не считал никто. */
  let b = (d.kind === 'proj' ? d.p.band
        : d.kind === 'dredge' ? [0.80, 1.85]
        : d.kind === 'ship' ? [0.90, 1.35]
        : (d.kind === 'tour' || d.kind === 'port') ? [0.85, 1.50]
        : TRAM.band).slice();
  if(d.kind === 'proj' && d.p.rules.includes('castle_window') && S.forks['Археология площадки замка'])
    b = [1-(1-b[0])/2, 1+(b[1]-1)/2];
  const n = EFF().bandNarrow || 0;
  if(n) b = [1-(1-b[0])*(1-n), 1+(b[1]-1)*(1-n)];
  return b;
}
function blocked(key){
  const d = workDef(key);
  if(d.kind === 'proj'){
    if(d.p.scen !== 'всегда' && S.border === 'закрыта')
      return 'Недоступен при закрытой границе: ' + d.p.scen;
    return '';
  }
  if(d.kind === 'corr' && S.net.works.depot.st === 'idle')
    return 'Сначала депо и подстанции: выпускать на линию будет нечего';
  if(d.kind === 'tour'){
    const t = d.t;
    if(t.need && S.tour.works[t.need].st !== 'done')
      return 'Сначала: ' + twById[t.need].name;
    if(t.needEco && S.ind['экология'] < t.needEco)
      return 'Нужна экология от ' + t.needEco + ', сейчас ' + f0(S.ind['экология']);
    if(t.needRing && stOf('Прибрежное кольцо Зеленоградск — Светлогорск') !== 'done')
      return 'Нужно замкнутое прибрежное кольцо';
    if(t.needBorder && S.border === 'закрыта')
      return 'Бессмысленно при закрытой границе';
  }
  if(d.o && d.o.need && S.port.works[d.o.need].st !== 'done')
    return 'Сначала: ' + owById[d.o.need].name;
  if(d.kind === 'ship' && S.ent.ship.health < 30)
    return 'Верфь в таком состоянии серию не потянет: судостроение ниже 30';
  return '';
}
function contractOk(ct){ return !(ct.need && S.rel.dev < ct.need); }

/* ==================================================================== диспетчер действий

   Единственная точка, где меняется состояние. Любое изменение — это действие
   {t: тип, ...аргументы, who: кто подал}: его можно проверить до исполнения,
   записать в журнал, переслать по сети и воспроизвести заново.

   Проверка отделена от исполнения намеренно. Пока игра одна на один компьютер,
   это просто способ не дублировать условия между кнопкой и обработчиком;
   в сетевой партии ведущий обязан перепроверить присланное клиентом, а не
   верить на слово, и проверять он будет ровно тем же canDo().

   Все броски генератора живут только внутри run(), в неизменном порядке.
   Поэтому партия целиком выводится из двух вещей — номера и журнала действий,
   а значит её можно отмотать назад и переиграть с изменённым решением. */

const ACTIONS = {};
let REPLAY = 0;              /* >0 — идёт воспроизведение: интерфейс молчит */

/* ---- кому принадлежит действие ----------------------------------------
   Четыре руководителя: мэр, транспорт, хозяйство, политика. Владение нужно
   не для запретов — казна общая, и потратить её может любой, — а для трёх
   вещей: в журнале видно, чьё это решение; требование актора прилетает тому,
   кто за этого актора отвечает; в партии на нескольких человек чужая вкладка
   видна, но не нажимается.

   У строек владелец зависит от работы, а не от типа действия: городские
   проекты ведёт мэр, депо и участки сети — транспорт, причалы, объекты
   туризма и аэропорт — хозяйство. Отсюда и берётся спор, ради которого всё
   затевалось: направления разные, а казна одна. */
const ROLES = SIM.roles;
const roleById = {}; ROLES.forEach(r => roleById[r.id] = r);
const roleName = id => (roleById[id] || {}).name || 'все';
const postRole = id => (SIM.posts.find(p => p.id === id) || {}).role || 'politics';
const workRole = key => {
  if(typeof key !== 'string' || !W(key)) return 'mayor';
  const k = workDef(key).kind;
  if(k === 'corr' || k === 'depot') return 'transport';
  if(k === 'proj') return key === 'p:' + CARS.id ? 'transport' : 'mayor';
  return 'economy';                       /* tour, port, ship, dredge, air */
};
const actorRole = id => { const a = ACTORS.find(x => x.id === id); return a ? a.role : 'politics'; };
function demandRole(){
  const dm = SIM.demands.find(x => x.id === S.demand);
  return dm ? actorRole(dm.actor) : null;
}
function actRole(a){
  const def = a && ACTIONS[a.t];
  return def && def.role ? def.role(a) : null;
}
/* ---- места за столом --------------------------------------------------
   Действием владеет роль, а за клавиатурой сидит человек, и ролей у него
   может быть больше одной: на двоих — мэр с транспортом против хозяйства
   с политикой. Поэтому единица всего дальнейшего — место, а не роль:
   и «готов» жмёт человек, и блокируется чужое место, а не чужая роль.

   S.active — кто сейчас за клавиатурой. null значит «один держит всё»
   и ничего не заперто: так играется партия в одиночку. */
const seatOf = id => (S.seats || {})[id] || 0;
const seats = () => { const o = []; ROLES.forEach(r => { if(o.indexOf(seatOf(r.id)) < 0) o.push(seatOf(r.id)); }); return o.sort((a,b) => a-b); };
const seatCount = () => seats().length;
const soloGame = () => seatCount() <= 1;
const rolesOfSeat = i => ROLES.filter(r => seatOf(r.id) === i);
const playerName = i => ((S.players || [])[i] || {}).name || ('Игрок ' + (i + 1));
const seatTitle = i => rolesOfSeat(i).map(r => r.name).join(' + ');
const seatFull = i => playerName(i) + ' · ' + seatTitle(i);
const mySeat = () => (S.active === null || S.active === undefined) ? null : S.active;
const isReady = i => !!(S.ready || {})[i];
const waitingFor = () => seats().filter(i => !isReady(i));
/* Кто подал действие. Своё — это my seat, а присланное по сети несёт автора
   в самом действии: ведущий обязан перепроверять его от имени приславшего,
   а не от своего, иначе любой клиент сходит за любого. */
const authorOf = a => (a && typeof a.by === 'number') ? a.by : mySeat();
const seatOwns = (r, from) => {
  const me = from === undefined ? mySeat() : from;
  return me === null || !r || seatOf(r) === me;
};
function roleBlocked(a){
  const r = actRole(a);
  if(seatOwns(r, authorOf(a))) return '';
  return 'Ведёт «' + roleName(r) + '» — ' + playerName(seatOf(r)) + ': вам видно, решает он';
}

const ctOf   = id => SIM.contracts.find(c => c.id === id) || SIM.contracts[0];
const conOf  = id => conById[id] || SIM.contractors[0];
const forkOf = name => DATA.forks.find(f => f.name === name);
const regOf  = id => SIM.regs.find(r => r.id === id);
const supOf  = id => SIM.suppliers.find(s => s.id === id);
const needPk = n => 'Не хватает политического капитала: нужно ' + n + ', есть ' + S.pk;
const needCash = n => 'Не хватает денег: нужно ' + f1(n) + ' млрд ₽, в казне ' + f1(S.cash);

/* Можно ли? Пустая строка — да, иначе причина отказа человеческими словами. */
function canDo(a){
  const def = a && ACTIONS[a.t];
  if(!def) return 'Неизвестное действие';
  if(S.over) return 'Горизонт закрыт';
  const notMine = roleBlocked(a); if(notMine) return notMine;
  return def.can(a) || '';
}
/* Применить: проверка → журнал → исполнение → показ.

   В сетевой партии состояние меняет только ведущий. Гость проверяет действие
   у себя (чтобы не ждать круга ради очевидного отказа), отправляет ведущему
   и ждёт его «сделано»: так снимаются гонки вроде «двое потратили последний
   капитал», и порядок один для всех — тот, в котором действия пришли. */
function apply(a){
  if(a && a.by === undefined && mySeat() !== null) a.by = mySeat();
  const why = canDo(a);
  if(why){ if(!REPLAY) flash(why); return false; }
  if(WIRE.role === 'guest'){ netPropose(a); return true; }
  exec(a);
  if(WIRE.role === 'host') netApplied(a);
  if(!REPLAY){ clearEff(); render(); save(); }
  return true;
}
/* Действие, пришедшее от ведущего: проверять нечего — он уже проверил,
   и порядок задаёт он же. Наше дело — повторить у себя ровно то же. */
function applyFromHost(a){
  exec(a);
  clearEff(); render(); save();
}
/* Исполнение без проверки — так действия приходят при воспроизведении журнала. */
function exec(a){
  a.n = S.acts.length + 1; a.y = S.year; a.rc = S.rc;
  if(!a.who) a.who = actRole(a) || 'все';
  const cash0 = S.cash, pk0 = S.pk;
  S.acts.push(a);
  ACTIONS[a.t].run(a);
  if(a.t === 'turn') return;
  /* Квот на траты нет — есть видимость: в журнале написано, кто и на что.
     Считаем разницей, чтобы не переписывать цены в четырнадцати местах. */
  const dc = Math.round((cash0 - S.cash) * 100) / 100, dp = pk0 - S.pk;
  if(dc) a.c = dc;
  if(dp) a.p = dp;
  addSpend(a.who, dc, dp);
  /* Кто продолжает ходить, тот не готов: «готов» снимается собственным ходом. */
  const r = actRole(a);
  if(a.t !== 'ready' && r && S.ready) delete S.ready[seatOf(r)];
}
/* Квот на траты нет — есть видимость. Копим по направлениям: прямые расходы
   действия считаются разницей в exec, а стройки тянут деньги весь год сами,
   и там их приписывает владелец работы. */
function addSpend(role, cash, pk){
  const sp = S.spend && S.spend[role]; if(!sp) return;
  if(cash) sp.cash += cash;
  if(pk) sp.pk += pk;
}
function actLabel(a){
  const def = ACTIONS[a.t];
  try { return def && def.label ? def.label(a) : a.t; } catch(e){ return a.t; }
}

/* Партия — это номер плюс журнал, поэтому обратные операции не нужны:
   отменить значит проиграть заново всё, кроме последнего. Дороже по тактам
   и дешевле по коду, а главное — не может разойтись с прямым ходом. */
function rewind(n){
  const seed = S.seed, acts = S.acts.slice(0, n), pick = S.pick, sel = selKey;
  const atKeyboard = S.active;           // кто за клавиатурой — не игровое, а местное
  REPLAY++;
  try{
    newGame(seed, true);
    acts.forEach(a => exec(a));
  } finally { REPLAY--; }
  S.pick = pick || {};
  S.active = atKeyboard;
  selKey = sel;
  clearEff(); save(); render();
  if(S.demand) askDemand();
}
function canUndo(){
  const a = S.acts[S.acts.length-1];
  return !!S.replayable && !S.over && !!a && a.t !== 'turn' && a.t !== 'demand';
}
function undo(){
  if(!canUndo()) return false;
  const a = S.acts[S.acts.length-1];
  rewind(S.acts.length - 1);
  flash('Отменено: ' + actLabel(a));
  return true;
}

/* ==================================================================== действия
   Ниже — все четырнадцать. Каждое: проверка, исполнение, подпись для журнала.
   Функции под ними оставлены как были для интерфейса: собрать действие и отдать. */

function startEst(a){
  const ct = ctOf(a.ct), con = conOf(a.con);
  return {est: estimate(a.key) * (1 + ct.cost) * (1 + con.cost),
          yrs: Math.max(1, plannedYears(a.key) + ct.years + con.speed)};
}
ACTIONS.start = {
  role: a => workRole(a.key),
  can(a){
    const w = W(a.key); if(!w) return 'Такой работы нет';
    if(w.st !== 'idle') return 'Работа уже начата';
    const bl = blocked(a.key); if(bl) return bl;
    const ct = ctOf(a.ct), con = conOf(a.con);
    if(!contractOk(ct)) return 'Застройщики не пойдут в концессию при таком отношении';
    if(!conOk(con, a.key)) return con.name + ' за такую работу не возьмётся';
    if(conLoad(con.id) >= con.cap)
      return con.name + ': занято ' + con.cap + ' из ' + con.cap + ' — больше не тянет';
    const e = startEst(a);
    if(S.cash < e.est/e.yrs * 0.45) return 'В казне не хватает даже на первый год работ';
    return '';
  },
  run(a){
    const key = a.key, w = W(key), d = workDef(key);
    const ct = ctOf(a.ct), con = conOf(a.con);
    const e = startEst(a), b = band(key);
    w.st = 'active'; w.est = e.est; w.y0 = S.year; w.contract = ct.id; w.con = con.id; w.years = e.yrs;
    w.act = e.est * (b[0] + R()*(b[1]-b[0]));
    w.rate = w.act / e.yrs;
    const m = mods(key).filter(x => x.pct);
    note('Начато: ' + d.name + ' · ' + con.name + ' · ' + ct.name.toLowerCase()
       + (m.length ? ' (' + m.map(x => x.name).join('; ') + ')' : ''), 'm');
    if(con.support) S.ind['поддержка'] += con.support;
    Object.entries(con.rel || {}).forEach(([k,v]) => rel(k, v*2));
    if(ct.id === 'single'){ rel('her', -8); S.ind['поддержка'] -= 3;
      note('Единственный поставщик: градозащитники −8, поддержка −3', 'b'); }
    if(ct.id === 'ppp') note('Концессия: платить придётся после сдачи, ' + ct.term + ' лет', 'm');
    if(d.kind === 'proj' && d.p.rules.includes('castle_window')
       && !S.forks['Замок или парк'] && S.year >= SIM.rules.castle_window.year){
      S.ind['поддержка'] += SIM.rules.castle_window.support;
      note('Снос работающего парка ради стройки: поддержка ' + SIM.rules.castle_window.support, 'b');
    }
  },
  label(a){ return 'Начата стройка: ' + workDef(a.key).name + ' · ' + conOf(a.con).name
    + ' · ' + ctOf(a.ct).name.toLowerCase(); }
};
function startWork(key, contractId, conId){
  return apply({t:'start', key: key, ct: ctOf(contractId).id, con: conOf(conId).id});
}

ACTIONS.force = {
  role: a => workRole(a.key),
  can(a){ const w = W(a.key);
    return (!w || w.st !== 'active') ? 'Форсировать можно только идущую стройку' : ''; },
  run(a){ const w = W(a.key);
    w.forced = !w.forced;
    if(w.forced){ w.act *= 1.05;
      note('Форсаж: ' + workDef(a.key).name + ' — темп +60%, смета +5%', 'm'); } },

    w.frozen = !w.frozen;
    note((w.frozen ? 'Заморожено: ' : 'Возобновлено: ') + workDef(a.key).name, 'm'); },

ACTIONS.fork = {
  role: () => 'politics',
  can(a){
    const f = forkOf(a.name); if(!f) return 'Нет такой развилки';
    if(S.forks[f.name]) return 'Развилка уже решена';
    if(f.before && S.year >= f.before) return 'Окно закрылось в ' + f.before + ' году';
    if(S.pk < f.pk) return needPk(f.pk);
    if(S.cash < f.money) return needCash(f.money);
    return '';
  },
  run(a){
    const f = forkOf(a.name);
    S.pk -= f.pk; S.cash -= f.money; S.forks[f.name] = S.year;
    note('Решена развилка: ' + f.name, 'g');
    if(f.name === 'Логистика анклава'){ S.priv += 1.5; S.ind['экономика'] += 4; }
    if(f.name === 'Археология площадки замка') rel('her', 10);
    if(f.name === 'Судьба существующих ТЦ') rel('dev', 8);
    if(f.name === 'Таможенный режим на польской границе') rel('fed', 6);
  },
  label(a){ return 'Развилка: ' + a.name; }
};

ACTIONS.diplo = {
  role: () => 'politics',
  can(a){
    const ac = ACTORS.find(x => x.id === a.actor); if(!ac) return 'Нет такого собеседника';
    const act = ac.acts.find(x => x.id === a.act); if(!act) return 'Нет такого разговора';
    if(S.done && S.done[a.act]) return 'Это уже было';
    if(S.pk < act.pk) return needPk(act.pk);
    if(S.cash < (act.money||0)) return needCash(act.money);
    return '';
  },
  run(a){
    const ac = ACTORS.find(x => x.id === a.actor), act = ac.acts.find(x => x.id === a.act);
    S.pk -= act.pk; S.cash -= (act.money||0);
    rel(a.actor, act.rel);
    if(act.look) S.ind['облик'] += act.look;
    /* Разовые уступки монополий: своя подстанция, полоса отвода, концессия в сетях. */
    if(act.fee){ S.mono = S.mono || {}; S.mono[a.actor] = (S.mono[a.actor]||0) + act.fee;
      (S.done = S.done || {})[a.act] = S.year; }
    if(act.money){ (S.done = S.done || {})[a.act] = S.year; }
    if(act.risk){ S.ind['быт'] -= 3;
      note('Сети ушли в концессию: тариф для жителей выше, быт −3', 'b'); }
    note(ac.name + ': ' + act.name.toLowerCase() + ' (+' + act.rel + ')', 'g');
  },
  label(a){
    const ac = ACTORS.find(x => x.id === a.actor);
    const act = ac && ac.acts.find(x => x.id === a.act);
    return (ac ? ac.name : a.actor) + ': ' + (act ? act.name.toLowerCase() : a.act);
  }
};

function lobbyChance(tier){
  const c = doneP().length, su = S.ind['поддержка'], e = EFF();
  let base = tier === 1 ? 0.50 + 0.04*c : tier === 2 ? 0.45 + 0.04*c : 0.55 + 0.03*c;
  base += (su-50)/150 + (S.rel.fed-50)/180 + (e.lobby||0);
  if(S.rel.fed < 35) base *= 0.5;
  return clamp(base, 0.15, 0.92);
}
function lobbyReady(tier){
  const c = doneP().length, a = activeKeys().length;
  if(tier === 1) return S.fed.tier === 0 && (c >= 1 || a >= 2);
  if(tier === 2) return S.fed.tier === 1 && S.fed.left > 0 && c >= 4;
  return S.fed.tier > 0 && S.fed.left <= 0;
}
const tierDef = t => t === 1 ? SIM.federal.tier1 : t === 2 ? SIM.federal.tier2 : SIM.federal.renew;
ACTIONS.lobby = {
  role: () => 'politics',
  can(a){
    if([1,2,3].indexOf(a.tier) < 0) return 'Нет такой заявки';
    if(!lobbyReady(a.tier)) return 'Сейчас с этим в Москву не ходят';
    const def = tierDef(a.tier);
    if(S.pk < def.pk) return needPk(def.pk);
    return '';
  },
  run(a){
    const tier = a.tier, def = tierDef(tier);
    S.pk -= def.pk;
    const ok = R() < lobbyChance(tier);
    const plus = 1 + (EFF().fedPlus || 0);
    if(ok){
      if(tier === 3){ S.fed.left = 8; note('Федеральная программа продлена на 8 лет', 'g'); }
      else {
        S.fed.tier = tier;
        S.fed.amount = (tier === 1 ? SIM.federal.tier1.amount
          : SIM.federal.tier1.amount + SIM.federal.tier2.amount) * plus;
        S.fed.left = def.term;
        note(def.name + ': получено ' + f1(S.fed.amount) + ' млрд ₽ в год на ' + def.term + ' лет', 'g');
      }
      rel('fed', 6);
    } else {
      S.pk += Math.floor(def.pk/2);
      note(def.name + ': отказ. Половина политического капитала возвращается', 'b');
    }
  },
  label(a){ return 'Заявка: ' + tierDef(a.tier).name; }
};
function lobby(tier){ return apply({t:'lobby', tier: +tier}); }

/* ==================================================================== транспортная сеть */
function transport(){
  const e = EFF();
  const depot = S.net.works.depot.st === 'done';
  const built = CORR.filter(c => S.net.works[c.id].st === 'done');
  const km = built.reduce((a,c) => a + c.km, 0);
  const carsNeed = km * NET.carsPerKm;
  const cap = depot ? NET.depot.cap * 2 : 0;
  const cars = clamp(S.net.cars, 0, cap);
  let headway = 0, qual = 0;
  if(km > 0 && cars > 0){
    headway = NET.baseHeadway * Math.max(1, carsNeed/cars) * (1 + (e.headway||0));
    if(S.rel.carr < 35) headway *= 1.25;
    headway = Math.min(30, headway);
    qual = clamp(2 - headway/NET.baseHeadway, 0, 1);
  }
  const trunk = built.some(c => c.trunk) ? NET.trunkBonus : 1;
  const reach = {};
  built.forEach(c => Object.entries(c.serves).forEach(([d,v]) =>
    reach[d] = Math.min(1, (reach[d]||0) + v)));
  let pax = 0, covered = 0, popAll = 0;
  const islandBuilt = stOf('Инфраструктура Октябрьского острова') === 'done';
  let mult = 1 + (e.paxBonus||0) + (S.rel.carr >= 70 ? 0.08 : 0);
  SIM.districts.forEach(d => {
    const pop = (d.popAfter && islandBuilt) ? d.popAfter : d.pop;
    popAll += pop;
    const r = reach[d.key] || 0;
    covered += pop * r;
    if(cars > 0 && depot)
      pax += pop * NET.tripsPerDay
        * Math.min(0.5, r * (NET.railShare[0] + NET.railShare[1]*qual) * trunk * mult);
  });
  const region = stOf('Областные электрички — направления') === 'done'
    ? NET.regionWeight * (built.some(c => c.trunk) ? 1.15 : 1) : 0;
  const ring = stOf('Прибрежное кольцо Зеленоградск — Светлогорск') === 'done' ? NET.ringWeight : 0;
  const bonus = NET.paxWeight * clamp(pax/NET.paxTarget, 0, 1) + region + ring;
  return {pax, km, cars, carsNeed, cap, headway, qual, depot, bonus, region, ring,
          reach: popAll ? covered/popAll : 0, built: built.length};
}
const netRatio = () => { const t = transport();
  return CORR.reduce((a,c) => a + c.km, 0) ? t.km / CORR.reduce((a,c) => a + c.km, 0) : 0; };

/* ==================================================================== порт и торговля
   «Логистика анклава. Порт, транзит, смена колеи на грузовом направлении. Дыра
   размером в отдельный раздел, а определяет и торговлю, и промышленность,
   и экономическую базу города целиком» — развилка из хранилища, развёрнутая
   в подсистему. Перевалка не назначается: линия даёт груз, только если под неё
   есть терминал, глубина и причальный фронт. */
const portDone = id => S.port.works[id].st === 'done';
function portCaps(){
  const caps = {};
  PW.forEach(w => { if(w.gives && portDone(w.id)) caps[w.gives] = true; });
  return caps;
}
function fleetCap(){
  const f = {};
  SHIPS.forEach(s => { if(s.fleet && portDone(s.id))
    Object.entries(s.fleet).forEach(([k,v]) => f[k] = (f[k]||0) + v); });
  return f;
}
function routeOpen(r){
  const st = S.port.routes[r.id];
  if(!st) return false;
  if(r.border && !r.border.includes(S.border)) return false;   // европейские гаснут
  return true;
}
function routeReady(r){
  const caps = portCaps();
  if(r.need && !caps[r.need]) return 'нужен ' + termName(r.need);
  if(r.depth > S.port.depth) return 'нужна глубина ' + f1(r.depth) + ' м, есть ' + f1(S.port.depth);
  if(r.border && !r.border.includes(S.border)) return 'закрыта вместе с границей';
  return '';
}
const termName = g => ({container:'контейнерный терминал', ferry:'паромный терминал',
  bulk:'навалочный терминал', reefer:'рефрижератор', cruise:'круизный терминал',
  rail:'грузовой двор'})[g] || g;

/* ==================================================================== авиация
   Своего показателя у неё нет: пассажиры кормят туризм, грузы — логистику,
   рельсовая связь с городом — транспорт. Для эксклава это параллельная парому
   линия жизни, и работает она при любом режиме границы. */
function aviation(){
  let terminal = AIR.terminal, runway = AIR.runway, margin = 1, access = 0;
  let cargoCap = AIR.cargoBase, railLink = false;
  AW.forEach(w => {
    if(S.port.works[w.id].st !== 'done') return;
    if(w.pax) terminal += w.pax;
    if(w.runway) runway = Math.max(runway, w.runway);
    if(w.cargo) cargoCap += w.cargo;
    if(w.margin) margin += w.margin;
    if(w.access) access += w.access;
    if(w.id === 'railair') railLink = true;
  });
  const lines = [];
  let potential = 0;
  FLIGHTS.forEach(f => {
    if(!S.air || !S.air.routes[f.id]) return;
    if(f.border && !f.border.includes(S.border)) return;
    if(f.runway > runway) return;
    let v = f.base;
    if(f.hub && railLink) v *= 1.1;
    potential += v; lines.push({f, v});
  });
  const pax = Math.min(potential, terminal);
  const k = potential > 0 ? pax/potential : 0;
  lines.forEach(l => l.pax = l.v * k);
  const cargo = Math.min(cargoCap,
    cargoCap * (lines.some(l => l.f.cargo) ? 1 : 0.5));
  const revenue = lines.reduce((a,l) => a + l.pax * AIR.margin * l.f.margin, 0) * margin;
  /* Гости прилетают — это главный вклад авиации в туризм. */
  const tourPull = Math.max(0, pax - AIR.startPax) * AIR.tourPerPax;
  return {pax, potential, terminal, runway, cargo, cargoCap, revenue, lines,
          railLink, access, tourPull, margin,
          strain: terminal > 0 ? potential/terminal : 0};
}
function trade(){
  const caps = portCaps(), fleet = fleetCap();
  /* Мощность гаваней: то, что уже есть, плюс всё, что достроено. */
  let capacity = PORTS.reduce((a,p) => a + p.cap, 0);
  PW.forEach(w => { if(portDone(w.id)) capacity += w.cap; });
  /* Глубина решает, какого размера судно вообще дойдёт по каналу. */
  const depthK = clamp(0.55 + (S.port.depth - 9.0) * 0.15, 0.55, 1.0) * (S.port.silt ? 0.82 : 1);
  /* Сухопутное плечо: без грузового двора и при плохих отношениях с ЖД
     груз приходит в порт и там остаётся. */
  const railK = (caps.rail ? 1.0 : 0.82) * (S.rel.rail < 35 ? 0.85 : S.rel.rail >= 70 ? 1.06 : 1);

  const lines = [];
  /* Порт работает и сегодня: это существующая перевалка, а не ваша заслуга.
     Линии добавляются сверху. */
  let potential = PORT.startFlow * depthK * railK;
  const baseline = potential;
  ROUTES.forEach(r => {
    if(!routeOpen(r)) return;
    let v = r.base * depthK * railK;
    if(fleet[r.need]) v += fleet[r.need] * 0.6;     // свой флот держит линию
    if(r.lifeline && S.border === 'закрыта') v *= 1.35;  // всё уходит на переправу
    if(S.forks['Логистика анклава']) v *= 1.12;
    potential += v;
    lines.push({r, v});
  });
  /* Больше, чем тянут причалы, не перевалить: режем пропорционально. */
  const flow = Math.min(potential, capacity);
  const k = potential > 0 ? flow / potential : 0;
  lines.forEach(l => l.flow = l.v * k);
  const revenue = baseline * k * PORT.margin
    + lines.reduce((a,l) => a + l.flow * PORT.margin * l.r.margin, 0);
  const av = aviation();
  const bonus = PORT.weight * clamp(flow / PORT.target, 0, 1)
      * (0.85 + 0.15 * clamp(S.port.depth/12, 0, 1))
    + AIR.cargoWeight * clamp(av.cargo / (AIR.cargoBase + 0.13), 0, 1);
  /* Компоненты для сборки морем — стратегический ответ на закрытую границу. */
  const components = lines.some(l => l.r.components && l.flow > 0.4);
  return {flow, potential, capacity, depthK, railK, revenue, bonus, lines, caps, fleet,
          components, baseline: baseline * k,
          strain: capacity > 0 ? potential/capacity : 0};
}

/* ==================================================================== туризм
   «Почему сюда едут люди» — вторая половина пробела, названного в концепции.
   Поток не назначается, а складывается: притяжение × доступность, срезанное
   ёмкостью размещения и растянутое или не растянутое на год сезонностью. */
function tourism(){
  const done = id => S.tour.works[id].st === 'done';
  let pull = TOUR.baseFlow, allSeasonPull = TOUR.baseFlow * 0.25;
  const sources = [];
  SIM.attractors.forEach(a => {
    if(stOf(a.src) !== 'done') return;
    pull += a.pull; if(a.allSeason) allSeasonPull += a.pull;
    sources.push({name: a.src, pull: a.pull});
  });
  TW.forEach(t => {
    if(!done(t.id) || !t.pull) return;
    pull += t.pull; if(t.allSeason) allSeasonPull += t.pull;
    sources.push({name: t.name, pull: t.pull});
  });
  /* Круизный гость ночует на борту: он не упирается в номерной фонд.
     Это и есть весь смысл круизного терминала — поток без стройки гостиниц. */
  let cruisePull = 0;
  OW.forEach(o => {
    if(!o.pull || S.port.works[o.id].st !== 'done') return;
    cruisePull += o.pull;
    if(o.allSeason) allSeasonPull += o.pull;
    sources.push({name: o.name, pull: o.pull, cruise: true});
  });
  /* Янтарь работает и на бюджет, и на поток — если отрасль жива. */
  const amber = S.ent.amber ? S.ent.amber.health/100 : 0;
  const amberPull = (entById.amber.tour || 0) * 10 * amber;
  pull += amberPull; allSeasonPull += amberPull;
  if(amberPull > 1) sources.push({name: 'Янтарный комбинат', pull: amberPull});

  /* Прилетевшие — главный вклад авиации в туризм: до эксклава иначе долго. */
  const av = aviation();
  if(av.tourPull > 1){
    pull += av.tourPull; allSeasonPull += av.tourPull * 0.7;
    sources.push({name: 'Прилетевшие через Храброво', pull: av.tourPull});
  }
  /* Доступность: без транспорта поток не доезжает. */
  const t = transport();
  const access = 0.72 + 0.16 * clamp(t.pax/NET.paxTarget, 0, 1)
    + (stOf('Областные электрички — направления') === 'done' ? 0.08 : 0)
    + (stOf('Прибрежное кольцо Зеленоградск — Светлогорск') === 'done' ? 0.06 : 0)
    + av.access;
  const borderK = S.border === 'особый' ? 1.35 : S.border === 'открыта' ? 1.18 : 1;
  const k = access * borderK * (S.tour.shock || 1);
  const bedPot = pull * k, cruisePot = cruisePull * k;
  const potential = bedPot + cruisePot;

  let season = clamp(allSeasonPull / Math.max(1, pull + cruisePull), 0.2, 0.95);
  TW.forEach(t2 => { if(done(t2.id) && t2.season) season = clamp(season + t2.season, 0, 0.95); });
  const capacity = S.tour.beds * TOUR.bedYield;
  const capEff = capacity * (0.55 + 0.45 * season);
  const flow = Math.min(bedPot, capEff) + cruisePot;
  const strain = capEff > 0 ? bedPot / capEff : (bedPot > 0 ? 2 : 0);
  const satisfaction = clamp(1 - Math.max(0, strain - 1) * 0.6, 0.4, 1);
  const revenue = flow / 1000 * TOUR.spend;
  const bonus = TOUR.weight * clamp(flow/TOUR.target, 0, 1) * (0.75 + 0.25*satisfaction);
  return {pull, potential, capacity, capEff, flow, season, satisfaction, strain,
          revenue, bonus, beds: S.tour.beds, sources, access, borderK};
}

/* ==================================================================== предприятия
   «Торговля не создаёт экономическую базу. Магазины идут за доходом,
   а не наоборот». Отрасли кормят бюджет развития и держат занятость. */
function entTax(){
  return ENT.reduce((a,e) =>
    a + e.tax * (ECON.taxLag + (1-ECON.taxLag) * S.ent[e.id].health/100), 0);
}
function entJobs(){
  return ENT.reduce((a,e) => a + e.jobs * clamp(S.ent[e.id].health/100, 0, 1.15)
    + (S.ent[e.id].jobsDelta || 0), 0);
}
const baseJobs = ENT.reduce((a,e) => a + e.jobs * e.health/100, 0);

/* ==================================================================== журнал */
function logYear(){ S.log.unshift({year: S.year, items: []}); }
function note(text, kind){ if(S.log[0]) S.log[0].items.push({t: text, k: kind || ''}); }
let flashT = null;
function flash(msg){
  if(REPLAY) return;
  let el = $('#flash');
  if(!el){ el = document.createElement('div'); el.id = 'flash';

/* ==================================================================== ход года */
/* Состав стола — тоже действие: он попадает в журнал, переигрывается вместе
   с партией и по сети пойдёт тем же каналом, что и всё остальное.

   Раздача ролей считается ОТДЕЛЬНЫМ генератором. Игровой трогать нельзя:
   он задаёт события и сметы, и лишний бросок на раздаче сдвинул бы всю
   последовательность — одинаковый номер партии перестал бы давать одинаковую
   игру, а это главное её свойство. */
function dealSeats(count, dealSeed){
  const rr = mulberry(dealSeed | 0), order = ROLES.map(r => r.id);
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(rr() * (i + 1)), t = order[i];
    order[i] = order[j]; order[j] = t;
  }
  const out = {};
  order.forEach((id, i) => out[id] = i % Math.max(1, count));
  return out;
}
/* Раскладка по умолчанию, без случайности: на двоих — стройки и сеть против
   хозяйства и политики, как просит само разделение вкладок. */
function defaultSeats(count){
  const plan = {1: [0,0,0,0], 2: [0,0,1,1], 3: [0,1,2,0], 4: [0,1,2,3]}[count] || [0,0,0,0];
  const out = {};
  ROLES.forEach((r, i) => out[r.id] = plan[i]);
  return out;
}
ACTIONS.table = {
  role: () => null,
  can(a){
    if(!a.seats || ROLES.some(r => typeof a.seats[r.id] !== 'number'))
      return 'Раздача неполная: не у каждой роли есть место';
    return '';
  },
  run(a){
    S.seats = {}; ROLES.forEach(r => S.seats[r.id] = a.seats[r.id]);
    S.players = (a.players || []).map(p => ({name: String(p && p.name || '').slice(0, 24)}));
    S.deal = a.deal || 0;
    S.ready = {};
    note(soloGame() ? 'Партия в одиночку: все четыре направления у вас'
      : 'За столом ' + seatCount() + ': '
        + seats().map(i => seatFull(i)).join('; '), 'm');
  },
  label(a){
    const c = new Set(ROLES.map(r => a.seats[r.id])).size;
    return c <= 1 ? 'Состав: партия в одиночку' : 'Состав стола: ' + c + ' игрока';
  }
};
function setTable(seatMap, players, deal){
  return apply({t:'table', seats: seatMap, players: players || [], deal: deal || 0});
}

/* Год закрывается по готовности всех: пока роли у одного, закрывает кнопка,
   а как только за столом больше одного человека — «готов» от каждого.
   Это и есть место, где придётся разговаривать. */
ACTIONS.ready = {
  role: () => null,
  can(a){
    if(seats().indexOf(a.seat) < 0) return 'Нет такого места за столом';
    if(soloGame()) return 'Все роли у одного — год закрывается кнопкой';
    const from = authorOf(a);
    if(from !== null && a.seat !== from) return 'За это место жмёт другой';
    return '';
  },
  run(a){
    S.ready = S.ready || {};
    if(S.ready[a.seat]) delete S.ready[a.seat]; else S.ready[a.seat] = true;
    a.on = !!S.ready[a.seat];            // в журнале нужен тогдашний ответ, не нынешний
    note(seatFull(a.seat) + (a.on ? ': готов к следующему году'
                                  : ' — готовность снята'), 'm');
  },
  label(a){ return seatFull(a.seat) + (a.on ? ': готов' : ': снял готовность'); }
};
function setReady(seat){ return apply({t:'ready', seat: seat}); }

ACTIONS.turn = {
  role: () => null,
  can(){
    if(soloGame()) return '';
    const wait = waitingFor();
    return wait.length
      ? 'Год закрывается по готовности всех. Ещё не готовы: '
        + wait.map(i => playerName(i)).join(', ')
      : '';
  },
  run(){ runTurn(); },
  label(a){ return 'Год закрыт: ' + a.y; }
};
function endTurn(){ return apply({t:'turn'}); }
function runTurn(){
  clearEff();
  const before = {}; IND_KEYS.forEach(k => before[k] = S.ind[k]);
  const events = [], finished = [];
  let slow = 1, fedCut = 1;
  S.net.opened = 0;

  const ev = rollEvent();
  if(ev){
    events.push(ev);
    note(ev.name + ': ' + ev.text, ev.kind === 'хорошо' ? 'g' : 'b');
    if(ev.id === 'vacancy') slow = 0.8;
    if(ev.id === 'fedcut') fedCut = 0.65;
    /* Сезон считается до того, как посчитан поток, иначе эффект опоздает на год. */
    S.tour.shock = ev.id === 'season_hit' ? 0.82 : ev.id === 'season_hot' ? 1.18 : 1;
    S.port.silt = ev.id === 'silting' ? 1 : 0;
  } else { S.tour.shock = 1; S.port.silt = 0; }

  /* --- деньги --- */
  const inc = income();
  S.cash += inc.base + inc.fed*fedCut + inc.priv + inc.tax + inc.tour + inc.port
    + inc.air + inc.sales;
  /* Чужие деньги считаем накопленным итогом: это личная мера политика. */
  S.fedTotal += inc.fed * fedCut;
  /* Экспортные серии возвращаются деньгами несколько лет подряд. */
  S.port.sales.forEach(s => s.left--);
  S.port.sales = S.port.sales.filter(s => s.left > 0);
  if(ev && ev.id === 'grant') S.cash += 6;
  if(S.fed.left > 0) S.fed.left--;
  /* платежи по концессиям */
  S.debts.forEach(d => { S.cash -= d.perYear; d.left--; addSpend(d.role || 'mayor', d.perYear, 0); });
  const paid = S.debts.filter(d => d.left <= 0);
  if(paid.length) note('Концессия закрыта: ' + paid.map(d => d.name).join(', '), 'g');
  S.debts = S.debts.filter(d => d.left > 0);
  if(inc.debt > 0.05) note('Платежи по концессиям: ' + f1(inc.debt) + ' млрд ₽', 'm');

  /* --- стройки --- */
  activeKeys().forEach(key => {
    const w = W(key), d = workDef(key);
    const want = need(key) * slow;
    if(w.frozen){ w.act += (w.act - w.spent) * 0.02; return; }
    const pay = Math.min(want, Math.max(0, S.cash));
    S.cash -= pay; w.spent += pay;
    addSpend(workRole(key), pay, 0);
    if(pay < want - 0.01){
      w.act += (w.act - w.spent) * 0.03 * (1 + (EFF().stall||0));
      note('Простой: «' + d.name + '» — денег не хватило, смета растёт', 'b');
    }
    if(!w.revealed && S.year > w.y0){
      w.revealed = true;
      const diff = w.act - w.est;
      if(Math.abs(diff) > w.est*0.06)
        note('Смета уточнена: ' + d.name + ' — ' + f1(w.est) + ' → ' + f1(w.act) + ' млрд ₽',
             diff > 0 ? 'b' : 'g');
    }
    if(d.kind === 'proj' && d.p.during)
      Object.entries(d.p.during).forEach(([k,v]) => S.ind[k] += v);
    /* Репутация подрядчика — это не украшение карточки, а шанс потерять год. */
    const con = conById[w.con];
    if(con && con.risk && R() < con.risk * (w.forced ? 1.3 : 1)){
      const left = Math.max(1, Math.ceil((w.act - w.spent)/Math.max(0.01, w.rate)));
      w.rate = (w.act - w.spent) / (left + 1);
      w.act += (w.act - w.spent) * 0.06;
      note('Срыв у подрядчика «' + con.name + '»: ' + d.name + ' теряет год', 'b');
    }
    if(w.spent >= w.act - 0.005){
      w.st = 'done'; w.y1 = S.year; w.spent = w.act;
      finished.push(key);
      const ct = SIM.contracts.find(c => c.id === w.contract);
      if(ct && ct.pay){
        S.debts.push({name: d.name, perYear: w.act * ct.pay, left: ct.term,
                      role: workRole(key)});
        note('По концессии «' + d.name + '» платим ' + f1(w.act*ct.pay)
           + ' млрд ₽ в год ' + ct.term + ' лет', 'm');
      }
    }
  });

  /* --- вагоны приходят по мере оплаты --- */
  const cw = S.proj[CARS.id];
  if(cw.st !== 'idle' && S.net.supplier){
    const sp = SIM.suppliers.find(s => s.id === S.net.supplier);
    const was = S.net.cars;
    S.net.cars = Math.max(0, Math.floor(cw.spent / sp.price));
    if(S.net.cars > was) note('Поставка: +' + (S.net.cars - was) + ' вагонов, всего ' + S.net.cars, 'g');
  }

  finished.forEach(key => complete(key, events));

  if(S.pendingStock && netRatio() >= 0.5){
    S.pendingStock = false;
    Object.entries(CARS.gain).forEach(([k,v]) => S.ind[k] += v);
    note('Сеть доросла до половины — закупленные вагоны вышли на линию', 'g');
    events.push({name:'Вагоны вышли на линию', kind:'хорошо',
      text:'Подвижной состав, купленный раньше пути, наконец работает.'});
  }

  if(S.riverDebt){
    if(stOf('Ливнёвка и очистные сооружения') === 'done'){
      S.riverDebt = false; note('Стоки перекрыты — русло перестало заиливаться', 'g');
    } else {
      S.ind['экология'] -= 2;
      note('Очищенное русло заиливается снова: стоки не перекрыты. Экология −2', 'b');
    }
  }

  /* --- износ, кадры, сеть --- */
  const e = EFF();
  IND.forEach(i => { if(i.decay)
    S.ind[i.key] -= i.decay * (i.key === 'быт' ? 1 + (e.lifeDecay||0) : 1); });
  if(e.look) S.ind['облик'] += e.look;
  /* Отношения сползают к исходным: разовая встреча не работает двадцать лет. */
  ACTORS.forEach(a => {
    const k = a.id + 'Rel'; if(e[k]) rel(a.id, e[k]);
    S.rel[a.id] += (a.start - S.rel[a.id]) * 0.08;
  });

  /* --- отрасли: куда они идут сами и что с ними делает граница --- */
  const jobsBefore = entJobs();
  ENT.forEach(en => {
    const st = S.ent[en.id];
    let d = en.drift + (e.entDrift || 0);
    if(en.border) d += en.border[S.border];
    if(S.forks['Логистика анклава'] && ['auto','fish','ship'].includes(en.id))
      d += ECON.logisticsBonus;
    if(en.id === 'small'){
      d += Math.max(0, S.ind['облик'] - 45) * ECON.smallFromLook
         + tourism().flow/100 * ECON.smallFromTour;
      if(S.border === 'открыта') d += ECON.washout;
      if(S.regs.firstfloor) d += 1.2;
      if(S.regs.goods) d += 1.0;
    }
    if(en.riverside && st.movedRiver) d += 0.5;
    /* Порт кормит отрасли: сборку — компонентами морем, рыбу — холодом и флотом. */
    const tp = trade();
    if(en.id === 'auto' && tp.components) d += 2.4;
    if(en.id === 'auto' && tp.flow > 12) d += 0.6;
    if(en.id === 'fish') d += (portDone('reefer') ? 1.0 : 0) + (portDone('fishing') ? 1.2 : 0);
    if(en.id === 'ship') d += SHIPS.filter(s => S.port.works[s.id].st === 'active').length * 1.1;
    st.health = clamp(st.health + d, 0, 100);
  });
  const jobs = entJobs();
  S.ind['экономика'] += (jobs - jobsBefore) * 0.25;
  S.ind['поддержка'] += (jobs - baseJobs) * ECON.jobsToSupport;

  const t = transport();
  S.ind['транспорт'] += t.bonus - (S.netPrev || 0);
  S.netPrev = t.bonus;

  /* --- порт: перевалка и линии --- */
  const tp = trade();
  S.ind['логистика'] += tp.bonus - (S.port.prev || 0);
  S.port.prev = tp.bonus;
  if(tp.strain > 1.2 && tp.potential > 0)
    note('Линии дают больше груза, чем тянут причалы: '
       + f1(tp.potential) + ' против ' + f1(tp.capacity) + ' млн тонн', 'b');
  ROUTES.forEach(r => {
    if(S.port.routes[r.id] && r.border && !r.border.includes(S.border)){
      if(!S.port.routes[r.id].dark){
        S.port.routes[r.id].dark = true;
        note('Линия «' + r.name + '» встала вместе с режимом границы', 'b');
      }
    } else if(S.port.routes[r.id] && S.port.routes[r.id].dark){
      S.port.routes[r.id].dark = false;
      note('Линия «' + r.name + '» снова работает', 'g');
    }
  });

  /* --- туризм: поток, ёмкость, перегрев --- */
  const tr = tourism();
  S.ind['туризм'] += tr.bonus - (S.tour.prev || 0);
  S.tour.prev = tr.bonus;
  if(tr.strain > 1.15 && tr.potential > 0){
    S.ind['поддержка'] -= TOUR.crowdPenalty * Math.min(1, tr.strain - 1);
    note('Поток упёрся в ёмкость: мест нет, центр забит, жители недовольны', 'b');
  }

  /* --- поддержка --- */
  const dLife = (S.ind['быт'] - before['быт']) + (S.ind['транспорт'] - before['транспорт']);
  S.ind['поддержка'] += dLife*0.6 - (S.ind['поддержка'] - 50)*0.14
    - Math.min(1.8, Math.max(0, activeKeys().length - 5) * 0.4) + (e.support || 0);

  applyEventNumbers(ev);
  IND_KEYS.forEach(k => S.ind[k] = clamp(S.ind[k], 0, 100));

  const moved = rollBorder();
  if(moved) events.push(moved);

  /* --- требование одного из акторов: показывается отдельным блоком с выбором --- */
  S.demand = rollDemand();

  const gain = pkGain();
  S.pk += gain;

  if(S.fed.left > 0 && S.cash > 40){
    const lost = (S.cash - 40) * 0.15;
    S.cash -= lost;
    note('Неосвоенные лимиты сняты: ' + f1(lost) + ' млрд ₽. Деньги дают под стройку, '
       + 'а не под остаток на счету', 'b');
  }
  /* Раз в четыре года на рынке появляются новые люди. */
  if(S.turn % 4 === 0) SIM.posts.forEach(p => { if(!S.staff[p.id]) S.pool[p.id] = draftPool(p.id); });

  const deltas = {}; IND_KEYS.forEach(k => deltas[k] = S.ind[k] - before[k]);
  const wasYear = S.year;
  S.turn++;
  if(S.turn > SIM.horizon.years) S.over = true;
  else { S.year++; logYear(); }
  IND_KEYS.forEach(k => S.prev[k] = before[k]);
  S.ready = {};                          // новый год — готовность заново
  clearEff();
  if(REPLAY) return;                    // при воспроизведении интерфейс молчит
  save(); render();
  if(S.over) finale();
  else yearModal(wasYear, events, finished, deltas, inc, gain);
}
/* Подсистем стало больше, и капитала на них нужно больше: иначе половина
   вкладок так и останется декорацией за все двадцать лет. */
function pkGain(){ return Math.max(1, Math.round(2.8 + (S.ind['поддержка']-50)/22)); }

function complete(key, events){
  const d = workDef(key), w = W(key);
  const con = conById[w.con];
  if(con && con.look){ S.ind['облик'] += con.look;
    note(con.name + ': качество видно без объяснений, облик +' + con.look, 'g'); }
  if(d.o){
    const o = d.o, bits = [];
    if(o.depth){ S.port.depth = Math.max(S.port.depth, o.depth);
      bits.push('канал углублён до ' + f1(o.depth) + ' м'); }
    if(typeof o.cap === 'number') bits.push('перевалка +' + f1(o.cap) + ' млн тонн');
    if(o.gives) bits.push('появился ' + termName(o.gives));
    if(o.ship){ S.ent.ship.health = clamp(S.ent.ship.health + o.ship, 0, 100);
      bits.push('судостроение +' + o.ship); }
    if(o.fish){ S.ent.fish.health = clamp(S.ent.fish.health + o.fish, 0, 100);
      bits.push('рыбопереработка +' + o.fish); }
    if(o.rail) rel('rail', o.rail);
    if(o.river){ S.ent.ship.movedRiver = true;
      bits.push('грузовой фронт ушёл из города — берег свободен'); }
    if(o.sell){ S.port.sales.push({perYear: o.sell/o.sellYears, left: o.sellYears});
      bits.push('серия продана: ' + f1(o.sell/o.sellYears) + ' млрд ₽ в год '
        + o.sellYears + ' лет'); }
    if(o.pax) bits.push('терминал +' + f1(o.pax) + ' млн пассажиров');
    if(o.runway) bits.push('полоса ' + o.runway + ' м');
    if(o.transport){ S.ind['транспорт'] += o.transport;
      bits.push('аэропорт связан с городом рельсом, транспорт +' + o.transport); }
    if(o.access) bits.push('доступность для гостей выше');
    if(typeof o.cap === 'number') S.ind['экономика'] += Math.min(3, o.cap * 0.4);
    note('Готово: ' + o.name + ' за ' + f1(w.act) + ' млрд ₽', 'g');
    events.push({name:'Готово: ' + o.name, kind:'хорошо', text: bits.join(', ') + '.'});
    return;
  }
  if(d.kind === 'tour'){
    const t = d.t;
    if(t.beds) S.tour.beds += t.beds;
    if(t.amber) S.ent.amber.health = clamp(S.ent.amber.health + t.amber, 0, 100);
    note('Открыто: ' + t.name + ' за ' + f1(w.act) + ' млрд ₽', 'g');
    const bits = [];
    if(t.pull) bits.push('притяжение +' + t.pull + ' тыс гостей в год');
    if(t.beds) bits.push('мест размещения +' + t.beds + ' тыс');
    if(t.season) bits.push('круглогодичность +' + Math.round(t.season*100) + ' пунктов');
    events.push({name:'Открыто: ' + t.name, kind:'хорошо', text: bits.join(', ') + '.'});
    return;
  }
  if(d.kind !== 'proj'){
    if(d.kind === 'corr'){
      S.net.opened++;
      note('Открыт участок: ' + d.name + ' — ' + f1(d.c.km) + ' км за ' + f1(w.act) + ' млрд ₽', 'g');
      events.push({name:'Открыт участок: ' + d.name, kind:'хорошо',
        text: f1(d.c.km) + ' км пути. ' + (transport().cars ? '' : 'Вагонов на линии пока нет — '
          + 'участок построен, но не работает.')});
    } else {
      note('Построены депо и подстанции: сеть может работать', 'g');
      events.push({name:'Депо готово', kind:'хорошо',
        text:'Два депо и подстанции. Теперь построенные участки могут работать.'});
    }
    if(netAgg().st === 'done'){
      Object.entries(TRAM.gain).forEach(([k,v]) => S.ind[k] += v);
      note('Трамвайная программа закрыта целиком', 'g');
    }
    return;
  }
  const p = d.p, g = Object.assign({}, p.gain), msgs = [];
  const RETAIL = ['Режим для малого иностранного бизнеса','Рыночный зал (Markthalle)',
                  'Доступ к торговому кластеру'];
  const e = EFF();
  if(p.rules.includes('stock_needs_track') && netRatio() < 0.5){
    S.pendingStock = true; S.ind['поддержка'] -= 3;
    msgs.push('Сеть построена меньше чем наполовину — вагоны уходят в депо. Поддержка −3.');
    Object.keys(g).forEach(k => delete g[k]);
  }
  if(p.rules.includes('river_order') && stOf('Ливнёвка и очистные сооружения') !== 'done'){
    g['экология'] = (g['экология']||0) * 0.5; S.riverDebt = true;
    msgs.push('Русло очищено раньше, чем перекрыты стоки: половина эффекта, и он будет таять.');
  }
  if(p.rules.includes('embankment_needs_clean')){
    if(S.ind['экология'] < 45){
      Object.keys(g).forEach(k => g[k] *= 0.6);
      msgs.push('Вода в реке всё ещё грязная — набережные работают на 60%.');
    }
    if(!S.ent.ship.movedRiver){
      Object.keys(g).forEach(k => g[k] *= 0.7);
      msgs.push('Верфь по-прежнему на берегу: набережная упирается в забор, 70% эффекта.');
    }
  }
  if(p.rules.includes('cluster_rail')){
    const onRail = S.net.works.mall.st === 'done';
    g['транспорт'] = onRail ? 2 : -4;
    msgs.push(onRail ? 'Кластер лёг на рельсовый коридор.'
      : 'Ветки к кластеру нет — он сел на трассу и работает против трамвайной логики.');
    if(!S.regs.goods){
      S.ind['транспорт'] -= 3; S.ent.small.health -= 5;
      msgs.push('Товарные группы не разделены: кластер вытянул из районов ежедневный '
        + 'поток, за молоком поехали на машине. Транспорт −3, малый бизнес −5.');
    }
  }
  if(p.rules.includes('castle_window') && S.forks['Археология площадки замка']){
    g['облик'] = (g['облик']||0) + 5;
    msgs.push('Воссоздание опирается на подлинные конструкции — объект признают наследием.');
  }
  if(e.ecoBonus && g['экология']) g['экология'] *= 1 + e.ecoBonus;
  const bs = SIM.border.states.find(x => x.key === S.border);
  if(RETAIL.includes(p.name) && g['экономика']){
    const k = S.border === 'особый' ? 1.6 : S.border === 'закрыта' ? 0.7 : 1;
    if(k !== 1){ g['экономика'] *= k;
      msgs.push(bs.name + ': торговый эффект ' + (k>1?'усилен':'ослаблен') + '.'); }
  }
  if(p.rules.includes('small_biz_scenario') && S.border === 'особый'){
    Object.keys(g).forEach(k => g[k] *= 2);
    msgs.push('Особый режим: РЦ в Польше работает на местную сеть — эффект удвоен.');
  }
  if(S.regs.firstfloor && ['Обновление Балтрайона','Ремонт и замена фонда Сельмы',
      'Реставрация Амалиенау','Прочие районы города','Инфраструктура Октябрьского острова']
      .includes(p.name)) g['экономика'] = (g['экономика']||0) + 1;
  if(!S.forks['Судьба существующих ТЦ'] && RETAIL.includes(p.name)){
    S.ind['поддержка'] -= 2;
    msgs.push('Крупные собственники ТЦ не договорены: поддержка −2.');
  }
  if(p === CARS && S.net.supplier){
    const sp = SIM.suppliers.find(s => s.id === S.net.supplier);
    if(sp.id === 'catalog'){ g['облик'] = (g['облик']||0) - 4;
      msgs.push('Широкий габарит: узкие улицы старого центра остались без линии.'); }
    if(sp.id === 'narrow'){ g['облик'] = (g['облик']||0) + 5;
      msgs.push('Узкий вагон прошёл по старому центру.'); }
    if(sp.id === 'domestic'){ rel('fed', 10);
      msgs.push('Заказ ушёл на российский завод: федеральный центр +10.'); }
  }
  Object.entries(g).forEach(([k,v]) => S.ind[k] += v);
  if(p.private) S.priv += p.private * (S.rel.dev >= 60 ? 1.25 : S.rel.dev < 40 ? 0.6 : 1);
  S.proj[p.id].gained = g;
  note('Завершено: ' + p.name + ' за ' + f1(w.act) + ' млрд ₽', 'g');
  events.push({name:'Завершено: ' + p.name, kind:'хорошо',
    text: (msgs.join(' ') + ' ' + gainsText(g)).trim()});
}
function gainsText(g){
  const s = Object.entries(g).filter(([,v]) => Math.abs(v) > 0.05).map(([k,v]) => k + ' ' + sgn(v));
  return s.length ? 'Итог: ' + s.join(', ') + '.' : '';
}

/* ==================================================================== события */
function rollEvent(){
  if(R() > 0.62) return null;
  const ok = SIM.events.filter(e => condOk(e.cond));
  if(!ok.length) return null;
  let tot = ok.reduce((a,e) => a+e.w, 0), r = R()*tot;
  for(const e of ok){ r -= e.w; if(r <= 0) return e; }
  return ok[0];
}
function condOk(c){
  if(!c) return true;
  const A = activeKeys(), t = transport();
  switch(c){
    case 'active': return A.length > 0;
    case 'many_active': return A.length >= 4;
    case 'fed': return S.fed.left > 0;
    case 'housing_idle': return ['Обновление Балтрайона','Ремонт и замена фонда Сельмы']
      .every(n => stOf(n) === 'idle');
    case 'river_active': return stOf('Очистка Преголи') === 'active';
    case 'mall_open': return !S.forks['Судьба существующих ТЦ'] && S.ind['экономика'] > 52;
    case 'coast_done': return stOf('Прибрежное кольцо Зеленоградск — Светлогорск') === 'done';
    case 'arch_done': return !!S.forks['Археология площадки замка']
      && stOf('Воссоздание Королевского замка') !== 'idle';
    case 'look_rising': return S.ind['облик'] > 45;
    case 'open_contract': return A.some(k => W(k).contract === 'open');
    case 'ppp_active': return A.some(k => W(k).contract === 'ppp') || S.debts.length > 0;
    case 'cars_active': return S.proj[CARS.id].st === 'active';
    case 'overload': return t.km > 0 && t.cars > 0 && t.headway > 10;
    case 'line_opened': return S.net.opened > 0;
    case 'staffed': return Object.keys(S.staff).length > 0;
    case 'net_running': return t.pax > 40;
    case 'risky_contractor': return A.some(k => (conById[W(k).con]||{}).risk >= 0.2);
    case 'tourism_on': return tourism().flow > 400;
    case 'overtourism': return tourism().strain > 1.05;
    case 'industry_on': return true;
    case 'weak_industry': return ENT.some(e => S.ent[e.id].health < 40);
    case 'open_customs': return S.border === 'открыта' && S.ent.small.health > 25;
    case 'amber_on': return S.ent.amber.health > 20;
    case 'port_on': return Object.keys(S.port.routes).length > 0;
    case 'lines_open': return Object.keys(S.port.routes).length >= 2;
    case 'port_busy': return trade().strain > 0.9 && trade().flow > 12;
    case 'yard_ok': return S.ent.ship.health >= 55;
  }
  return true;
}
function applyEventNumbers(ev){
  if(!ev) return;
  const A = activeKeys();
  const rest = k => { const w = W(k); return w.act - w.spent; };
  const pickA = list => list.length ? list[Math.floor(R()*list.length)] : null;
  switch(ev.id){
    case 'inflation': A.forEach(k => W(k).act += rest(k)*0.07); break;
    case 'delay': { const k = pickA(A); if(k){ const w = W(k);
        w.rate = (w.act - w.spent) / Math.max(1, Math.ceil((w.act-w.spent)/w.rate) + 1);
        note('Срыв сроков: ' + workDef(k).name + ' — год потерян', 'b'); } } break;
    case 'tender': { const k = pickA(A); if(k){ cut(k, 0.10);
        note('Торги сыграли вниз: ' + workDef(k).name, 'g'); } } break;
    case 'cartel': { const k = pickA(A.filter(x => W(x).contract === 'open'));
        if(k){ W(k).act += rest(k)*0.12; rel('her', -6);
          note('Сговор на торгах: ' + workDef(k).name, 'b'); } } break;
    case 'carsdelay': { const w = S.proj[CARS.id];
        if(w.st === 'active'){ w.rate = (w.act - w.spent)
            / Math.max(1, Math.ceil((w.act-w.spent)/w.rate) + 1); } } break;
    case 'crowd': S.ind['поддержка'] -= 4; break;
    case 'opening': S.ind['поддержка'] += 5; break;
    case 'audit': S.ind['поддержка'] -= 4; rel('fed', -6); break;
    case 'poach': { const ids = Object.keys(S.staff);
        if(ids.length){ const id = ids[Math.floor(R()*ids.length)];
          note('Ушёл с поста: ' + postName(id), 'b');
          delete S.staff[id]; S.pool[id] = draftPool(id); clearEff(); } } break;
    case 'modal': rel('carr', -4); S.ind['транспорт'] += 2; break;
    case 'pipes': S.ind['быт'] -= 3; S.ind['поддержка'] -= 3; break;
    case 'silt': { const w = S.proj[byName['Очистка Преголи'].id];
        if(w.st === 'active') w.act += (w.act - w.spent)*0.25; } break;
    case 'mall': S.ind['поддержка'] -= 5; break;
    case 'season': S.ind['экономика'] += 3; break;
    case 'dig': { S.ind['облик'] += 3;
        const k = 'p:' + byName['Воссоздание Королевского замка'].id;
        if(W(k).st === 'active') cut(k, 0.12); } break;
    case 'press': S.ind['поддержка'] += 4; break;
    case 'protest': S.ind['поддержка'] -= 4 * (1 + (EFF().protest||0)); break;
    case 'bust': { const k = pickA(A.filter(x => (conById[W(x).con]||{}).risk >= 0.2));
        if(k){ const w = W(k);
          w.act += (w.act - w.spent)*0.15;
          w.rate = (w.act - w.spent) / Math.max(1, Math.ceil((w.act-w.spent)/w.rate) + 2);
          note('Банкротство подрядчика: ' + workDef(k).name + ' встала', 'b'); } } break;
    case 'techfee': S.fee = (S.fee||0) + 0.02;
        note('Техприсоединение подорожало навсегда: +2% к смете каждой новой стройки', 'b');
        break;
    case 'overcrowd': S.ind['поддержка'] -= 5; break;
    case 'plant_cut': { const weak = ENT.filter(e => S.ent[e.id].health < 40);
        if(weak.length){ const e = weak[Math.floor(R()*weak.length)];
          S.ent[e.id].health = clamp(S.ent[e.id].health - 7, 0, 100);
          S.ind['поддержка'] -= 4; note('Сокращение: ' + e.name, 'b'); } } break;
    case 'plant_order': { const e = ENT[Math.floor(R()*ENT.length)];
        S.ent[e.id].health = clamp(S.ent[e.id].health + 8, 0, 100);
        note('Крупный заказ: ' + e.name + ' +8', 'g'); } break;
    case 'washout': S.ent.small.health = clamp(S.ent.small.health - 6, 0, 100); break;
    case 'amber_find': S.ent.amber.health = clamp(S.ent.amber.health + 10, 0, 100); break;
    case 'silting': S.port.silt = 1; break;
    case 'linecut': { const ids = Object.keys(S.port.routes);
        if(ids.length){ const id = ids[Math.floor(R()*ids.length)];
          delete S.port.routes[id];
          note('Линия закрыта оператором: ' + routeById[id].name, 'b'); } } break;
    case 'record': S.ind['логистика'] += 3; S.ind['экономика'] += 2; break;
    case 'shipyard_order': S.cash += 8;
        S.ent.ship.health = clamp(S.ent.ship.health + 6, 0, 100); break;
    case 'gauge': rel('rail', -8); break;
  }
}
function rollBorder(){
  const solved = S.forks['Таможенный режим на польской границе'] ? 1 : 0;
  const p = SIM.border.p, cur = S.border;
  const tries = cur === 'закрыта' ? [['открыта', p['закрыта>открыта'][solved]]]
    : cur === 'открыта' ? [['особый', p['открыта>особый'][solved]], ['закрыта', p['открыта>закрыта'][solved]]]
    : [['открыта', p['особый>открыта'][solved]]];
  for(const [to, prob] of tries){
    const boost = to === 'особый' && S.rel.fed >= 65 ? 1.4 : 1;
    if(R() < prob*boost){
      S.border = to;
      const bs = SIM.border.states.find(x => x.key === to);
      note('Режим границы изменился: ' + bs.name, to === 'особый' ? 'g' : 'm');
      return {name: bs.name, kind: to === 'особый' ? 'хорошо' : to === 'закрыта' ? 'плохо' : 'нейтрально',
              text: bs.note + (S.regs.ready && to === 'особый'
                ? ' Площадка и процедура готовы заранее — эффект приходит сразу.' : '')};
    }
  }
  return null;
}
function rollDemand(){
  if(R() > 0.32) return null;
  const ok = SIM.demands.filter(d => {
    if(d.id === 'dm_fed' && S.fed.left <= 0) return false;
    if(d.id === 'dm_carr' && transport().km === 0) return false;
    if(d.id === 'dm_her' && !activeKeys().length) return false;
    if(d.id === 'dm_dev' && S.rel.dev > 75) return false;
    return true;
  });
  return ok.length ? ok[Math.floor(R()*ok.length)].id : null;
}
ACTIONS.demand = {
  /* Требование прилетает не «в игру», а роли, которая отвечает за этого
     актора: застройщики — хозяйству, градозащитники — мэру, перевозчики —
     транспорту, область и Москва — политике. Остальные видят и советуют. */
  role: () => demandRole(),
  can(){ return S.demand ? '' : 'Никто ничего не требует'; },
  run(a){ runDemand(a.yes); },
  label(a){ const dm = SIM.demands.find(x => x.id === a.dm);
    return (a.yes ? 'Уступка: ' : 'Отказ: ') + (dm ? dm.name : '—'); }
};
function answerDemand(yes){ return apply({t:'demand', yes: !!yes, dm: S.demand}); }
function runDemand(yes){
  const dm = SIM.demands.find(x => x.id === S.demand);
  S.demand = null;
  if(!dm) return;
  if(yes){
    rel(dm.actor, dm.rel);
    const c = dm.cost || {};
    if(c.money){ S.cash -= c.money; }
    if(c.ind) Object.entries(c.ind).forEach(([k,v]) => S.ind[k] += v);
    if(c.delay){ const A = activeKeys();
      if(A.length){ const k = A[Math.floor(R()*A.length)], w = W(k);
        w.rate = (w.act - w.spent) / Math.max(1, Math.ceil((w.act-w.spent)/w.rate) + c.delay);
        note('Работы приостановлены: ' + workDef(k).name, 'b'); } }
    if(c.rush){ const A = activeKeys();
      if(A.length){ const k = A[Math.floor(R()*A.length)], w = W(k);
        w.act += (w.act - w.spent)*c.rush; w.forced = true;
        note('Форсируем к отчётной дате: ' + workDef(k).name, 'b'); } }
    note('Уступка: ' + dm.name, 'm');
  } else {
    rel(dm.actor, dm.relNo);
    if(dm.indNo) Object.entries(dm.indNo).forEach(([k,v]) => S.ind[k] += v);
    note('Отказ: ' + dm.name, 'b');
  }
  IND_KEYS.forEach(k => S.ind[k] = clamp(S.ind[k], 0, 100));
}

/* Трассы участков сети рисуются отдельно — у трамвайного проекта своей больше нет,
   а ветка к кластеру принадлежит сети, а не проекту доступа. */
function geoData(){
  const polys = [], lines = [];
  DATA.projects.forEach(p => {
    if(p === TRAM) return;
    const skipLines = p.name === 'Доступ к торговому кластеру';
    (p.geom||[]).forEach(g => {
      const pr = {id:'p:'+p.id, kind:g.kind||'other', st:S.proj[p.id].st, name:p.name};
      if(g.type === 'polygon') polys.push(feat({type:'Polygon',coordinates:[g.coords]}, pr));
      else if(!skipLines) lines.push(feat({type:'LineString',coordinates:g.coords}, pr));
    });
  });
  CORR.forEach(c => { if(c.coords.length)
    lines.push(feat({type:'LineString',coordinates:c.coords},
      {id:'n:'+c.id, kind:'tram', st:S.net.works[c.id].st, name:c.name})); });
  return {polys:fc(polys), lines:fc(lines)};
}
/* Морские линии живут отдельным слоем: их масштаб — не городской. */
function seaData(){
  const air = FLIGHTS.map(f => {
    const open = !!(S.air && S.air.routes[f.id]);
    const dark = open && f.border && !f.border.includes(S.border);
    return feat({type:'LineString', coordinates:[AIR.at, f.at]},
      {id:'f:'+f.id, name:f.name, region:'авиа',
       st: dark ? 'dark' : open ? 'done' : 'idle'});
  });
  return fc(air.concat(ROUTES.map(r => {
    const open = !!S.port.routes[r.id];
    const dark = open && r.border && !r.border.includes(S.border);
    return feat({type:'LineString', coordinates:r.coords},
      {id:'r:'+r.id, name:r.name, region:r.region,
       st: dark ? 'dark' : open ? 'done' : 'idle'});
  })));
}
